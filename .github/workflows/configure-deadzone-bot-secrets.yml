name: ⚙️ Configure DeadZone-Bot Secrets

run-name: ⚙️ Configure DeadZone-Bot Secrets · ${{ github.actor }}

# Securely push Cloudflare Worker secrets for the `deadzone-bot` Worker
# using existing GitHub Actions credentials — no local Wrangler OAuth,
# no secret values in YAML, no secret values in logs.
#
# Architecture (Home → Bot-runtime → Worker):
#   DeadZone-Home (this workflow, public)
#     ↓ uses CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (Actions secrets)
#     ↓ uses GH_TOKEN to clone DeadZone-Offical/DeadZone-File (private)
#     ↓ sources the central runtime (bot.env + build.env) — values read
#       only as in-memory strings, never echoed
#     ↓ reads Worker `wrangler` CLI from DeadZone-Bot (private)
#     ↓ pushes secrets to `deadzone-bot` Worker via `wrangler secret put`
#
# Required GitHub Actions repository secrets on DeadZone-Home:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token (Workers Scripts:Edit).
#   CLOUDFLARE_ACCOUNT_ID — 32-hex Cloudflare account ID.
#   GH_TOKEN              — Fine-grained PAT authorized on DeadZone-File
#                           (the central runtime source) with
#                           Contents: Read-only. Used only for the
#                           private `actions/checkout` of DeadZone-File.
#   DEADZONE_BOT_TOKEN    — Fine-grained PAT for DeadZone-Bot checkout
#                           (Contents: Read-only). Same scope as the
#                           one already required by bot-deploy.yml.
#
# Target Cloudflare Worker:
#   name: deadzone-bot
#   account: the account whose ID matches CLOUDFLARE_ACCOUNT_ID.
#   source: DeadZone-Offical/DeadZone-Bot (private)
#
# Worker secrets configured by this workflow:
#   TELEGRAM_BOT_TOKEN     ← DeadZone-File/bot.env:TELEGRAM_BOT_TOKEN
#   GITHUB_BUILD_TOKEN     ← DeadZone-File/bot.env:GITHUB_BUILD_TOKEN
#   BUILD_EVENT_SECRET     ← DeadZone-File/build.env:BUILD_PROGRESS_SECRET
#                            (the bot reads BUILD_EVENT_SECRET; the central
#                            runtime stores the same value under
#                            BUILD_PROGRESS_SECRET. See
#                            .github/workflows/superinspector-core.yml for
#                            the equivalence comment.)
#   TELEGRAM_WEBHOOK_SECRET ← generated fresh each run via
#                             `openssl rand -hex 32` (64 hex chars /
#                             256 bits of entropy). Rotating this value
#                             invalidates the active Telegram webhook;
#                             re-run .github/workflows/deploy-bot.yml
#                             after this workflow so the bot calls
#                             setWebhook with the new secret.
#
# Critical security properties:
#   * Never calls `wrangler login` or `wrangler auth login`.
#   * Wrangler is authenticated exclusively through CLOUDFLARE_API_TOKEN
#     (passed as the CLOUDFLARE_API_TOKEN env var; Wrangler 3.x reads
#     this natively — no extra flag is needed).
#   * Secret values are never put in YAML, never echoed, never putenv'd
#     to a step log, and never written to disk outside the runner's
#     ephemeral filesystem (which is destroyed at job end).
#   * Generated TELEGRAM_WEBHOOK_SECRET is masked via `::add-mask::`
#     before any process that could log it is invoked.
#   * `set +x` is enabled inside every step that touches a secret so
#     bash does not echo values into the trace.
#   * Idempotent: re-running this workflow reconciles the four secrets
#     to the current source values. `wrangler secret put` overwrites
#     without creating duplicates.
#
# Triggers:
#   workflow_dispatch only. No scheduled trigger.
#
# Permissions:
#   contents: read  (only needed for `actions/checkout` of Bot).
#   No write permissions are requested. Wrangler writes Worker secrets
#   via the Cloudflare API using CLOUDFLARE_API_TOKEN, not via GitHub.

on:
  workflow_dispatch:
    inputs:
      regenerate_webhook_secret:
        description: "Rotate TELEGRAM_WEBHOOK_SECRET (yes/no). yes always generates a fresh value; no is reserved for future use (Wrangler does not currently expose secret values for read-back, so 'no' will refuse to run)."
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      confirm_rotation:
        description: "Type 'rotate' to confirm you understand that rotating TELEGRAM_WEBHOOK_SECRET invalidates any active Telegram webhook until you re-run deploy-bot.yml. Required only when regenerate_webhook_secret=yes."
        required: false
        default: "rotate"
        type: string

concurrency:
  # Never run two configure-secrets jobs in parallel against the same
  # Worker — the second run could race the first on the
  # TELEGRAM_WEBHOOK_SECRET rotation step.
  group: deadzone-bot-configure-secrets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure-secrets:
    name: ⚙️ Configure deadzone-bot Worker secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_NAME: deadzone-bot
      CENTRAL_RUNTIME_REPO: DeadZone-Offical/DeadZone-File
      BOT_REPO: DeadZone-Offical/DeadZone-Bot
      BOT_REF: main
      REGEN_WEBHOOK: ${{ inputs.regenerate_webhook_secret || 'yes' }}
      CONFIRM_ROTATION: ${{ inputs.confirm_rotation || '' }}
      # Inject the Cloudflare credentials at job level so EVERY step
      # (including the pre-flight validation below, which runs before
      # any step-level env: takes effect) has them in its shell env.
      # Wrangler 3.x reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
      # from the environment natively, so this also keeps Wrangler
      # authentication working without any per-step plumbing.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Inject GH_TOKEN at job level for the same reason: the pre-flight
      # validation runs before any step-level env: takes effect, and it
      # uses `actions/checkout` of DeadZone-File (private central runtime)
      # downstream. GH_TOKEN is a Contents:Read-only PAT on DeadZone-File.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      # ---- 1. Pre-flight credential validation (length/format only) ----
      - name: 🛂 Validate launcher credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN. Add it at https://github.com/${{ github.repository }}/settings/secrets/actions" >&2
            exit 1
          }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          }
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 hex chars; got '${CLOUDFLARE_ACCOUNT_ID}'." >&2
            exit 1
          fi
          if [[ "${CLOUDFLARE_API_TOKEN}" == *"REPLACE"* || "${CLOUDFLARE_API_TOKEN}" == *"CHANGEME"* ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN looks like an unresolved placeholder; refusing to run." >&2
            exit 1
          fi
          # GH_TOKEN is needed to clone DeadZone-File (private runtime source).
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "::error::Missing GH_TOKEN (used to clone DeadZone-File, the central runtime source)." >&2
            exit 1
          }
          if [[ "${GH_TOKEN}" == *"REPLACE"* || "${GH_TOKEN}" == *"CHANGEME"* || "${GH_TOKEN}" == *"xxxxx"* ]]; then
            echo "::error::GH_TOKEN looks like an unresolved placeholder; refusing to run." >&2
            exit 1
          fi
          # Confirm the user understands webhook-secret rotation when they
          # asked for it. Without this gate, an accidental workflow_dispatch
          # could invalidate the live Telegram webhook.
          if [[ "${REGEN_WEBHOOK}" == "yes" && "${CONFIRM_ROTATION}" != "rotate" ]]; then
            echo "::error::regenerate_webhook_secret=yes requires confirm_rotation=rotate. Refusing to rotate." >&2
            exit 1
          fi
          echo "✅ Launcher credentials present and well-formed."

      # ---- 2. Clone DeadZone-Bot for wrangler CLI + wrangler.jsonc ----
      - name: 📥 Checkout DeadZone-Bot (private, for wrangler + config)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BOT_REPO }}
          ref: ${{ env.BOT_REF }}
          token: ${{ secrets.DEADZONE_BOT_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      # ---- 3. Clone DeadZone-File for bot.env + build.env ----
      - name: 📥 Checkout DeadZone-File (private central runtime source)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_RUNTIME_REPO }}
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          path: central-runtime
          persist-credentials: false

      # ---- 4. Install npm deps + wrangler in the bot repo ----
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: 📦 Install npm dependencies (provides wrangler)
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      - name: 🔧 Confirm wrangler resolves
        working-directory: cloudflare
        run: |
          set -Eeuo pipefail
          npx wrangler --version
          python3 -c 'import json; cfg=json.load(open("wrangler.jsonc")); print("worker_name="+cfg.get("name",""))'

      # ---- 5. Authenticate wrangler via env (no `wrangler login`) ----
      # Wrangler 3.x reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
      # from env automatically. We additionally pin the worker name so a
      # future rename of `name:` in wrangler.jsonc cannot mis-target.
      - name: 🔐 Verify Wrangler can reach the Cloudflare account
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          # `wrangler whoami` confirms the token is valid without
          # exposing any secret material.
          npx wrangler whoami 2>&1 | sed -E 's/(Account ID:[[:space:]]*)[a-f0-9]+/\1<redacted>/Ig'

      # ---- 6. Confirm the Worker exists before we touch its secrets ----
      - name: 🔍 Confirm Worker exists and is reachable
        id: worker-check
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ env.WORKER_NAME }}
        run: |
          set -Eeuo pipefail
          # deployments list exits non-zero when the worker doesn't exist
          # or the token cannot reach the account.
          if ! npx wrangler deployments list --name "${WORKER_NAME}" >/dev/null 2>&1; then
            echo "::error::Worker '${WORKER_NAME}' not reachable in account ${CLOUDFLARE_ACCOUNT_ID}. Aborting." >&2
            exit 1
          fi
          echo "✅ Worker '${WORKER_NAME}' reachable in account ${CLOUDFLARE_ACCOUNT_ID}."

      # ---- 7. Helper script: write kv_reader.py to runner temp ----
      # Putting the Python helper in a file (rather than inline YAML)
      # avoids YAML's literal-block indentation rules breaking the
      # script. The helper reads `KEY=VALUE` lines from a .env-style
      # file and prints VALUE to stdout. It never logs anything else.
      - name: 🧰 Write kv reader helper
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/dz-secrets"
          cat > "${RUNNER_TEMP}/dz-secrets/kv_reader.py" <<'PYEOF'
          import sys
          path, target = sys.argv[1], sys.argv[2]
          value = ""
          with open(path, "r", encoding="utf-8") as fh:
              for line in fh:
                  if line.startswith(target + "="):
                      value = line[len(target) + 1:].rstrip("\n")
                      break
          if not value:
              sys.stderr.write("missing " + target + "\n")
              sys.exit(2)
          sys.stdout.write(value)
          PYEOF
          # Sanity: the file must not contain any obvious credential
          # pattern (it is a reader, not a value store).
          grep -qE 'gh[pousr]_[A-Za-z0-9_]{20,}|[0-9]{8,10}:[A-Za-z0-9_-]{35}' \
            "${RUNNER_TEMP}/dz-secrets/kv_reader.py" \
            && { echo "::error::kv_reader.py appears to contain a credential pattern; aborting." >&2; exit 1; }
          echo "✅ kv_reader.py written."

      # ---- 8. Load runtime values from central-runtime into GITHUB_ENV ----
      # Each load step:
      #   * disables shell tracing
      #   * reads VALUE via kv_reader.py into a local shell var
      #   * validates shape (regex) without printing VALUE
      #   * masks VALUE via ::add-mask::
      #   * writes VALUE to GITHUB_ENV as a heredoc (multi-line safe)
      #   * unsets VALUE before exiting the step

      - name: 🔐 Load TELEGRAM_BOT_TOKEN from central runtime
        id: load_telegram
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          value="$(python3 "${RUNNER_TEMP}/dz-secrets/kv_reader.py" central-runtime/bot.env TELEGRAM_BOT_TOKEN)"
          # Telegram tokens: 8-10 digits, ':', then base64url chars.
          if [[ ! "${value}" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN in bot.env is malformed; refusing to push." >&2
            unset value
            exit 1
          fi
          printf '::add-mask::%s\n' "${value}"
          {
            printf 'TELEGRAM_BOT_TOKEN<<EOF_DZ_%s\n' "${GITHUB_RUN_ID}"
            printf '%s\n' "${value}"
            printf 'EOF_DZ_%s\n' "${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
          unset value
          echo "✅ TELEGRAM_BOT_TOKEN loaded (shape valid, masked, never echoed)."

      - name: 🔐 Load GITHUB_BUILD_TOKEN from central runtime
        id: load_github
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          value="$(python3 "${RUNNER_TEMP}/dz-secrets/kv_reader.py" central-runtime/bot.env GITHUB_BUILD_TOKEN)"
          # GitHub tokens start with ghp_/ghs_/ghu_/gho_/ghr_/github_pat_.
          if [[ ! "${value}" =~ ^(gh[pousr]_|github_pat_)[A-Za-z0-9_]+$ ]]; then
            echo "::error::GITHUB_BUILD_TOKEN in bot.env has unexpected prefix; refusing to push." >&2
            unset value
            exit 1
          fi
          printf '::add-mask::%s\n' "${value}"
          {
            printf 'GITHUB_BUILD_TOKEN<<EOF_DZ_%s\n' "${GITHUB_RUN_ID}"
            printf '%s\n' "${value}"
            printf 'EOF_DZ_%s\n' "${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
          unset value
          echo "✅ GITHUB_BUILD_TOKEN loaded (prefix matches expected pattern, masked)."

      - name: 🔐 Load BUILD_EVENT_SECRET from central runtime
        id: load_build_event
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          # build.env stores the value as BUILD_PROGRESS_SECRET (per
          # superinspector-core.yml comment). The bot reads it under
          # the name BUILD_EVENT_SECRET — same value, different label.
          value="$(python3 "${RUNNER_TEMP}/dz-secrets/kv_reader.py" central-runtime/build.env BUILD_PROGRESS_SECRET)"
          # The existing BUILD_PROGRESS_SECRET is a 64-char hex string
          # (sha256). Validate shape only.
          if [[ ! "${value}" =~ ^[0-9a-f]{32,128}$ ]]; then
            echo "::error::BUILD_PROGRESS_SECRET in build.env is malformed; refusing to push." >&2
            unset value
            exit 1
          fi
          printf '::add-mask::%s\n' "${value}"
          {
            printf 'BUILD_EVENT_SECRET<<EOF_DZ_%s\n' "${GITHUB_RUN_ID}"
            printf '%s\n' "${value}"
            printf 'EOF_DZ_%s\n' "${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
          unset value
          echo "✅ BUILD_EVENT_SECRET loaded from BUILD_PROGRESS_SECRET (hex-only, masked)."

      # ---- 9. Generate TELEGRAM_WEBHOOK_SECRET ----
      # Per spec: generate fresh via openssl rand -hex 32 unless the
      # user explicitly asked to preserve the existing value. We do
      # NOT attempt to read the existing Worker secret back — Wrangler
      # does not expose secret values, and that is the correct security
      # property. Therefore 'no' is currently rejected.
      - name: 🆕 Generate TELEGRAM_WEBHOOK_SECRET
        id: gen_webhook
        shell: bash
        env:
          REGEN_WEBHOOK: ${{ env.REGEN_WEBHOOK }}
        run: |
          set -Eeuo pipefail
          set +x
          if [[ "${REGEN_WEBHOOK}" != "yes" ]]; then
            echo "::error::Preserve-mode requires reading back the existing Worker secret, which Wrangler does not expose. Re-run with regenerate_webhook_secret=yes." >&2
            exit 1
          fi
          # 64 hex chars (256 bits) of cryptographically secure entropy.
          generated="$(openssl rand -hex 32)"
          if [[ ! "${generated}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::openssl rand produced unexpected output; aborting." >&2
            unset generated
            exit 1
          fi
          # Mask before any other step can see it.
          printf '::add-mask::%s\n' "${generated}"
          {
            printf 'TELEGRAM_WEBHOOK_SECRET<<EOF_DZ_%s\n' "${GITHUB_RUN_ID}"
            printf '%s\n' "${generated}"
            printf 'EOF_DZ_%s\n' "${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
          unset generated
          echo "✅ TELEGRAM_WEBHOOK_SECRET generated (64 hex chars, masked)."

      # ---- 10. Push the four secrets to the Worker ----
      # `wrangler secret put <NAME>` reads the secret value from stdin
      # and uploads it encrypted via the Cloudflare API. Wrangler never
      # echoes the value back, but we also avoid `set -x` here for
      # defense in depth.
      #
      # The load steps above write each secret to $GITHUB_ENV in the
      # canonical GitHub Actions heredoc form. The Actions runner
      # parses that file between steps and exposes the value as a real
      # environment variable in subsequent steps, so the push steps
      # below read the value directly from the shell environment with
      # `${TELEGRAM_BOT_TOKEN}` etc. (no file roundtrip, no regex
      # extractor, no second helper script). The value is piped to
      # `wrangler secret put` via `printf '%s\n'` and never echoed.

      - name: 🚀 Push TELEGRAM_BOT_TOKEN to deadzone-bot
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ env.WORKER_NAME }}
        run: |
          set -Eeuo pipefail
          set +x
          [[ -n "${TELEGRAM_BOT_TOKEN:-}" ]] || {
            echo "::error::TELEGRAM_BOT_TOKEN is empty in runner env; load step did not write it." >&2
            exit 1
          }
          printf '::add-mask::%s\n' "${TELEGRAM_BOT_TOKEN}"
          printf '%s\n' "${TELEGRAM_BOT_TOKEN}" \
            | npx wrangler secret put TELEGRAM_BOT_TOKEN --name "${WORKER_NAME}" >/dev/null
          echo "✅ TELEGRAM_BOT_TOKEN pushed (env-var-sourced, masked)."

      - name: 🚀 Push GITHUB_BUILD_TOKEN to deadzone-bot
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ env.WORKER_NAME }}
        run: |
          set -Eeuo pipefail
          set +x
          [[ -n "${GITHUB_BUILD_TOKEN:-}" ]] || {
            echo "::error::GITHUB_BUILD_TOKEN is empty in runner env; load step did not write it." >&2
            exit 1
          }
          printf '::add-mask::%s\n' "${GITHUB_BUILD_TOKEN}"
          printf '%s\n' "${GITHUB_BUILD_TOKEN}" \
            | npx wrangler secret put GITHUB_BUILD_TOKEN --name "${WORKER_NAME}" >/dev/null
          echo "✅ GITHUB_BUILD_TOKEN pushed (env-var-sourced, masked)."

      - name: 🚀 Push BUILD_EVENT_SECRET to deadzone-bot
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ env.WORKER_NAME }}
        run: |
          set -Eeuo pipefail
          set +x
          [[ -n "${BUILD_EVENT_SECRET:-}" ]] || {
            echo "::error::BUILD_EVENT_SECRET is empty in runner env; load step did not write it." >&2
            exit 1
          }
          printf '::add-mask::%s\n' "${BUILD_EVENT_SECRET}"
          printf '%s\n' "${BUILD_EVENT_SECRET}" \
            | npx wrangler secret put BUILD_EVENT_SECRET --name "${WORKER_NAME}" >/dev/null
          echo "✅ BUILD_EVENT_SECRET pushed (env-var-sourced, masked)."

      - name: 🚀 Push TELEGRAM_WEBHOOK_SECRET to deadzone-bot
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ env.WORKER_NAME }}
        run: |
          set -Eeuo pipefail
          set +x
          [[ -n "${TELEGRAM_WEBHOOK_SECRET:-}" ]] || {
            echo "::error::TELEGRAM_WEBHOOK_SECRET is empty in runner env; generate step did not write it." >&2
            exit 1
          }
          printf '::add-mask::%s\n' "${TELEGRAM_WEBHOOK_SECRET}"
          printf '%s\n' "${TELEGRAM_WEBHOOK_SECRET}" \
            | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --name "${WORKER_NAME}" >/dev/null
          echo "✅ TELEGRAM_WEBHOOK_SECRET pushed (env-var-sourced, masked)."

      # ---- 11. Validation: confirm names are set, never values ----
      - name: 🔬 Validate secrets are present (names only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ env.WORKER_NAME }}
        run: |
          set -Eeuo pipefail
          set +x
          # `wrangler secret list` prints secret NAMES only — never values.
          required=(TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET BUILD_EVENT_SECRET GITHUB_BUILD_TOKEN)
          listed="$(npx wrangler secret list --name "${WORKER_NAME}" 2>&1 || true)"
          # Surface the inventory for diagnostics, but explicitly redact
          # any "Value" field that some Wrangler versions include.
          echo "Worker secret inventory (raw response):"
          printf '%s\n' "${listed}" \
            | sed -E 's/(^|[^A-Za-z0-9_])"Value"([^A-Za-z0-9_]|$)/\1"Value (redacted)"\2/gI'
          # Parse the JSON object array and extract only `.name` fields.
          # Wrangler returns one JSON object per secret on a single line
          # (no pretty-printing), e.g. `{"name":"TELEGRAM_BOT_TOKEN","type":"secret_text"}`.
          # We must NEVER extract or echo `.Value` / `.value` — names only.
          if ! printf '%s' "${listed}" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::wrangler secret list did not return a JSON array; cannot validate secrets safely. Aborting." >&2
            echo "::error::Raw response was: ${listed}" >&2
            exit 1
          fi
          secret_names="$(printf '%s' "${listed}" | jq -r '.[].name' 2>/dev/null || true)"
          if [[ -z "${secret_names}" ]]; then
            echo "::error::wrangler secret list returned an empty name list. Aborting." >&2
            exit 1
          fi
          missing=0
          for name in "${required[@]}"; do
            if ! grep -qxF "${name}" <<<"${secret_names}"; then
              echo "::error::Worker secret missing: ${name}" >&2
              missing=1
            else
              echo "  ✅ ${name}"
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "::error::One or more Worker secrets are not configured. Aborting." >&2
            exit 1
          fi
          echo "✅ All four Worker secrets present."

      - name: 🔬 Probe Worker /health endpoint
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ env.WORKER_NAME }}
        run: |
          set -Eeuo pipefail
          url="https://${WORKER_NAME}.${CLOUDFLARE_ACCOUNT_ID}.workers.dev/health"
          echo "Probing ${url}"
          # Do NOT pass any header that contains a secret. /health must
          # be unauthenticated; if it 5xx, that points to a missing
          # required secret (the bot refuses to boot without all four).
          code="$(curl --silent --output /tmp/dz-health.txt --write-out '%{http_code}' --max-time 20 "${url}" || echo 000)"
          echo "HTTP ${code}"
          if [[ "${code}" == "200" ]]; then
            echo "✅ Worker /health returned 200."
          elif [[ "${code}" =~ ^5 ]]; then
            echo "::error::Worker /health returned HTTP ${code}. The Worker likely failed to load one of the four required secrets. Re-run this workflow and inspect the Cloudflare Workers log stream for ${WORKER_NAME}." >&2
            exit 1
          else
            # 401/403/404 are not necessarily fatal — /health may not be
            # exposed. Surface the body for diagnosis without leaking
            # secrets.
            echo "Worker /health returned HTTP ${code} (non-200). Body excerpt:"
            head -c 512 /tmp/dz-health.txt || true
            echo ""
          fi
          # Remove the response body so it is not kept in the runner temp.
          rm -f /tmp/dz-health.txt

      - name: 📋 Summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          # Print a name-only summary. Never include values.
          cat <<'SUMMARY'
          ┌──────────────────────────────────────────────────────────────┐
          │ DeadZone-Bot Worker secrets reconciled                      │
          │                                                              │
          │   TELEGRAM_BOT_TOKEN     ← DeadZone-File/bot.env             │
          │   GITHUB_BUILD_TOKEN     ← DeadZone-File/bot.env             │
          │   BUILD_EVENT_SECRET     ← DeadZone-File/build.env           │
          │                              (BUILD_PROGRESS_SECRET)        │
          │   TELEGRAM_WEBHOOK_SECRET ← generated (openssl rand -hex 32)│
          │                                                              │
          │ If TELEGRAM_WEBHOOK_SECRET was rotated, re-run              │
          │   .github/workflows/deploy-bot.yml                          │
          │ so the bot calls Telegram setWebhook with the new value.    │
          └──────────────────────────────────────────────────────────────┘
          SUMMARY
