name: DeadZone Drive ROM Catalog

on:
  workflow_dispatch:
  # Keep all indexing logic in this workflow: Home is workflows-only.
  push:
    branches: [main]
    paths:
      - .github/workflows/deadzone-drive-catalog.yml
  schedule:
    - cron: "7,37 * * * *"
  workflow_run:
    workflows:
      - Deadzone-Lite
      - "🥷 DeadZone Ninja"
      - DeadZone-Xiaomi-Port
      - Deadzone-Stable
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deadzone-drive-catalog-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified Google Drive ROM index
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This is a PUBLIC metadata index. The bot repository itself is private;
      # raw.githubusercontent.com cannot anonymously serve its private files.
      - name: Require permission to publish the public index
        shell: bash
        env:
          PUBLIC_CATALOG_TOKEN: ${{ secrets.DEADZONE_PUBLIC_CATALOG_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PUBLIC_CATALOG_TOKEN" ]] || {
            echo "::error::Configure DEADZONE_PUBLIC_CATALOG_TOKEN (or GH_TOKEN) with Contents: Read and write on DeadZone-Offical/DeadZone-Offical"
            exit 2
          }

      - name: Checkout public catalog repository (NOT Home)
        uses: actions/checkout@v4
        with:
          repository: DeadZone-Offical/DeadZone-Offical
          ref: main
          path: catalog-repo
          fetch-depth: 1
          token: ${{ secrets.DEADZONE_PUBLIC_CATALOG_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true

      - name: Install rclone
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update > /dev/null
          sudo apt-get install -qq -y rclone > /dev/null

      - name: Read the NEW Google Drive account and build catalog
        shell: bash
        env:
          DEADZONE_RCLONE_CONFIG_BASE64: ${{ secrets.DEADZONE_RCLONE_CONFIG_BASE64 }}
        run: |
          set -Eeuo pipefail
          [[ -n "${DEADZONE_RCLONE_CONFIG_BASE64:-}" ]] || {
            echo "::error::GitHub Actions secret DEADZONE_RCLONE_CONFIG_BASE64 is required"
            exit 1
          }
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          config="$tmp/rclone.conf"
          if ! printf '%s' "$DEADZONE_RCLONE_CONFIG_BASE64" | base64 --decode > "$config"; then
            echo "::error::Invalid Google Drive secret"
            exit 1
          fi
          chmod 600 "$config"

          # The source folder ID belongs to the verified NEW Google account.
          rclone --config "$config" lsjson --dirs-only "DeadZoneDrive:" > "$tmp/folders.json"
          python3 - "$tmp/folders.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              folders = json.load(stream)
          expected = "10JPnmpweh7qDNMYRbijnG-uENb3EhQ4r"
          if not any(f.get("IsDir") and f.get("Name") == "DeadZone" and f.get("ID") == expected for f in folders):
              print("::error::Google Drive destination is not the NEW verified DeadZone folder")
              sys.exit(1)
          print("Verified NEW Google Drive folder ID")
          PY

          rclone --config "$config" lsjson --recursive --files-only "DeadZoneDrive:DeadZone" > "$tmp/inventory.json"
          # Inline indexer: do not rely on scripts/ or data/ in DeadZone-Home.
          python3 - "$tmp/inventory.json" "catalog-repo/catalog/drive-catalog.json" "$config" <<'PY'
          #!/usr/bin/env python3
          """Build the public /dz ROM catalog from a private, read-only rclone listing.
          
          Credentials never leave the GitHub runner. Publish only metadata and public
          Drive links for complete ROM ZIPs under DeadZone/<project>/<device>/<OS>/.
          """
          from __future__ import annotations
          
          import datetime as dt
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit
          
          FOLDER_ID = "10JPnmpweh7qDNMYRbijnG-uENb3EhQ4r"
          REMOTE = "DeadZoneDrive:DeadZone"
          PROJECTS = {"stable": "Stable", "lite": "Lite", "port": "Port", "ninja": "Ninja"}
          DEVICE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$")
          OS_FOLDER = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$")
          MAX_ARTIFACTS = 2000
          
          
          def safe_link(url: str) -> bool:
              try:
                  parsed = urlsplit(url)
                  return (
                      parsed.scheme == "https"
                      and parsed.hostname == "drive.google.com"
                      and not parsed.username
                      and not parsed.password
                      and parsed.port is None
                      and parsed.path.startswith(("/file/d/", "/open", "/uc"))
                  )
              except ValueError:
                  return False
          
          
          def published_at(value: str) -> str:
              if not value:
                  return ""
              try:
                  return dt.datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(dt.timezone.utc).isoformat().replace("+00:00", "Z")
              except (TypeError, ValueError):
                  return ""
          
          
          def read_old(path: Path) -> dict:
              try:
                  old = json.loads(path.read_text("utf-8"))
                  if old.get("version") == 1 and old.get("sourceFolderId") == FOLDER_ID:
                      return old
              except (OSError, ValueError, AttributeError):
                  pass
              return {}
          
          
          def produce(input_path: Path, output_path: Path, config_path: Path) -> int:
              raw = json.loads(input_path.read_text("utf-8"))
              if not isinstance(raw, list):
                  raise ValueError("rclone listing must be an array")
              old = read_old(output_path)
              old_links = {
                  (entry.get("id"), entry.get("path")): entry.get("url")
                  for entry in old.get("artifacts", [])
                  if isinstance(entry, dict)
              }
              candidates = []
              ids = set()
              for record in raw:
                  if not isinstance(record, dict) or record.get("IsDir") is not False:
                      continue
                  rel_path = record.get("Path")
                  if not isinstance(rel_path, str) or "\\" in rel_path or rel_path.startswith("/"):
                      continue
                  segments = rel_path.split("/")
                  if len(segments) != 4:
                      continue
                  project, codename, os_folder, filename = segments
                  project = PROJECTS.get(project.lower())
                  if not project or not DEVICE.fullmatch(codename) or not OS_FOLDER.fullmatch(os_folder):
                      continue
                  if not filename.lower().endswith(".zip") or not filename or any(ord(ch) < 32 for ch in filename):
                      continue
                  size = record.get("Size")
                  identity = record.get("ID")
                  if type(size) is not int or size <= 0 or not isinstance(identity, str) or not re.fullmatch(r"[A-Za-z0-9_-]{8,256}", identity):
                      continue
                  if identity in ids:
                      continue
                  ids.add(identity)
                  candidates.append({
                      "id": identity,
                      "path": rel_path,
                      "project": project,
                      "codename": codename.lower(),
                      "os": os_folder,
                      "name": filename,
                      "size": size,
                      "modifiedAt": published_at(record.get("ModTime", "")),
                  })
              if len(candidates) > MAX_ARTIFACTS:
                  raise ValueError("Drive contains more ROMs than the configured safe catalog limit")
              artifacts = []
              for candidate in candidates:
                  cache_key = (candidate["id"], candidate["path"])
                  link = old_links.get(cache_key)
                  if not isinstance(link, str) or not safe_link(link):
                      destination = f"{REMOTE}/{candidate['path']}"
                      result = subprocess.run(
                          ["rclone", "--config", str(config_path), "link", destination],
                          check=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                          text=True, timeout=45,
                      )
                      link = result.stdout.strip().splitlines()[-1] if result.stdout.strip() else ""
                  if not safe_link(link):
                      raise ValueError("Drive returned a URL that is not a supported public download link")
                  artifacts.append({**candidate, "url": link})
              artifacts.sort(key=lambda a: (a["modifiedAt"], a["name"]), reverse=True)
              now = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")
              timestamp = old.get("generatedAt") if old.get("artifacts") == artifacts else now
              output = {
                  "version": 1,
                  "source": "DeadZoneDrive",
                  "sourceFolderId": FOLDER_ID,
                  "generatedAt": timestamp or now,
                  "artifacts": artifacts,
              }
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_text(json.dumps(output, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"Drive ROM catalog ready: {len(artifacts)} releases (content changed: {old.get('artifacts') != artifacts})")
              return 0
          
          
          if __name__ == "__main__":
              if len(sys.argv) != 4:
                  print("Usage: drive_catalog.py <rclone-inventory.json> <catalog.json> <rclone.conf>", file=sys.stderr)
                  sys.exit(2)
              try:
                  sys.exit(produce(Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3])))
              except (OSError, ValueError, subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                  print(f"::error::Failed to build Drive catalog ({type(exc).__name__})", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Publish ROM catalog to the public org profile repo
        shell: bash
        working-directory: catalog-repo
        run: |
          set -Eeuo pipefail
          git add -- catalog/drive-catalog.json
          if git diff --cached --quiet; then
            echo "No ROM changes; public catalog already current"
            exit 0
          fi
          git -c user.name="MEZO" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "data(dz): sync available ROMs from DeadZoneDrive"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Updated public catalog; no credentials or ROM bytes committed"
