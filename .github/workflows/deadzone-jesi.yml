# DeadZone-Home Jesi
#
# Independent Telegram-dispatch workflow for the DeadZone-Jesi GSI
# engine (private engine repo `DeadZone-Offical/DeadZone_MysticGSI`).
# This file is invoked directly by `DeadZone-Offical/DeadZone-Bot`
# via `workflow_dispatch` whenever a user picks "Jesi". Each dispatch
# creates its own GitHub Actions run; Jesi is NOT routed through any
# generic dispatcher.
#
# Concurrency model
# ----------------
# Each `workflow_dispatch` invocation creates a fresh GitHub Actions
# run with its own runner, its own workspace, its own `toolbuild/`
# checkout, and its own log/artifact uploads. GitHub Actions is
# responsible for scheduling; 20 simultaneous Jesi dispatches become
# 20 simultaneous independent runs (subject to repo/org concurrency
# limits). The request-id-scoped key cancels a previous Jesi build for
# the SAME Telegram request, but does NOT serialize across different
# requests.

name: DeadZoneJesi

run-name: "🚀 DeadZoneJesi · ${{ inputs.request_id }} · ${{ inputs.builder_name || github.actor }}"

concurrency:
  # Per-request concurrency key: two different users can dispatch Jesi
  # at the same time and they run in parallel. The same user re-pressing
  # Build for the same request_id cancels their previous run, which is
  # the only safe semantic.
  group: deadzone-home-jesi-${{ inputs.request_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "📥 Firmware URL or local-relative path"
        required: true
        type: string
      build_name:
        description: "🏷️ Build name (becomes out/<build_name>/)"
        required: true
        type: string
      rom_type:
        description: "🧩 ROM type passed to Jesi's --type flag"
        required: false
        type: string
        default: auto
      compress:
        description: "🗜️ Also produce a .zip alongside the .img (Jesi --compress)"
        required: false
        type: boolean
        default: true
      no_debloat:
        description: "🚫 Skip the debloat patch set (Jesi --no-debloat)"
        required: false
        type: boolean
        default: false
      avb_key:
        description: "🔐 RSA private key (PEM) for AVB signing (empty = AOSP test key)"
        required: false
        type: string
        default: ''
      builder_name:
        description: "👤 Builder name"
        required: false
        type: string
      builder_id:
        description: "💬 Telegram user ID"
        required: false
        type: string
      request_id:
        description: "🆔 DeadZone controlled build request ID"
        required: true
        type: string
      callback_url:
        description: "🔗 Signed DeadZone build-event endpoint"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: "🛠️ Build GSI"
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
      DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
      DEADZONE_PROJECT: jesi
      DEADZONE_CONTROLLED_BUILD: "1"
      DEADZONE_INPUT_URL: ${{ inputs.input_url }}
      DEADZONE_BUILD_NAME: ${{ inputs.build_name }}
      DEADZONE_ROM_TYPE: ${{ inputs.rom_type }}
      DEADZONE_COMPRESS: ${{ inputs.compress }}
      DEADZONE_NO_DEBLOAT: ${{ inputs.no_debloat }}
      DEADZONE_AVB_KEY: ${{ inputs.avb_key }}
      DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
      DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
      DEADZONE_SOURCE_REPOSITORY: ${{ github.repository }}
      # Temporary: keep secondary mirrors disabled while Google Drive is
      # the only active upload destination. Flip to "1" to re-enable.
      DEADZONE_ENABLE_SECONDARY_MIRRORS: "0"

    steps:
      - name: "🧾 Validate controlled request"
        shell: python
        env:
          INPUT_URL: ${{ inputs.input_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_NAME: ${{ inputs.build_name }}
        run: |
          import os
          import re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"].strip()
          if not re.fullmatch(r"jesi_[A-Za-z0-9]{8,80}", request_id):
              raise SystemExit("Invalid DeadZone request ID")

          for name in ("INPUT_URL", "CALLBACK_URL"):
              value = os.environ[name].strip()
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(f"{name} must be a safe HTTPS URL")

          build_name = os.environ["BUILD_NAME"].strip()
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", build_name):
              raise SystemExit("BUILD_NAME must be 1-64 chars of [A-Za-z0-9._-]")

      - name: "🔐 Validate launcher credentials"
        env:
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DEADZONE_PRIVATE_READ_TOKEN:-}" ]]; then
            echo "::error::Missing required launcher secret: DEADZONE_PRIVATE_READ_TOKEN. Provision a fine-grained PAT with Contents: Read-only on the private engine repos and add it as the DEADZONE_PRIVATE_READ_TOKEN Actions secret on DeadZone-Offical/DeadZone-Home." >&2
            exit 1
          fi

      - name: "📥 Checkout Jesi launcher"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "📥 Checkout private runtime"
        uses: actions/checkout@v4
        with:
          repository: DeadZone-Offical/DeadZone-File
          ref: main
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            projects.env
            build.env
            rclone.conf
            load-build.sh
            report_build_event.py
            upload.env
            upload-mirrors.sh
            publish-website-release.py
          sparse-checkout-cone-mode: false

      - name: "⚙️ Load central runtime"
        id: runtime
        env:
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          DEADZONE_CONTROLLED_BUILD: "1"
        run: |
          set -euo pipefail
          for runtime_file in projects.env build.env rclone.conf load-build.sh report_build_event.py upload.env upload-mirrors.sh publish-website-release.py; do
            if [[ ! -s "runtime/${runtime_file}" ]]; then
              echo "::error::Central runtime file is missing or empty: ${runtime_file}"
              exit 1
            fi
          done
          chmod 700 runtime/load-build.sh runtime/upload-mirrors.sh
          python3 -m py_compile runtime/report_build_event.py runtime/publish-website-release.py
          runtime/load-build.sh jesi

      - name: "✅ Validate loaded runtime"
        env:
          ENGINE_REPOSITORY: ${{ steps.runtime.outputs.engine_repository }}
        run: |
          set -euo pipefail
          required=(
            ENGINE_REPOSITORY
            DEADZONE_ENGINE_REPOSITORY
            BUILD_PROGRESS_SECRET
            RCLONE_REMOTE_NAME
            RCLONE_UPLOAD_DIR
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Central runtime value is missing: ${variable_name}"
              exit 1
            fi
          done
          if [[ "$ENGINE_REPOSITORY" != "DeadZone-Offical/DeadZone_MysticGSI" ]]; then
            echo "::error::Unexpected Jesi engine: $ENGINE_REPOSITORY"
            exit 1
          fi
          if [[ "$ENGINE_REPOSITORY" != "$DEADZONE_ENGINE_REPOSITORY" ]]; then
            echo "::error::Runtime engine output does not match the loaded project map"
            exit 1
          fi
          printf '::add-mask::%s\n' "$BUILD_PROGRESS_SECRET"
          printf 'DEADZONE_EVENT_SECRET=%s\n' "$BUILD_PROGRESS_SECRET" >> "$GITHUB_ENV"

      - name: "💾 Maximize build space"
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          build-mount-path: ${{ github.workspace }}/toolbuild
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: "🧹 Clean unused runner packages"
        run: |
          set -euo pipefail
          docker image prune --all --force || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android || true
          sudo apt-get purge -y azure-cli "ghc*" "zulu*" "hhvm*" "llvm*" firefox "google*" "dotnet*" powershell "mysql*" "php*" || true
          sudo apt-get autoremove --purge -y || true
          sudo apt-get clean

      - name: "📦 Checkout private Jesi engine"
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.runtime.outputs.engine_repository }}
          ref: main
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          path: toolbuild
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: "🧭 Validate Jesi engine layout"
        working-directory: toolbuild
        run: |
          set -euo pipefail
          required_engine_files=(
            cli.py
            tools/notify.py
            tools/upload.py
          )
          for engine_file in "${required_engine_files[@]}"; do
            if [[ ! -s "$engine_file" ]]; then
              echo "::error::Jesi engine file is missing or empty: ${engine_file}"
              exit 1
            fi
          done
          python3 -m py_compile tools/notify.py tools/upload.py

      - name: "☁️ Install central Rclone configuration"
        working-directory: toolbuild
        run: |
          set -euo pipefail
          source_file="$GITHUB_WORKSPACE/runtime/rclone.conf"
          target_file="$PWD/rclone.conf"
          [[ -s "$source_file" ]] || {
            echo "::error::Central rclone.conf is missing or empty"
            exit 1
          }
          install -m 600 "$source_file" "$target_file"
          if ! rclone --config="$target_file" listremotes | sed 's/:$//' | grep -Fxq "$RCLONE_REMOTE_NAME"; then
            echo "::error::Central rclone.conf does not define expected remote: ${RCLONE_REMOTE_NAME}"
            exit 1
          fi
          rclone version

      - name: "📣 Start live tracking"
        working-directory: toolbuild
        run: |
          set -euo pipefail
          python3 tools/notify.py start \
            "$DEADZONE_SOURCE_REPOSITORY" \
            "$DEADZONE_INPUT_URL" \
            "$DEADZONE_REQUEST_ID" \
            --name "$DEADZONE_BUILD_NAME" \
            --builder-name "$DEADZONE_BUILDER_NAME" \
            --builder-id "$DEADZONE_BUILDER_ID" || true

      - name: "🕒 Set Cairo timezone"
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: "☕ Install OpenJDK"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "🧰 Install Jesi dependencies"
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 jq rclone python-is-python3 wget python3 python3-pip python3-venv \
            lz4 xz-utils zlib1g-dev gcc g++ libc6 libstdc++6 \
            busybox zip unzip p7zip-full zipalign zstd bc erofs-utils \
            android-sdk-libsparse-utils xmlstarlet aapt rsync openssh-client curl \
            default-jre-headless openssl brotli pcre2-utils cmake ninja-build pkg-config \
            libarchive-tools libpcre2-dev liblz4-dev libzstd-dev libbrotli-dev
          command -v apktool >/dev/null 2>&1 || {
            echo "apktool missing -- installing from upstream release"
            sudo mkdir -p /usr/local/bin /opt/apktool
            sudo curl -fsSL -o /opt/apktool/apktool.jar \
              https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar
            printf '#!/bin/sh\nexec java -jar /opt/apktool/apktool.jar "$@"\n' \
              | sudo tee /usr/local/bin/apktool >/dev/null
            sudo chmod +x /usr/local/bin/apktool
          }

      - name: "🐍 Create Python venv and install requirements"
        working-directory: toolbuild
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: "🛠️ Prepare native host tools"
        working-directory: toolbuild
        run: |
          set -euo pipefail
          .venv/bin/python tools/build_android_tools.py || true

      - name: "✅ Validate environment"
        working-directory: toolbuild
        run: |
          set -euo pipefail
          .venv/bin/python -c "import tools; tools.check_environment()"

      - name: "🚀 Build GSI"
        id: build
        working-directory: toolbuild
        env:
          DEADZONE_REQUEST_ID: ${{ env.DEADZONE_REQUEST_ID }}
        run: |
          set -Eeuo pipefail
          args=(
            "build"
            "$DEADZONE_BUILD_NAME"
            "$DEADZONE_INPUT_URL"
            "--type" "$DEADZONE_ROM_TYPE"
          )
          if [[ "$DEADZONE_COMPRESS" == "true" ]]; then
            args+=("--compress")
          fi
          if [[ "$DEADZONE_NO_DEBLOAT" == "true" ]]; then
            args+=("--no-debloat")
          fi
          if [[ -n "$DEADZONE_AVB_KEY" ]]; then
            args+=("--avb-key" "$DEADZONE_AVB_KEY")
          fi

          .venv/bin/python tools/notify.py build \
            "$DEADZONE_SOURCE_REPOSITORY" \
            "$DEADZONE_INPUT_URL" \
            "$DEADZONE_REQUEST_ID" \
            --name "$DEADZONE_BUILD_NAME" \
            --builder-name "$DEADZONE_BUILDER_NAME" \
            --builder-id "$DEADZONE_BUILDER_ID" || true

          .venv/bin/python cli.py "${args[@]}" 2>&1 | tee build-full.log

      - name: "✅ Verify build artifacts"
        if: success()
        working-directory: toolbuild
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=( out/"$DEADZONE_BUILD_NAME"/*.img )
          if (( ${#images[@]} == 0 )); then
            echo "::error::Build produced no .img under out/$DEADZONE_BUILD_NAME/"
            exit 1
          fi
          for img in "${images[@]}"; do
            [[ -s "$img" ]] || { echo "::error::Empty image: $img"; exit 1; }
          done
          printf 'DEADZONE_RESULT_NAME=%s\n' "$(basename "${images[0]}")" >> "$GITHUB_ENV"

      - name: "📦 Report pack stage"
        if: success()
        working-directory: toolbuild
        run: |
          set -euo pipefail
          .venv/bin/python tools/notify.py pack \
            "$DEADZONE_SOURCE_REPOSITORY" \
            "$DEADZONE_INPUT_URL" \
            "$DEADZONE_REQUEST_ID" \
            --name "$DEADZONE_BUILD_NAME" \
            --builder-name "$DEADZONE_BUILDER_NAME" \
            --builder-id "$DEADZONE_BUILDER_ID" || true

      - name: "🗜️ Upload to Google Drive via central infrastructure"
        if: success()
        working-directory: toolbuild
        run: |
          set -Eeuo pipefail
          .venv/bin/python tools/notify.py upload \
            "$DEADZONE_SOURCE_REPOSITORY" \
            "$DEADZONE_INPUT_URL" \
            "$DEADZONE_REQUEST_ID" \
            --name "$DEADZONE_BUILD_NAME" \
            --builder-name "$DEADZONE_BUILDER_NAME" \
            --builder-id "$DEADZONE_BUILDER_ID" || true

          set +e
          .venv/bin/python tools/upload.py \
            --remote "$RCLONE_REMOTE_NAME" \
            --upload-dir "$RCLONE_UPLOAD_DIR" \
            --name "$DEADZONE_BUILD_NAME" \
            --project "jesi" \
            --rclone-conf "$PWD/rclone.conf" \
            2>&1 | tee -a build-full.log
          google_status=${PIPESTATUS[0]}
          set -e
          printf 'DEADZONE_GOOGLE_UPLOAD_STATUS=%s\n' "$google_status" >> "$GITHUB_ENV"

          if (( google_status == 0 )); then
            drive_remote="${RCLONE_REMOTE_NAME}:${RCLONE_UPLOAD_DIR%/}/jesi/${DEADZONE_BUILD_NAME^^}"
            drive_url="$(rclone --config="$PWD/rclone.conf" link "$drive_remote/${DEADZONE_RESULT_NAME}" 2>/dev/null | tail -n1 | tr -d '\r' || true)"
            if [[ -n "$drive_url" ]]; then
              printf 'DEADZONE_GOOGLE_DRIVE_URL=%s\nDEADZONE_RESULT_URL=%s\n' \
                "$drive_url" "$drive_url" >> "$GITHUB_ENV"
            fi
          fi

      - name: "⬆️ Upload SourceForge and PixelDrain"
        if: success()
        working-directory: toolbuild
        env:
          DEADZONE_ENABLE_SECONDARY_MIRRORS: "0"
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          final_zips=( out/"$DEADZONE_BUILD_NAME"/*.zip )
          if (( ${#final_zips[@]} >= 1 )); then
            final_zip="${final_zips[0]}"
            final_name="$(basename "$final_zip")"
          else
            shopt -s nullglob
            final_imgs=( out/"$DEADZONE_BUILD_NAME"/*.img )
            final_zip="${final_imgs[0]}"
            final_name="$(basename "$final_zip")"
          fi

          if [[ ! -s "$final_zip" ]]; then
            echo "::error::No artifact found under out/$DEADZONE_BUILD_NAME/"
            exit 1
          fi

          set +e
          bash "$GITHUB_WORKSPACE/runtime/upload-mirrors.sh" \
            "Jesi" "" "" "$final_zip" "$final_name" \
            2>&1 | tee -a build-full.log
          mirror_status=${PIPESTATUS[0]}
          set -e

          google_status="${DEADZONE_GOOGLE_UPLOAD_STATUS:-1}"
          if (( google_status != 0 )); then
            echo "::error::Google Drive upload failed and no secondary mirrors are enabled"
            exit 1
          fi
          if (( mirror_status != 0 )); then
            echo "::warning::upload-mirrors.sh exited with status ${mirror_status}; continuing because Google Drive succeeded"
          fi

      - name: "✅ Send success notification"
        if: success()
        working-directory: toolbuild
        run: |
          set -euo pipefail
          .venv/bin/python tools/notify.py success \
            "$DEADZONE_SOURCE_REPOSITORY" \
            "$DEADZONE_INPUT_URL" \
            "$DEADZONE_REQUEST_ID" \
            --name "$DEADZONE_BUILD_NAME" \
            --builder-name "$DEADZONE_BUILDER_NAME" \
            --builder-id "$DEADZONE_BUILDER_ID" || true

      - name: "❌ Send failure notification"
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          [[ -n "${DEADZONE_EVENT_SECRET:-}" ]] || {
            echo '::error::Terminal Jesi event cannot be signed because the central event secret is unavailable.'
            exit 1
          }
          python3 runtime/report_build_event.py failed \
            --project jesi \
            --message "DeadZone Jesi GSI build failed."

      - name: "⛔ Send cancellation notification"
        if: cancelled()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          [[ -n "${DEADZONE_EVENT_SECRET:-}" ]] || {
            echo '::error::Terminal Jesi event cannot be signed because the central event secret is unavailable.'
            exit 1
          }
          python3 runtime/report_build_event.py cancelled \
            --project jesi \
            --message "DeadZone Jesi GSI build cancelled."

      - name: "🧽 Cleanup Jesi workspace"
        if: always()
        run: |
          set -Euo pipefail
          rm -rf toolbuild runtime
          rm -f toolbuild/rclone.conf

      - name: "📋 Upload debug logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-jesi-${{ github.run_number }}
          path: |
            toolbuild/build-full.log
          retention-days: 1
          if-no-files-found: ignore

      - name: "📣 Build summary"
        if: always()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_RESULT_NAME: ${{ env.DEADZONE_RESULT_NAME }}
          DEADZONE_GOOGLE_DRIVE_URL: ${{ env.DEADZONE_GOOGLE_DRIVE_URL }}
        run: |
          {
            echo "## 🚀 DeadZoneJesi build"
            echo
            echo "- Project: \`DeadZoneJesi\`"
            echo "- Engine repository: \`DeadZone-Offical/DeadZone_MysticGSI\`"
            echo "- Request ID: \`${DEADZONE_REQUEST_ID}\`"
            echo "- Builder: \`${DEADZONE_BUILDER_NAME:-anonymous}\`"
            [[ -n "${DEADZONE_RESULT_NAME:-}" ]] && echo "- Final artifact: \`${DEADZONE_RESULT_NAME}\`"
            [[ -n "${DEADZONE_GOOGLE_DRIVE_URL:-}" ]] && echo "- Drive URL: ${DEADZONE_GOOGLE_DRIVE_URL}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"