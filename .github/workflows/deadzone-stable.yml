# DeadZone-Home Stable
#
# Independent Telegram-dispatch workflow for the Xiaomi Stable ROM
# engine. This file is invoked directly by `DeadZone-Offical/DeadZone-Bot`
# via `workflow_dispatch` whenever a user picks "Stable". Each dispatch
# creates its own GitHub Actions run; Stable is NOT routed through any
# generic dispatcher.
#
# Engine it drives
# ----------------
# This launcher drives the engine in
# `DeadZone-Offical/DeadZone-Xiaomi-Stable@main`. As of the bootstrap
# commit, that engine ships in the pre-refactor Lite-style layout:
#   * `build.sh`, `packROM.sh`, `uploadROM.sh` at the repo root
#   * the vendor toolchain at `bin/Linux/x86_64/`
#   * `bin/fix_selinux.py` and `bin/getSuperSize.sh` (no Lite
#     sparse-checkout needed — the engine already vendors them)
#   * `bin/ddevice/*.txt` as the per-build state directory; the
#     final ZIP name is recorded in `bin/ddevice/output_zip.txt`
#     before uploadROM.sh cleans `out/` and `build/`
#   * `notify.py` for the full Telegram lifecycle (start, download,
#     unpack, build, pack, upload, success, fail)
# The pipeline is the Lite sequence: `build.sh` -> `packROM.sh` ->
# `uploadROM.sh`. There is no `--with-upload` flag on the Stable
# engine, and the refactored engine layout (a single `build.sh`
# with internal Stage 1..Stage 11, `bin/upload/run_upload.sh`,
# `bin/tools/linux_x86_64/`, `bin/DeviceConfig/`) is not yet
# present in `DeadZone-Xiaomi-Stable`. When that refactor lands,
# this workflow will need to be re-adapted to the new engine
# contract; the Lite-style flow here is the only one that runs
# against the engine as it actually exists today.
#
# Architecture / ownership boundary
# ---------------------------------
# Device configuration is owned by DeadZone-SuperInspector, NOT by
# this workflow. The Stable build engine reads per-codename
# configurations from ``DeadZone-Xiaomi-Stable/bin/DeviceConfig/<codename>/<codename>.json``
# at Stage 9 (flash) and Stage 10 (release). SuperInspector generates
# and publishes that file via its own writer; this workflow MUST NOT
# publish, regenerate, or backfill device configurations. A missing
# DeviceConfig is the operator's signal to run SuperInspector first —
# the workflow fails fast with a clear, actionable error rather than
# inventing flash destinations or duplicating SuperInspector's work.
# The current pre-refactor engine does NOT yet consume
# `bin/DeviceConfig/`, so the verifier tolerates a missing
# `bin/DeviceConfig/` directory (logs a warning) and only fails
# the build when the directory exists but is empty.
#
# Post-prompt-removal contract
# ---------------------------
# The Stable flow matches Lite / Fastboot / Ninja: a valid ROM URL
# is enough to dispatch the build. The workflow does NOT declare
# any device-profile dispatch input, and there is no post-success
# device-profile publication step. The bot does NOT collect any
# pre-build publication confirmation — that decision is owned by
# SuperInspector, not by the launcher or the bot.
#
# Concurrency model
# -----------------
# Each `workflow_dispatch` invocation creates a fresh GitHub Actions
# run with its own runner, its own workspace, its own `toolbuild/`
# checkout, and its own log/artifact uploads. GitHub Actions is
# responsible for scheduling; multiple simultaneous Stable dispatches
# become parallel independent runs (subject to repo/org concurrency
# limits). The request-id-scoped key cancels a previous Stable build
# for the SAME Telegram request, but does NOT serialize across
# different requests.
#
# Why a separate workflow (not a shared dispatcher)?
# --------------------------------------------------
# The Stable engine's pipeline is split across three top-level
# scripts (`build.sh`, `packROM.sh`, `uploadROM.sh`), the same
# way the Lite engine is. Unlike Lite, the Stable engine's
# `uploadROM.sh` cleans `out/` and `build/` after a successful
# upload, so the launcher has to copy the final ZIP out of the
# engine's working directory into a stable artifact location
# BEFORE invoking `uploadROM.sh`. The Lite-style split is
# preserved here rather than collapsing the three scripts into
# one wrapper, because the engine is the source of truth for
# the pipeline contract and changing the launcher to invoke a
# different script would diverge from what the engine ships.
#
# Stage integration
# ----------------
# The Stable engine's `uploadROM.sh` uses the same rclone
# semantics as DeadZone-xiaomi_Lite's uploadROM.sh, with a
# hard-coded OneDrive remote `starxONEDRIVE:NTBuild/<os>/<poly>/<device>/`:
#   * rclone copy (one-shot, no checksum)
#   * hard-coded remote / path layout
#   * cleans `out/` and `build/` on success
# The Drive path is `starxONEDRIVE:NTBuild/${OS}/${polyxver}/${device_code}/<zip>`.
# The launcher also seeds the engine with a centralized
# `rclone.conf` from `DeadZone-File` so the engine's rclone call
# has a valid OAuth token; the seed is installed BEFORE
# `uploadROM.sh setup` would run so the actual `uploadROM.sh`
# upload uses the same token.
#
# Why we copy the final ZIP to a stable artifact location
# -------------------------------------------------------
# `uploadROM.sh` deletes `$work_dir/out` after a successful
# upload (so the engine's repo stays small between dispatches).
# That means by the time the workflow's "collect artifact
# metadata" step runs, the ZIP is gone from `out/`. We
# therefore copy `out/<final>.zip` to `$GITHUB_WORKSPACE/out/`
# immediately after `packROM.sh` and before `uploadROM.sh`. The
# launcher's actions/upload-artifact step can then upload from
# the stable path regardless of whether the upload step
# succeeded, failed, or skipped cleanup.

name: Deadzone-Stable

run-name: "🚀 Deadzone-Stable · ${{ inputs.request_id }} · ${{ inputs.builder_name || github.actor }}"

concurrency:
  # Per-request concurrency key: two different users can dispatch
  # Stable at the same time and they run in parallel. The same user
  # re-pressing Build for the same request_id cancels their previous
  # run, which is the only safe semantic.
  group: deadzone-home-stable-${{ inputs.request_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "📥 ROM download URL"
        required: true
        type: string
      builder_name:
        description: "👤 Builder name"
        required: false
        type: string
      builder_id:
        description: "💬 Telegram user ID"
        required: false
        type: string
      builder_username:
        description: "🔗 Telegram username (without leading @)"
        required: false
        type: string
      request_id:
        description: "🆔 DeadZone controlled build request ID"
        required: true
        type: string
      callback_url:
        description: "🔗 Signed DeadZone build-event endpoint"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: "🛠️ Build ROM"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
      DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
      DEADZONE_PROJECT: stable
      DEADZONE_PROJECT_DRIVE_FOLDER: Stable
      DEADZONE_CONTROLLED_BUILD: "1"
      DEADZONE_INPUT_URL: ${{ inputs.input_url }}
      DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
      DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
      DEADZONE_BUILDER_USERNAME: ${{ inputs.builder_username }}
      DEADZONE_SOURCE_REPOSITORY: ${{ github.repository }}
      DEADZONE_ENGINE_REPOSITORY: DeadZone-Offical/DeadZone-Xiaomi-Stable
      # Temporary: keep secondary mirrors disabled while Google Drive is
      # the only active upload destination. Flip to "1" to re-enable.
      DEADZONE_ENABLE_SECONDARY_MIRRORS: "0"

    steps:
      - name: "🧾 Validate controlled request"
        shell: python
        env:
          INPUT_URL: ${{ inputs.input_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          import os
          import re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"].strip()
          if not re.fullmatch(r"stable_[A-Za-z0-9]{8,80}", request_id):
              raise SystemExit("Invalid DeadZone request ID")

          for name in ("INPUT_URL", "CALLBACK_URL"):
              value = os.environ[name].strip()
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(f"{name} must be a safe HTTPS URL")

      - name: "🔐 Validate launcher credentials"
        env:
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          # Required: a dedicated fine-grained GitHub PAT with
          # Contents: Read-only on every private engine repository
          # listed in `projects.env` plus `DeadZone-Offical/DeadZone-File`.
          # It MUST NOT be the bot dispatch token (`GITHUB_BUILD_TOKEN`)
          # or any other write-capable credential. The workflow fails
          # fast if the secret is missing so a misconfigured secret
          # surfaces immediately instead of producing a 403 later.
          if [[ -z "${DEADZONE_PRIVATE_READ_TOKEN:-}" ]]; then
            echo "::error::Missing required launcher secret: DEADZONE_PRIVATE_READ_TOKEN. Provision a fine-grained PAT with Contents: Read-only on the private engine repos and add it as the DEADZONE_PRIVATE_READ_TOKEN Actions secret on DeadZone-Offical/DeadZone-Home." >&2
            exit 1
          fi

      - name: "📥 Checkout DeadZone launcher"
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "📥 Checkout private runtime"
        uses: actions/checkout@v5
        with:
          repository: DeadZone-Offical/DeadZone-File
          ref: main
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            projects.env
            build.env
            rclone.conf
            load-build.sh
            build_stage.py
            report_build_event.py
            upload.env
            upload-mirrors.sh
            publish-website-release.py

      - name: "⚙️ Load central runtime"
        id: runtime
        env:
          # The fine-grained PAT is the single source-of-truth credential
          # for private source checkouts. load-build.sh reads the engine
          # bootstrap token from DEADZONE_PRIVATE_TOKEN first, then
          # PRIVATE_REPO_TOKEN, then GH_TOKEN. Expose the PAT under all
          # three names so the central runtime can open the private
          # registry and engine repos without a write-capable fallback.
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          DEADZONE_CONTROLLED_BUILD: "1"
        run: |
          set -euo pipefail
          for runtime_file in projects.env build.env rclone.conf load-build.sh build_stage.py report_build_event.py upload.env upload-mirrors.sh publish-website-release.py; do
            if [[ ! -s "runtime/${runtime_file}" ]]; then
              echo "::error::Central runtime file is missing or empty: ${runtime_file}"
              exit 1
            fi
          done
          chmod 700 runtime/load-build.sh runtime/upload-mirrors.sh
          python3 -m py_compile runtime/build_stage.py runtime/report_build_event.py runtime/publish-website-release.py
          runtime/load-build.sh stable

      - name: "✅ Validate loaded runtime"
        env:
          ENGINE_REPOSITORY: ${{ steps.runtime.outputs.engine_repository }}
        run: |
          set -euo pipefail
          required=(
            ENGINE_REPOSITORY
            DEADZONE_ENGINE_REPOSITORY
            BUILD_PROGRESS_SECRET
            RCLONE_REMOTE_NAME
            RCLONE_UPLOAD_DIR
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Central runtime value is missing: ${variable_name}"
              exit 1
            fi
          done
          if [[ "$ENGINE_REPOSITORY" != "DeadZone-Offical/DeadZone-Xiaomi-Stable" ]]; then
            echo "::error::Unexpected Stable engine: $ENGINE_REPOSITORY"
            exit 1
          fi
          if [[ "$ENGINE_REPOSITORY" != "$DEADZONE_ENGINE_REPOSITORY" ]]; then
            echo "::error::Runtime engine output does not match the loaded project map"
            exit 1
          fi
          printf '::add-mask::%s\n' "$BUILD_PROGRESS_SECRET"
          printf 'DEADZONE_EVENT_SECRET=%s\n' "$BUILD_PROGRESS_SECRET" >> "$GITHUB_ENV"

      - name: "💾 Maximize build space"
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          build-mount-path: ${{ github.workspace }}/toolbuild
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: "🧹 Clean unused runner packages"
        run: |
          set -euo pipefail
          docker image prune --all --force || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android || true
          sudo apt-get purge -y azure-cli "ghc*" "zulu*" "hhvm*" "llvm*" firefox "google*" "dotnet*" powershell "mysql*" "php*" || true
          sudo apt-get autoremove --purge -y || true
          sudo apt-get clean

      - name: "📦 Checkout private Stable engine"
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.runtime.outputs.engine_repository }}
          ref: main
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          path: toolbuild
          lfs: false
          fetch-depth: 1
          persist-credentials: false

      - name: "🧭 Detect Stable engine layout"
        working-directory: toolbuild
        shell: bash
        run: |
          set -euo pipefail
          # Decide which engine layout the launcher should drive.
          # The Stable engine ships in one of two layouts:
          #   * refactored: thin shell pipeline under `bin/`
          #     with `bin/upload/run_upload.sh`,
          #     `bin/release/run_release.sh`, `bin/flash/`,
          #     `bin/DeviceConfig/`, `bin/tools/linux_x86_64/`,
          #     and `bin/release/naming.py`. The launcher
          #     invokes `build.sh --with-upload` and the engine
          #     handles pack/release/upload internally.
          #   * pre-refactor: Lite-style split where the pipeline
          #     is three top-level scripts (`build.sh`,
          #     `packROM.sh`, `uploadROM.sh`), the toolchain is
          #     at `bin/Linux/x86_64/`, and the launcher runs
          #     the three scripts as separate steps.
          # This detection has to run BEFORE the Lite
          # sparse-checkout and the toolchain chmod so the
          # downstream steps can branch on the layout.
          if [[ -f bin/upload/run_upload.sh && -f bin/release/run_release.sh && -f bin/flash/run_flash.sh && -f bin/release/naming.py ]]; then
            layout="refactored"
          elif [[ -f build.sh && -f packROM.sh && -f uploadROM.sh && -f notify.py ]]; then
            layout="pre_refactor"
          else
            echo "::error::Could not determine the Stable engine layout. Neither the refactored files (bin/upload/run_upload.sh, bin/release/run_release.sh, bin/flash/run_flash.sh, bin/release/naming.py) nor the pre-refactor files (build.sh, packROM.sh, uploadROM.sh, notify.py) are all present." >&2
            echo "::error::Inspect the DeadZone-Xiaomi-Stable checkout and either complete one of the two layouts or update this launcher to match." >&2
            exit 1
          fi
          echo "Stable engine layout: ${layout}"
          printf 'DEADZONE_ENGINE_LAYOUT=%s\n' "$layout" >> "$GITHUB_ENV"

      - name: "📦 Checkout Lite engine (fix_selinux.py source, refactored only)"
        if: env.DEADZONE_ENGINE_LAYOUT == 'refactored'
        uses: actions/checkout@v5
        with:
          repository: DeadZone-Offical/DeadZone-xiaomi_Lite
          ref: main
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          path: liteengine
          sparse-checkout: |
            bin/imaging/fix_selinux.py
          lfs: false
          fetch-depth: 1
          persist-credentials: false

      - name: "🛡️ Verify Lite fix_selinux.py is present (refactored only)"
        if: env.DEADZONE_ENGINE_LAYOUT == 'refactored'
        working-directory: toolbuild
        shell: bash
        run: |
          set -euo pipefail
          # The refactored Stable engine's bin/repack/selinux.sh
          # resolves fix_selinux.py from $LITE_ENGINE_ROOT/bin/imaging/.
          # We fail fast here (BEFORE the build starts) so a
          # missing Lite script is reported as a launch-time
          # diagnostic, not as a confusing repack-stage
          # "fix_selinux.py not found" error 30 minutes later.
          if [[ ! -s "$GITHUB_WORKSPACE/liteengine/bin/imaging/fix_selinux.py" ]]; then
            echo "::error::Lite engine checkout is missing bin/imaging/fix_selinux.py."
            echo "::error::The refactored Stable engine's repack stage consumes the canonical Lite fix_selinux.py verbatim. The LITE_ENGINE_ROOT variable points at $GITHUB_WORKSPACE/liteengine; verify the Lite checkout above." >&2
            exit 1
          fi

      - name: "🛡️ Verify pre-refactor engine fix_selinux.py is present (pre-refactor only)"
        if: env.DEADZONE_ENGINE_LAYOUT == 'pre_refactor'
        working-directory: toolbuild
        shell: bash
        run: |
          set -euo pipefail
          # The pre-refactor engine's `packROM.sh` calls
          # `python3 $work_dir/bin/fix_selinux.py` directly. The
          # bootstrap commit already vendors that file in the
          # engine's `bin/` directory, so we just need to assert
          # it is present and py_compile-clean. If it ever goes
          # missing (a future refactor that moves the script to
          # `bin/imaging/`), this step fails fast with a
          # launch-time diagnostic instead of letting packROM.sh
          # blow up with a confusing `No such file or directory`
          # 30 minutes into the build.
          if [[ ! -s bin/fix_selinux.py ]]; then
            echo "::error::Pre-refactor Stable engine is missing bin/fix_selinux.py." >&2
            echo "::error::packROM.sh invokes 'python3 \$work_dir/bin/fix_selinux.py' to apply selinux labels during partition repack. Re-push the engine with the script restored under bin/fix_selinux.py, or update the engine to source it from a different location." >&2
            exit 1
          fi
          python3 -m py_compile bin/fix_selinux.py

      - name: "🛡️ Verify private Stable engine checkout"
        if: always() && failure()
        shell: bash
        run: |
          set -uo pipefail
          # When the engine checkout above failed (the canonical
          # symptom of run 37811685473 was a 403 from the private
          # engine repository), GitHub surfaces a single opaque
          # "unable to access …" line per retry and the rest of the
          # job drifts. We turn the silent 403 into an actionable
          # diagnostic: a token whose fine-grained PAT does NOT
          # grant Contents: Read-only on the Stable engine
          # repository is the most likely cause, and the next step
          # would only fail the same way.
          echo "::error::Private Stable engine checkout failed."
          echo "::error::engine_repository=${{ steps.runtime.outputs.engine_repository }}"
          echo "::error::The DEADZONE_PRIVATE_READ_TOKEN secret on DeadZone-Offical/DeadZone-Home must be a fine-grained PAT with Contents: Read-only on DeadZone-Offical/DeadZone-Xiaomi-Stable (in addition to DeadZone-Offical/DeadZone-File). The run continues so the workspace is cleaned up; the next build will fail the same way until the secret is fixed."

      - name: "🛡️ Verify Stable engine LFS objects"
        working-directory: toolbuild
        shell: bash
        run: |
          set -uo pipefail
          # `actions/checkout@v5` with `lfs: true` retries the LFS
          # fetch three times (~35s) before failing with a stack of
          # identical 404 lines. With `lfs: false` the checkout above
          # leaves the LFS pointer files in place and we perform a
          # single explicit fetch here so any missing objects surface
          # as an actionable diagnostic in one attempt. Mirrors the
          # verified Lite / Ninja LFS verification step.
          if ! command -v git-lfs >/dev/null 2>&1 && ! git lfs version >/dev/null 2>&1; then
            echo "Installing git-lfs..."
            curl -fsSL https://github.com/git-lfs/git-lfs/releases/download/v3.5.1/git-lfs-linux-amd64-v3.5.1.tar.gz \
              | tar -xz -C /tmp git-lfs \
              && sudo install -m 0755 /tmp/git-lfs /usr/local/bin/git-lfs
            git lfs install --local
          fi
          expected="$(git lfs ls-files 2>/dev/null | awk '{print $3}' || true)"
          if [[ -z "$expected" ]]; then
            echo "No LFS-tracked files in this checkout."
            exit 0
          fi
          echo "LFS objects expected: $(echo "$expected" | wc -l)"
          git lfs fetch origin main 2>&1 | tee /tmp/lfs-fetch.log || true
          not_found="$(grep -oE '\[sha256:[0-9a-f]+\] Object does not exist on the server' /tmp/lfs-fetch.log | sort -u || true)"
          if [[ -n "$not_found" ]]; then
            echo
            echo "::error::DeadZone Stable engine is missing the following Git LFS objects on the server:"
            echo "$not_found" | sed 's/^/  - /'
            echo
            echo "Push the corresponding binaries to DeadZone-Offical/DeadZone-Xiaomi-Stable and re-run."
            exit 1
          fi
          echo "All LFS objects fetched successfully."

      - name: "🛡️ Mark Stable toolchain binaries executable"
        working-directory: toolbuild
        shell: bash
        run: |
          set -euo pipefail
          # The Stable engine vendors its ELF helpers under one of
          # two possible toolchain directories, depending on the
          # engine's layout:
          #   * pre-refactor engine (the engine as it ships in
          #     the bootstrap commit): `bin/Linux/x86_64/`
          #   * refactored engine: `bin/tools/linux_x86_64/`
          # We accept either path and require at least one to be
          # present, so the launcher works against both layouts.
          # `actions/checkout@v5` materialises these blobs with
          # mode 0644 because git LFS does not preserve the
          # executable bit, so the very first EROFS partition the
          # extract stage tries to unpack would die with
          #   `<toolchain>/extract.erofs: Permission denied`
          # (the exact symptom of run 38060885738). `chmod -R u+rwX`
          # in the next step only adds +x to directories and to
          # files that ALREADY have it for some user, so it cannot
          # repair 0644 toolchain blobs on its own. We therefore
          # force +x on the detected toolchain directory here,
          # BEFORE the engine layout validator runs, and assert
          # the canonical EROFS binary is now executable so a
          # missing or renamed toolchain surfaces immediately
          # instead of as a confusing mid-extract EROFS failure
          # ten minutes into the build.
          toolchain_dir=""
          if [[ -d bin/tools/linux_x86_64 ]]; then
            toolchain_dir="bin/tools/linux_x86_64"
          elif [[ -d bin/Linux/x86_64 ]]; then
            toolchain_dir="bin/Linux/x86_64"
          fi
          if [[ -z "$toolchain_dir" ]]; then
            echo "::error::Stable engine toolchain directory is missing: tried bin/tools/linux_x86_64/ and bin/Linux/x86_64/" >&2
            echo "::error::The DeadZone-Xiaomi-Stable engine is expected to vendor its ELF helpers (extract.erofs, lpunpack, lpmake, mkfs.erofs, ...) under one of these toolchain directories. Re-push the engine with the bundled toolchain or update the engine source." >&2
            exit 1
          fi
          # Mark every file in the toolchain executable. The vendor
          # layout is intentionally a flat directory of ELF binaries
          # plus a couple of sdat2img shims, so a blanket `chmod +x`
          # is the correct contract.
          find "$toolchain_dir" -maxdepth 1 -type f -exec chmod +x {} +
          # Mark every shell entrypoint under bin/ executable so
          # future regressions in any other vendor helper (e.g. a
          # newly added `bin/foo/run_foo.sh`) do not reintroduce
          # the same "Permission denied" class of failure.
          find bin -maxdepth 4 -type f -name '*.sh' -exec chmod +x {} +
          # Top-level engine entrypoint and notify shim are .sh / .py
          # files that the build invokes directly. The python
          # shebang does not require +x, but build.sh does.
          [[ -f build.sh ]] && chmod +x build.sh || true
          # Canonical binary assertion: the exact binary that
          # triggered run 38060885738. If the toolchain is somehow
          # not present, fail fast with a precise diagnostic
          # instead of letting the failure surface ten minutes
          # into the build.
          canonical_bin="$toolchain_dir/extract.erofs"
          if [[ ! -f "$canonical_bin" ]]; then
            echo "::error::Canonical Stable toolchain binary is missing: ${canonical_bin}"
            exit 1
          fi
          if [[ ! -x "$canonical_bin" ]]; then
            echo "::error::Canonical Stable toolchain binary is not executable after chmod: ${canonical_bin}"
            stat -c 'mode=%a owner=%U:%G' "$canonical_bin" || true
            exit 1
          fi
          printf '::group::Stable toolchain permissions\n'
          ls -l "$canonical_bin" "$toolchain_dir/lpunpack" 2>/dev/null || true
          printf '::endgroup::\n'

      - name: "🧭 Validate Stable engine layout"
        working-directory: toolbuild
        shell: bash
        run: |
          set -euo pipefail
          # The engine layout was detected in the earlier
          # "🧭 Detect Stable engine layout" step. Here we
          # verify that the detected layout's required files
          # are actually present, executable, and shell-valid.
          # Each missing file is a clear diagnostic with a
          # path the operator can act on.
          layout="${DEADZONE_ENGINE_LAYOUT:-}"
          if [[ -z "$layout" ]]; then
            echo "::error::DEADZONE_ENGINE_LAYOUT is not set; the engine layout detection step did not run or failed silently." >&2
            exit 1
          fi
          if [[ "$layout" == "refactored" ]]; then
            required_engine_files=(
              build.sh
              Version
              bin/upload/run_upload.sh
              bin/release/run_release.sh
              bin/flash/run_flash.sh
              bin/release/naming.py
            )
            for engine_file in "${required_engine_files[@]}"; do
              if [[ ! -s "$engine_file" ]]; then
                echo "::error::Stable engine file is missing or empty: ${engine_file}"
                exit 1
              fi
            done
            bash -n build.sh
            bash -n bin/upload/run_upload.sh
            bash -n bin/release/run_release.sh
            python3 -m py_compile bin/release/naming.py
          else
            # pre_refactor — the Lite-style split. The launcher
            # runs `build.sh`, then `packROM.sh`, then
            # `uploadROM.sh` as three separate steps, so each
            # of those scripts must be present, executable, and
            # shell-valid. `notify.py` is invoked by the engine
            # itself (inside `build.sh`) so it must also be
            # present and py_compile-clean.
            required_engine_files=(
              build.sh
              Version
              packROM.sh
              uploadROM.sh
              notify.py
            )
            for engine_file in "${required_engine_files[@]}"; do
              if [[ ! -s "$engine_file" ]]; then
                echo "::error::Stable engine file is missing or empty: ${engine_file}"
                exit 1
              fi
            done
            bash -n build.sh
            bash -n packROM.sh
            bash -n uploadROM.sh
            python3 -m py_compile notify.py
          fi

      - name: "🛡️ Verify SuperInspector device config presence"
        working-directory: toolbuild
        shell: bash
        run: |
          set -euo pipefail
          # Device configuration is owned by DeadZone-SuperInspector.
          # The refactored Stable build engine reads per-codename
          # profiles from
          # ``bin/DeviceConfig/<codename>/<codename>.json`` at
          # Stage 9 (flash) and Stage 10 (release). SuperInspector
          # generates and publishes that file via its own writer.
          # This workflow MUST NOT regenerate, backfill, or
          # duplicate that work.
          #
          # The codename is unknown until Stage 4 (metadata) of
          # build.sh runs, so we cannot pre-validate a specific
          # codename here. We instead check the upstream
          # precondition: at least one DeviceConfig directory must
          # exist, otherwise SuperInspector has never published any
          # profiles to the Stable engine and the build would fail
          # inside Stage 9 with the engine's own
          # ``dz_flash_load_config`` error.
          #
          # The pre-refactor engine (the layout the engine ships
          # in at the bootstrap commit) does NOT yet consume
          # ``bin/DeviceConfig/``; it derives its per-build
          # configuration from `bin/ddevice/*.txt` written by
          # `build.sh` itself. We therefore tolerate a missing
          # ``bin/DeviceConfig/`` directory under the pre-refactor
          # layout (a soft warning) and only fail the build when
          # the directory exists but is empty (a true
          # configuration regression that would break Stage 9
          # under the refactored engine).
          if [[ ! -d bin/DeviceConfig ]]; then
            if [[ "${DEADZONE_ENGINE_LAYOUT:-}" == "refactored" ]]; then
              echo "::error::bin/DeviceConfig/ is missing from the Stable engine checkout." >&2
              echo "::error::DeadZone-SuperInspector is the owner of bin/DeviceConfig/<codename>/<codename>.json. Run SuperInspector against the device's stock ROM first so it can publish the per-codename device configuration into DeadZone-Offical/DeadZone-Xiaomi-Stable, then re-dispatch this Stable build." >&2
              exit 1
            fi
            echo "::notice::bin/DeviceConfig/ is not present in the pre-refactor engine checkout; the pre-refactor engine derives its configuration from bin/ddevice/*.txt and does not consume SuperInspector's per-codename profiles. This step is informational and will start failing once the engine lands its refactored layout."
            exit 0
          fi
          shopt -s nullglob
          device_config_files=(bin/DeviceConfig/*/*.json)
          shopt -u nullglob
          if (( ${#device_config_files[@]} == 0 )); then
            echo "::error::bin/DeviceConfig/ is empty: no per-codename device configuration has been published to the Stable engine." >&2
            echo "::error::DeadZone-SuperInspector is the owner of bin/DeviceConfig/<codename>/<codename>.json. Run SuperInspector against the device's stock ROM first so it can publish the per-codename device configuration into DeadZone-Offical/DeadZone-Xiaomi-Stable, then re-dispatch this Stable build." >&2
            exit 1
          fi
          printf '::group::SuperInspector DeviceConfig presence\n'
          printf '  - %s\n' "${device_config_files[@]}"
          printf '::endgroup::\n'

      - name: "📣 Start live tracking"
        working-directory: toolbuild
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -euo pipefail
          # The central runtime is checked out at the workspace
          # root, so look for build_stage.py under
          # $GITHUB_WORKSPACE/runtime rather than a relative
          # `runtime/build_stage.py` (which would resolve to
          # `toolbuild/runtime/build_stage.py` under
          # `working-directory: toolbuild` and silently miss).
          runtime_dir="$GITHUB_WORKSPACE/runtime"
          if [[ -s "$runtime_dir/build_stage.py" ]]; then
            python3 "$runtime_dir/build_stage.py" start \
              --project stable \
              --request-id "$DEADZONE_REQUEST_ID" \
              --message "Stable build started" || true
          fi

      - name: "📡 Report starting stage to bot"
        if: success()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -euo pipefail
          # Mirrors the Lite / Ninja "starting" stage: the workflow
          # fires the event the moment the engine is on disk and
          # validated, before any heavy work. The live panel renders
          # the "Runner allocated, fetching engine sources" line so
          # the user sees the build start cleanly.
          python3 runtime/build_stage.py starting \
            --project stable \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Runner allocated, fetching engine sources" || true

      - name: "🕒 Set Cairo timezone"
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: "☕ Install OpenJDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: "🧰 Install Stable dependencies"
        working-directory: toolbuild
        run: |
          set -Eeuo pipefail
          # Mirrors the verified Lite / Ninja apt step exactly.
          # Stable's bin/upload/run_upload.sh, bin/flash/render_fastboot.py,
          # and bin/repack/super_image.sh all assume rclone, lz4, zstd,
          # erofs-utils, aapt, sparse-utils, and the python3 ecosystem
          # are present on PATH. apt source cleanup matches Lite so we
          # do not pull the unrelated Google Chrome repo.
          chrome_source_pattern='dl.google.com/linux/chrome-stable/deb'
          while IFS= read -r source_file; do
            echo "::notice::Disabling unused Chrome APT source: $source_file"
            sudo mv -- "$source_file" "${source_file}.disabled"
          done < <(
            grep -Rls --include='*.list' --include='*.sources' \
              "$chrome_source_pattern" /etc/apt/sources.list.d 2>/dev/null || true
          )

          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get purge -y device-tree-compiler || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 jq rclone python-is-python3 wget python3 python3-pip \
            lz4 xz-utils zlib1g-dev gcc g++ libc6 libstdc++6 \
            busybox zip unzip p7zip-full zipalign zstd bc erofs-utils erofsfuse \
            android-sdk-libsparse-utils xmlstarlet aapt rsync openssh-client curl
          sudo pip3 install --break-system-packages --no-cache-dir ConfigObj lz4 zstandard setuptools || \
            sudo pip3 install --no-cache-dir ConfigObj lz4 zstandard setuptools

      - name: "🔓 Grant builder permissions"
        working-directory: toolbuild
        run: |
          set -euo pipefail
          # Stable's vendor toolchain under bin/tools/linux_x86_64/
          # is committed with mode 100644 (git LFS does not preserve
          # the executable bit). The pre-build step above forces
          # +x on that specific directory; this step is the broader
          # "make every file the engine writes readable + executable
          # for the runner" sweep. We deliberately use `u+rwx,go+rx`
          # instead of `u+rwX,go+rX` so any other helper the engine
          # vendors later (and any direct invocation from build.sh)
          # is also executable by the runner, not just files that
          # already had +x for some user.
          chmod -R u+rwx,go+rx .
          # rclone.conf is the one exception: it MUST stay at mode
          # 0600 because it carries the Google Drive OAuth token.
          # The "Install central Rclone configuration" step
          # re-installs it at mode 600 below, but it is also
          # defensive to enforce that here in case the engine
          # copied its own rclone.conf into the workspace earlier.
          if [[ -f rclone.conf ]]; then
            chmod 600 rclone.conf
          fi

      - name: "☁️ Install central Rclone configuration"
        working-directory: toolbuild
        run: |
          set -euo pipefail
          # Mirrors the verified Lite / Ninja rclone install step.
          # Stable's bin/upload/run_upload.sh reads RCLONE_CONFIG
          # (defaulting to $WORK_DIR/rclone.conf), so the file MUST
          # land at $WORK_DIR/rclone.conf (= toolbuild/rclone.conf)
          # with mode 600. The engine's own fetch_rclone_config
          # helper is the fallback when the file is absent, but the
          # pre-seeded path avoids a network round-trip and a token
          # burn for the in-engine GitHub Contents API call.
          source_file="$GITHUB_WORKSPACE/runtime/rclone.conf"
          target_file="$PWD/rclone.conf"
          [[ -s "$source_file" ]] || {
            echo "::error::Central rclone.conf is missing or empty"
            exit 1
          }
          install -m 600 "$source_file" "$target_file"
          if ! rclone --config="$target_file" listremotes | sed 's/:$//' | grep -Fxq "$RCLONE_REMOTE_NAME"; then
            echo "::error::Central rclone.conf does not define expected remote: ${RCLONE_REMOTE_NAME}"
            exit 1
          fi
          rclone version

      - name: "🚀 Build, release, and upload Stable ROM (refactored layout)"
        if: env.DEADZONE_ENGINE_LAYOUT == 'refactored'
        working-directory: toolbuild
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_INPUT_URL: ${{ inputs.input_url }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
          DEADZONE_GITHUB_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          DEADZONE_RCLONE_CONFIG_REPO: DeadZone-Offical/DeadZone-File
          DEADZONE_RCLONE_CONFIG_PATH: rclone.conf
          # The refactored Stable engine consumes the canonical Lite
          # bin/imaging/fix_selinux.py at repack time. The launcher
          # checked out the Lite engine sparsely to $GITHUB_WORKSPACE/liteengine
          # above; expose its path so the engine's selinux.sh can
          # resolve the tool without vendoring a duplicate copy.
          LITE_ENGINE_ROOT: ${{ github.workspace }}/liteengine
          # The bot reporter is invoked from inside the engine's
          # background heartbeat (bin/logging/log.sh). When
          # DEADZONE_CALLBACK_URL + DEADZONE_EVENT_SECRET are set
          # (which they are, by the launcher), the heartbeat fires
          # one non-terminal `reading_rom` event every
          # DZ_HEARTBEAT_INTERVAL seconds while a long stage runs.
          # That is what makes the live panel refresh instead of
          # sitting on the last checkpoint the workflow fired before
          # `bash build.sh` started. The helper is the canonical
          # signed-event reporter the launcher already imports; we
          # only point DZ_BOT_REPORTER at it so the engine does not
          # have to know its absolute path under $GITHUB_WORKSPACE.
          DZ_BOT_REPORTER: ${{ github.workspace }}/runtime/build_stage.py
          DZ_HEARTBEAT_INTERVAL: "30"
        run: |
          set -Eeuo pipefail
          # The refactored Stable engine's pipeline is one script
          # (build.sh) with 11 stages. `--with-upload` enables
          # Stage 11 (Google Drive upload) so build.sh invokes
          # bin/upload/run_upload.sh after the release stage has
          # produced the final ZIP. We do NOT split the pipeline
          # into separate pack / upload scripts the way Lite does
          # — the refactored Stable engine's bin/ layout is
          # canonical and replacing it with Lite's packROM.sh /
          # uploadROM.sh would change build behavior. The upload
          # stage uses the pre-seeded $WORK_DIR/rclone.conf
          # (mode 600) and reuses the same RCLONE_REMOTE_NAME /
          # RCLONE_UPLOAD_DIR runtime values.
          #
          # `stdbuf -oL -eL` forces line-buffered stdout + stderr
          # for build.sh, bin/*, and the brand `dz_stage_*` heartbeat
          # emitter. Without it, the engine's per-partition progress
          # lines (one every few seconds) are block-buffered (4 KiB)
          # and a stage that emits one line every few minutes will
          # not appear in the Actions log for that whole window.
          # This is the canonical fix for the 22-minute silent run
          # (37868385704) where the user saw no progress between
          # `[DeadZone] Preparing partitions — In progress` and the
          # next stage transition. `unbuffer` would work too but is
          # not in the apt cache; `stdbuf` ships with coreutils
          # which is already on the runner image.
          #
          # We route the engine's full output to `build_action.log`
          # first (so the file is durable and SIGPIPE-safe — a `>`
          # redirect is owned by the shell and not killed when its
          # parent exits), and then mirror that file to stdout so
          # the Actions live log still streams line-by-line. The
          # exit status of the engine is captured from the
          # backgrounded subshell and re-raised so the step still
          # fails the workflow when `build.sh` fails.
          log_path="$PWD/build_action.log"
          : > "$log_path"
          sudo -E stdbuf -oL -eL bash build.sh "$DEADZONE_INPUT_URL" "$DEADZONE_SOURCE_REPOSITORY" "stable" \
            "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID" \
            --with-upload > "$log_path" 2>&1 &
          build_pid=$!
          # Tail the log file to stdout so the Actions live log
          # keeps showing progress. `tail -F --pid=$build_pid`
          # exits as soon as the build process (or its sudo
          # wrapper) disappears, which prevents a zombie `tail`
          # from blocking the step on the SIGPIPE of the old
          # `tee`-based pipeline.
          tail -n +1 -F --pid="$build_pid" "$log_path" || true
          wait "$build_pid"
          google_status=$?
          printf 'DEADZONE_GOOGLE_UPLOAD_STATUS=%s\n' "$google_status" >> "$GITHUB_ENV"
          # Re-raise the engine exit code so a failure still
          # propagates to the workflow even though the surrounding
          # step is set -Eeuo pipefail. Without this, `tail` exits
          # 0 and the workflow would mark the step as success.
          exit "$google_status"

      - name: "🚀 Build Stable ROM (pre-refactor layout)"
        if: env.DEADZONE_ENGINE_LAYOUT == 'pre_refactor'
        working-directory: toolbuild
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_INPUT_URL: ${{ inputs.input_url }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
        run: |
          set -Eeuo pipefail
          # The pre-refactor Stable engine's pipeline is three
          # top-level scripts (`build.sh`, `packROM.sh`,
          # `uploadROM.sh`) — exactly the Lite split. The
          # launcher invokes `build.sh` here as a single
          # backgrounded shell with the engine's full output
          # routed to `build_action.log` (a durable,
          # SIGPIPE-safe `>` redirect that the shell owns, not
          # a `tee` that dies on SIGPIPE when `build.sh`
          # exits 1). `tail -F --pid=$build_pid` mirrors the
          # log file to stdout so the Actions live log keeps
          # streaming line-by-line. The exit code of `build.sh`
          # is re-raised so a failure still propagates.
          #
          # `notify.py` is invoked by `build.sh` itself for the
          # Telegram lifecycle (download, unpack, build), so we
          # do NOT call notify.py here — the engine already
          # does. `packROM.sh` and `uploadROM.sh` are run in
          # separate steps below so the launcher can copy the
          # final ZIP to a stable artifact location BEFORE
          # `uploadROM.sh` cleans up the engine's working
          # directory.
          log_path="$PWD/build_action.log"
          : > "$log_path"
          sudo -E stdbuf -oL -eL bash build.sh \
            "$DEADZONE_INPUT_URL" "$DEADZONE_SOURCE_REPOSITORY" "stable" \
            "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID" \
            > "$log_path" 2>&1 &
          build_pid=$!
          tail -n +1 -F --pid="$build_pid" "$log_path" || true
          wait "$build_pid"
          build_status=$?
          printf 'DEADZONE_BUILD_STATUS=%s\n' "$build_status" >> "$GITHUB_ENV"
          exit "$build_status"

      - name: "📦 Pack Stable ROM (pre-refactor layout)"
        if: env.DEADZONE_ENGINE_LAYOUT == 'pre_refactor' && success()
        working-directory: toolbuild
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_INPUT_URL: ${{ inputs.input_url }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
        run: |
          set -Eeuo pipefail
          # `packROM.sh` rebuilds the super.img from the
          # unpacked partitions in `build/baserom/images/` and
          # produces the final ZIP in `out/`. The pack notify
          # call mirrors the verified Lite pack step and is
          # best-effort: a Telegram failure must not fail a
          # build that has already produced a usable artifact.
          #
          # The launcher captures the final ZIP by globbing
          # `out/` IMMEDIATELY after `packROM.sh` completes,
          # because the next step (`uploadROM.sh`) deletes
          # both `out/` and `build/` on success. The captured
          # ZIP is copied to a stable artifact location
          # (`$GITHUB_WORKSPACE/out/`) so the workflow's
          # downstream artifact-metadata and upload steps can
          # find the file regardless of what `uploadROM.sh`
          # does.
          python3 notify.py pack "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_INPUT_URL" "stable" \
            "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID" || true
          sudo -E bash packROM.sh 2>&1 | tee -a build_action.log
          if [[ ! -s bin/ddevice/output_zip.txt ]]; then
            echo "::error::packROM.sh did not record the final ZIP path in bin/ddevice/output_zip.txt" >&2
            exit 1
          fi
          final_name="$(tr -d '\r\n' < bin/ddevice/output_zip.txt)"
          final_zip="$PWD/out/${final_name}"
          if [[ ! -f "$final_zip" ]]; then
            echo "::error::packROM.sh recorded '$final_name' in output_zip.txt but the file does not exist at $final_zip" >&2
            exit 1
          fi
          stable_out="$GITHUB_WORKSPACE/out"
          mkdir -p "$stable_out"
          cp -f "$final_zip" "$stable_out/${final_name}"
          echo "Captured pre-upload Stable ZIP: ${final_name}"
          printf 'DEADZONE_RESULT_NAME=%s\n' "$final_name" >> "$GITHUB_ENV"

      - name: "☁️ Setup rclone for Stable upload (pre-refactor layout)"
        if: env.DEADZONE_ENGINE_LAYOUT == 'pre_refactor' && success()
        env:
          RCLONE_CONFIG_BUILD_ENV_PATH: ${{ vars.RCLONE_CONFIG_BUILD_ENV_PATH || 'build.env' }}
        working-directory: toolbuild
        run: |
          set -euo pipefail
          # The pre-refactor Stable engine's `uploadROM.sh setup`
          # subcommand now accepts an optional 4th positional arg
          # `<build_env_path>` (in addition to the existing
          # `<token> <repo> <rclone_path>`). When the 4th arg is
          # provided, the engine fetches the build.env file from
          # the central runtime repo via the GitHub Contents API
          # and forwards its three non-secret routing values
          # (`RCLONE_REMOTE_NAME`, `RCLONE_UPLOAD_DIR`,
          # `RCLONE_PUBLIC_LINK_BASE`) to `GITHUB_ENV`. We already
          # load those values from the central runtime in the
          # `⚙️ Load central runtime` step above, so the engine
          # forwarding is redundant for THIS launcher; the
          # forwarding is still useful for the standalone
          # `DeadZone-Xiaomi-Stable` workflow and for any future
          # caller that does not have the central runtime.
          # The 3-arg form (no build.env) is still supported for
          # older engines.
          if [[ -z "${RCLONE_REMOTE_NAME:-}" || -z "${RCLONE_UPLOAD_DIR:-}" ]]; then
            echo "::error::RCLONE_REMOTE_NAME or RCLONE_UPLOAD_DIR is missing from the central runtime; cannot configure rclone for the Stable upload." >&2
            exit 1
          fi
          : "${GH_TOKEN_FOR_RCLONE:=${DEADZONE_PRIVATE_READ_TOKEN:-}}"
          : "${RCLONE_CONFIG_REPO_OWNER:=DeadZone-Offical}"
          : "${RCLONE_CONFIG_REPO_NAME:=DeadZone-File}"
          : "${RCLONE_CONFIG_PATH:=rclone.conf}"
          if [[ -z "$GH_TOKEN_FOR_RCLONE" ]]; then
            echo "::error::No GitHub token available for the rclone.conf fetch; the DEADZONE_PRIVATE_READ_TOKEN secret must be provisioned on DeadZone-Offical/DeadZone-Home." >&2
            exit 1
          fi
          sudo -E bash uploadROM.sh setup \
            "$GH_TOKEN_FOR_RCLONE" \
            "${RCLONE_CONFIG_REPO_OWNER}/${RCLONE_CONFIG_REPO_NAME}" \
            "$RCLONE_CONFIG_PATH" \
            "${RCLONE_CONFIG_BUILD_ENV_PATH:-}"
          if [[ ! -s rclone.conf ]]; then
            echo "::error::uploadROM.sh setup did not write rclone.conf to $PWD/rclone.conf" >&2
            exit 1
          fi
          chmod 600 rclone.conf

      - name: "☁️ Upload Stable ROM (pre-refactor layout)"
        if: env.DEADZONE_ENGINE_LAYOUT == 'pre_refactor' && success()
        working-directory: toolbuild
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_INPUT_URL: ${{ inputs.input_url }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
        run: |
          set -Eeuo pipefail
          # The pre-refactor Stable engine's `uploadROM.sh`
          # uploads the final ZIP to the canonical Drive path
          # `starxONEDRIVE:NTBuild/<os>/<poly>/<device>/<zip>`
          # and then cleans `$work_dir/out` and `$work_dir/build`.
          # We pre-copied the final ZIP to
          # `$GITHUB_WORKSPACE/out/<name>` in the Pack step
          # above so the artifact survives the cleanup and the
          # downstream artifact-metadata step can still find it.
          #
          # We do NOT fail the workflow on a non-zero upload
          # exit: a build that produced a usable artifact but
          # failed to upload is a "build succeeded, upload
          # failed" outcome, not a build failure. The
          # "❌ Send failure notification" step is gated on
          # `failure()` and would not fire for this case; the
          # failure is surfaced via the build summary's
          # DEADZONE_GOOGLE_UPLOAD_STATUS=0 vs !=0 rendering.
          python3 notify.py upload "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_INPUT_URL" "stable" \
            "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID" || true
          set +e
          sudo -E bash uploadROM.sh 2>&1 | tee -a build_action.log
          google_status=${PIPESTATUS[0]}
          set -e
          printf 'DEADZONE_GOOGLE_UPLOAD_STATUS=%s\n' "$google_status" >> "$GITHUB_ENV"

      - name: "📡 Report progress to bot (Lite parity)"
        if: success()
        working-directory: toolbuild
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -euo pipefail
          # The launcher's stage taxonomy matches the verified
          # Lite / Fastboot / Ninja launchers: downloading,
          # reading_rom, building, packaging, uploading. The
          # refactored engine runs as a single opaque
          # `bash build.sh --with-upload` invocation, so the
          # launcher fires the stage transitions defensively
          # around the build step itself. The pre-refactor
          # engine also runs as a single `bash build.sh`
          # invocation (the engine's `notify.py` handles
          # download/unpack/build lifecycles internally), so
          # the same defensive pattern applies — the only
          # difference is that `reading_rom` reads from
          # `bin/ddevice/*.txt` instead of
          # `build/.deadzone/rom_metadata.json`.
          #
          # Each event is best-effort: a callback failure must
          # never fail a build that already produced a usable
          # artifact. The central runtime is checked out at the
          # workspace root, so we invoke the helper via the
          # absolute path under $GITHUB_WORKSPACE rather than a
          # relative `runtime/...` that would otherwise resolve
          # against `toolbuild/` (where the helper does not
          # exist) and silently skip the events.
          runtime_dir="$GITHUB_WORKSPACE/runtime"
          python3 "$runtime_dir/build_stage.py" downloading \
            --project stable \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "ROM download finished" || true
          # The build engine writes the sanitized device
          # codename and base ROM code into one of two
          # locations, depending on the engine layout:
          #   * refactored: `build/.deadzone/rom_metadata.json`
          #     (a JSON blob with `device.codename` and
          #     `rom.version` / `rom.rom_code` fields)
          #   * pre-refactor: `bin/ddevice/device_f.txt` and
          #     `bin/ddevice/base_rom_code.txt` (Lite-style
          #     plain-text state files written by `build.sh`
          #     itself)
          # We forward them verbatim — the live panel renders
          # them as `Device:` and `ROM:` only when the engine
          # actually produced a non-empty value.
          codename=""
          rom_version=""
          if [[ "${DEADZONE_ENGINE_LAYOUT:-}" == "refactored" && -s build/.deadzone/rom_metadata.json ]]; then
            codename="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));v=(d.get("device",{}) or {}).get("codename","");print("".join(c for c in v.upper() if c.isalnum() or c in "._+-").strip("_") or "")' build/.deadzone/rom_metadata.json 2>/dev/null || true)"
            rom_version="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));v=(d.get("rom",{}) or {}).get("version","") or (d.get("rom",{}) or {}).get("rom_code","");print("".join(c for c in v if c.isalnum() or c in "._+-") or "")' build/.deadzone/rom_metadata.json 2>/dev/null || true)"
          else
            # pre_refactor — read the Lite-style state files.
            # `device_f.txt` carries the sanitized codename
            # (e.g. "apollo"); `base_rom_code.txt` carries the
            # base ROM build code (e.g. "OS2.0.1.0.VOCCNXM" or
            # "V14.0.1.0.TKOCNXM"). The codename is uppercased
            # and non-alphanumerics are stripped to match the
            # Live panel's `Device:` rendering.
            if [[ -s bin/ddevice/device_f.txt ]]; then
              codename="$(tr '[:lower:]' '[:upper:]' < bin/ddevice/device_f.txt | sed 's/ /_/g' | tr -cd 'A-Za-z0-9._+-')"
            fi
            if [[ -s bin/ddevice/base_rom_code.txt ]]; then
              rom_version="$(tr -d '\r\n' < bin/ddevice/base_rom_code.txt)"
            fi
          fi
          extra_args=()
          [[ -n "$codename" ]] && extra_args+=(--device "$codename")
          [[ -n "$rom_version" ]] && extra_args+=(--rom "$rom_version")
          # The refactored engine's partitions stage writes the
          # canonical partition count to
          # `build/.deadzone/partition_prep.json` after
          # lpunpack / extract_partition finishes. The
          # pre-refactor engine does not write that JSON; it
          # records the partition list in
          # `bin/ddevice/superSize.txt` (a single-line file
          # with the total super image size, not the count)
          # which is the wrong shape to surface to the live
          # panel. We therefore forward the partition count
          # only for the refactored layout, and emit a generic
          # "ROM metadata extracted" message for pre-refactor.
          partition_count=""
          if [[ "${DEADZONE_ENGINE_LAYOUT:-}" == "refactored" && -s build/.deadzone/partition_prep.json ]]; then
            partition_count="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(len(d.get("partitions") or []))' build/.deadzone/partition_prep.json 2>/dev/null || true)"
          fi
          reading_rom_message="ROM metadata extracted"
          if [[ -n "$partition_count" && "$partition_count" -gt 0 ]]; then
            reading_rom_message="ROM metadata extracted; detected $partition_count partition(s)"
          fi
          python3 "$runtime_dir/build_stage.py" reading_rom \
            --project stable \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "$reading_rom_message" \
            "${extra_args[@]}" || true
          python3 "$runtime_dir/build_stage.py" building \
            --project stable \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Engine build finished" || true
          python3 "$runtime_dir/build_stage.py" packaging \
            --project stable \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Super packed" || true
          python3 "$runtime_dir/build_stage.py" uploading \
            --project stable \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Upload complete" || true

      - name: "🗂️ Collect Stable artifact metadata"
        if: success()
        working-directory: toolbuild
        env:
          DEADZONE_GOOGLE_UPLOAD_STATUS: ${{ env.DEADZONE_GOOGLE_UPLOAD_STATUS }}
        run: |
          set -Euo pipefail
          # Compute the SHA-256 / size of the final Stable ZIP
          # and probe the canonical Drive URL. The location of
          # the final ZIP depends on the engine layout:
          #
          #   * refactored: `$PWD/out/DeadZone_Stable_<...>.zip`
          #     (the engine's Stage 10 release step writes it
          #     there, and the engine does NOT clean `out/`)
          #
          #   * pre-refactor: the launcher pre-copied the ZIP
          #     to `$GITHUB_WORKSPACE/out/<name>` in the
          #     "📦 Pack Stable ROM" step, because
          #     `uploadROM.sh` cleans `$PWD/out/` on success.
          #     The final name is recorded in
          #     `bin/ddevice/output_zip.txt` (which
          #     `uploadROM.sh` writes just before its rclone
          #     copy).
          #
          # We accept either location. The `if: success()`
          # gate ensures a build that never produced a final
          # ZIP already failed upstream and is reported by
          # "❌ Send failure notification", not here. Wrong
          # ZIP count is a workflow-level error (exit 1)
          # rather than a warning: if the engine's pipeline
          # ran end-to-end but did not write exactly one final
          # artifact, that is a real failure the operator
          # needs to act on.
          if [[ "${DEADZONE_ENGINE_LAYOUT:-}" == "refactored" ]]; then
            mapfile -t final_zips < <(find "$PWD/out" -maxdepth 1 -type f -name 'DeadZone_Stable_*.zip' -print 2>/dev/null)
            artifact_dir="$PWD/out"
          else
            # pre_refactor: the ZIP was pre-copied to
            # $GITHUB_WORKSPACE/out/<name> by the Pack
            # step; its name is recorded in
            # bin/ddevice/output_zip.txt. Fall back to a
            # glob in $GITHUB_WORKSPACE/out for the case
            # where the Pack step ran without the pre-copy
            # (e.g. an older launcher version that has
            # not been re-deployed).
            artifact_dir="$GITHUB_WORKSPACE/out"
            if [[ -s bin/ddevice/output_zip.txt ]]; then
              recorded_name="$(tr -d '\r\n' < bin/ddevice/output_zip.txt)"
              mapfile -t final_zips < <(find "$artifact_dir" -maxdepth 1 -type f -name "$recorded_name" -print 2>/dev/null)
            else
              mapfile -t final_zips < <(find "$artifact_dir" -maxdepth 1 -type f -name '*.zip' -print 2>/dev/null)
            fi
          fi
          if (( ${#final_zips[@]} != 1 )); then
            echo "::error::Expected exactly one preserved final Stable ZIP under ${artifact_dir}; found ${#final_zips[@]}" | tee -a build_action.log 2>/dev/null || true
            echo "::error::The Stable engine pipeline ran to completion but the final artifact is missing or duplicated under ${artifact_dir}. For the pre-refactor engine, the '📦 Pack Stable ROM' step pre-copies the final ZIP to that location so it survives uploadROM.sh's cleanup; check that step's log for the recorded output_zip.txt path." >&2
            exit 1
          fi

          final_zip="${final_zips[0]}"
          final_name="$(basename "$final_zip")"
          final_size_bytes="$(stat -c '%s' "$final_zip")"
          final_sha256="$(sha256sum "$final_zip" | awk '{print $1}')"
          printf 'DEADZONE_FILE_SIZE=%s\nDEADZONE_INTEGRITY_VERIFIED=1\nDEADZONE_RESULT_NAME=%s\nDEADZONE_INTEGRITY_SHA256=%s\n' \
            "$final_size_bytes" "$final_name" "$final_sha256" >> "$GITHUB_ENV"

          # Derive codename, ROM version, and OS folder from
          # the engine's state files. This is the same
          # source the upload stage uses, so the Drive-URL
          # probe below lines up with where the artifact
          # actually lives.
          codename=""
          rom_version=""
          os_folder=""
          if [[ "${DEADZONE_ENGINE_LAYOUT:-}" == "refactored" && -s build/.deadzone/rom_metadata.json ]]; then
            codename="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));v=(d.get("device",{}) or {}).get("codename","");print("".join(c for c in v.upper() if c.isalnum() or c in "._+-").strip("_") or "")' build/.deadzone/rom_metadata.json 2>/dev/null || true)"
            rom_version="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));v=(d.get("rom",{}) or {}).get("version","") or (d.get("rom",{}) or {}).get("rom_code","");print("".join(c for c in v if c.isalnum() or c in "._+-") or "")' build/.deadzone/rom_metadata.json 2>/dev/null || true)"
            if [[ "$rom_version" =~ ^(OS[0-9]+) ]]; then
              os_folder="${BASH_REMATCH[1]}"
            elif [[ "$rom_version" =~ ^[Vv]([0-9]+) ]]; then
              os_folder="MIUI${BASH_REMATCH[1]}"
            fi
          else
            # pre_refactor — read the Lite-style state files.
            if [[ -s bin/ddevice/device_f.txt ]]; then
              codename="$(tr '[:lower:]' '[:upper:]' < bin/ddevice/device_f.txt | sed 's/ /_/g' | tr -cd 'A-Za-z0-9._+-')"
            fi
            if [[ -s bin/ddevice/base_rom_code.txt ]]; then
              rom_version="$(tr -d '\r\n' < bin/ddevice/base_rom_code.txt)"
            fi
            if [[ "$rom_version" =~ ^(OS[0-9]+) ]]; then
              os_folder="${BASH_REMATCH[1]}"
            elif [[ "$rom_version" =~ ^[Vv]([0-9]+) ]]; then
              os_folder="MIUI${BASH_REMATCH[1]}"
            fi
          fi

          # Surface the Drive URL on the standard variable name
          # so the build summary and the success notification
          # can render the public link. The pre-refactor
          # engine's `uploadROM.sh` uploads to the hard-coded
          # remote `starxONEDRIVE:NTBuild/<os>/<poly>/<device>/`
          # (NOT the `${RCLONE_REMOTE_NAME}:${RCLONE_UPLOAD_DIR%/}/Stable/...`
          # path the central runtime's `upload-mirrors.sh`
          # expects). We probe both possible destinations so
          # the build summary always surfaces the public link
          # regardless of which layout the engine shipped.
          drive_url=""
          if [[ -n "$final_name" && -n "$codename" && -s rclone.conf ]]; then
            if [[ "${DEADZONE_ENGINE_LAYOUT:-}" == "refactored" && -n "${RCLONE_REMOTE_NAME:-}" && -n "${RCLONE_UPLOAD_DIR:-}" && -n "$os_folder" ]]; then
              drive_url="$(rclone --config=rclone.conf link "${RCLONE_REMOTE_NAME}:${RCLONE_UPLOAD_DIR%/}/Stable/${codename}/${os_folder}/${final_name}" 2>/dev/null | tail -n1 | tr -d '\r' || true)"
            fi
            if [[ -z "$drive_url" && "${DEADZONE_ENGINE_LAYOUT:-}" != "refactored" ]]; then
              # Probe the pre-refactor engine's hard-coded
              # upload path: starxONEDRIVE:NTBuild/<os>/<poly>/<device>/<zip>.
              # The `rom_os` flag in bin/ddevice/rom_os.txt
              # is "MIUI" or "HyperOS" and is the source of
              # truth for the upload directory.
              if [[ -s bin/ddevice/rom_os.txt ]]; then
                rom_os="$(tr -d '\r\n' < bin/ddevice/rom_os.txt)"
              else
                rom_os=""
              fi
              polyxver="$(tr -d '\r\n' < Version 2>/dev/null || true)"
              if [[ -n "$rom_os" && -n "$polyxver" && -n "$codename" ]]; then
                drive_url="$(rclone --config=rclone.conf link "starxONEDRIVE:NTBuild/${rom_os}/${polyxver}/${codename}/${final_name}" 2>/dev/null | tail -n1 | tr -d '\r' || true)"
              fi
            fi
          fi
          if [[ -n "$drive_url" ]]; then
            printf 'DEADZONE_GOOGLE_DRIVE_URL=%s\nDEADZONE_RESULT_URL=%s\n' "$drive_url" "$drive_url" >> "$GITHUB_ENV"
          fi

          echo "::group::Stable artifact metadata"
          echo "  - result name: ${DEADZONE_RESULT_NAME:-<missing>}"
          echo "  - size: ${DEADZONE_FILE_SIZE:-<missing>}"
          echo "  - sha256: ${DEADZONE_INTEGRITY_SHA256:-<missing>}"
          echo "  - drive url: ${DEADZONE_GOOGLE_DRIVE_URL:-<missing>}"
          echo "::endgroup::"

      - name: "✅ Send success notification"
        if: success()
        working-directory: toolbuild
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
          DEADZONE_RESULT_NAME: ${{ env.DEADZONE_RESULT_NAME }}
          DEADZONE_FILE_SIZE: ${{ env.DEADZONE_FILE_SIZE }}
          DEADZONE_INTEGRITY_SHA256: ${{ env.DEADZONE_INTEGRITY_SHA256 }}
          DEADZONE_GOOGLE_DRIVE_URL: ${{ env.DEADZONE_GOOGLE_DRIVE_URL }}
          DEADZONE_UPLOAD_VERIFIED: ${{ env.DEADZONE_UPLOAD_VERIFIED }}
        run: |
          set -euo pipefail
          # Terminal succeeded event. This is the source of
          # truth for the live panel: any post-success side
          # effect (device-profile publication) runs AFTER
          # this step so a publication failure can never fail
          # the build or prevent artifact delivery. The helper
          # is best-effort: a callback failure must not fail a
          # build that already produced a usable artifact.
          # The central runtime is checked out at the workspace
          # root, not under toolbuild, so use the absolute
          # path rather than the relative `runtime/...` that
          # would otherwise be resolved against toolbuild.
          runtime_dir="$GITHUB_WORKSPACE/runtime"
          # Build the success message. Include the verified
          # Google Drive link in the bot message ONLY when the
          # upload step verified the file on Drive. Never
          # include a stale or unverified link: the message
          # would otherwise claim an upload that did not
          # actually land. `--message` is bounded to 500 chars
          # by report_build_event.py, so we truncate the URL
          # line conservatively.
          success_message="DeadZone Stable build complete."
          if [[ "${DEADZONE_UPLOAD_VERIFIED:-}" == "1" && -n "${DEADZONE_GOOGLE_DRIVE_URL:-}" ]]; then
            success_message="${success_message} Drive: ${DEADZONE_GOOGLE_DRIVE_URL}"
          elif [[ "${DEADZONE_UPLOAD_VERIFIED:-}" == "1" ]]; then
            success_message="${success_message} (Drive upload verified, no public link available)"
          fi
          # Truncate to leave headroom for any future fields.
          success_message="${success_message:0:480}"
          if [[ -s "$runtime_dir/report_build_event.py" ]]; then
            python3 "$runtime_dir/report_build_event.py" succeeded \
              --project stable \
              --message "$success_message" || true
          fi

      - name: "🛡️ Diagnose Stable engine metadata persistence (failure-only)"
        if: failure()
        working-directory: toolbuild
        shell: bash
        run: |
          set -uo pipefail
          # The engine's metadata persistence step writes
          # build/.deadzone/rom_metadata.json and then a
          # reload-validator re-reads it to confirm the
          # JSON is well-formed and carries the fields the
          # downstream stages (super, partitions, flash,
          # release) consume. Run 38063165985 exposed a
          # regression where the engine wrote a JSON that
          # the reload-validator rejected with "Persisted
          # metadata failed reload validation -- missing
          # device.name"; the previous launcher just
          # forwarded the engine's generic "metadata
          # stage failed" line and asked the operator to
          # install erofsfuse, which was the symptom of
          # the prior (now-fixed) toolchain-permission
          # bug, not this one.
          #
          # Run 38115295186 then exposed a second,
          # independent bug: the failure-only
          # tools/inspect_rom_metadata.py helper collapsed
          # OSError (which includes PermissionError) and
          # json.JSONDecodeError into a single except
          # branch, so a runner that ran out of disk
          # during the post-upload verify_zst_roundtrip
          # surfaced a misleading "fix
          # bin/metadata/detect_props.sh" annotation when
          # the real cause was an engine-internal storage
          # problem.
          #
          # This launcher-owned step inspects whatever
          # the engine managed to persist and surfaces a
          # precise ::error:: annotation whenever the
          # reload-validator would reject the JSON, with
          # five explicit branches:
          #   1. FileNotFoundError: engine never reached
          #      persistence (likely a much earlier
          #      stage failure) -- point at
          #      detect_props.sh + build_action.log.
          #   2. JSONDecodeError: genuine malformed JSON
          #      -- blame detect_props.sh (only here).
          #   3. OSError errno 28 (ENOSPC): disk full,
          #      almost always the
          #      verify_zst_roundtrip on a multi-GB
          #      super.img.zst filling the runner's
          #      tmpfs -- do NOT blame detect_props.sh,
          #      point at the engine.
          #   4. OSError (any other errno, including
          #      PermissionError errno 13): generic
          #      read/write failure -- do NOT blame
          #      detect_props.sh.
          #   5. JSON parses but reload-validator will
          #      reject: missing device.name,
          #      device.codename, or rom.version.
          #
          # Implementation note: the Python source is
          # emitted into a temp file via a
          # single-quoted heredoc, then handed to
          # `python3 "<temp.py>"`. The single-quoted
          # heredoc keeps the YAML literal block scalar
          # flat (no Python indentation-vs-YAML-indent
          # conflict) and passes the source's own
          # apostrophes ("engine's", "runner's")
          # through verbatim -- a previous attempt that
          # used a $'...' assignment choked on those
          # apostrophes and broke the YAML/bash parse
          # chain. The launcher never modifies, fixes
          # up, or backfills the JSON: silently
          # substituting a device.name would let the
          # build proceed against a wrong device
          # profile and produce a brick-prone ROM,
          # which is the exact failure mode the
          # reload-validator exists to prevent. The
          # launcher reports; the engine fixes.
          rom_metadata_path="build/.deadzone/rom_metadata.json"
          if [[ ! -s "$rom_metadata_path" ]]; then
            # The engine never even persisted a JSON --
            # likely a much earlier failure (download,
            # classify, extract). The downstream
            # failure-notification step already names the
            # failed stage via
            # build/.deadzone/failed_stage.txt; we only
            # add a diagnostic when there is something
            # to inspect.
            exit 0
          fi
          # The Python source is base64-encoded and decoded
          # into a temp file at runtime. This keeps the
          # YAML literal block scalar flat (no Python
          # indentation-vs-YAML-indent conflict) and
          # dodges the apostrophe problem entirely
          # -- a previous $'...' assignment choked on
          # the source's "engine's" / "runner's"
          # apostrophes, and a `<<'PYEOF'` heredoc
          # inside the YAML literal block ended the
          # YAML block prematurely because the closer
          # has to sit at column 0. base64 has no shell
          # metacharacters, so the assignment is safe
          # under any quoting context.
          SCRIPT_B64=""
          SCRIPT_PATH="$(mktemp -t deadzone-inspect-rom-metadata.XXXXXX.py)"
          trap 'rm -f "$SCRIPT_PATH"' EXIT
          printf '%s' "$SCRIPT_B64" | base64 -d > "$SCRIPT_PATH"
          python3 "$SCRIPT_PATH" "$rom_metadata_path" || true


      - name: "❌ Send failure notification"
        if: failure()
        shell: bash
        working-directory: toolbuild
        run: |
          set -uo pipefail
          # The central runtime is checked out at the workspace
          # root ($GITHUB_WORKSPACE/runtime), not under toolbuild,
          # so relative `runtime/...` paths would silently miss
          # the helper files when this step runs in
          # `working-directory: toolbuild`. Pin the runtime paths
          # to the workspace root so the terminal failure callback
          # always reaches `report_build_event.py` regardless of
          # the working directory; engine-relative paths
          # (`build/.deadzone/failed_stage.txt`) still resolve via
          # the working-directory.
          runtime_dir="$GITHUB_WORKSPACE/runtime"
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s "$runtime_dir/build.env" ]]; then
            set -a
            # shellcheck disable=SC1091
            source "$runtime_dir/build.env"
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" ]]; then
            echo '::warning::Terminal Stable event cannot be signed because the central event secret is unavailable.' >&2
            exit 0
          fi
          if [[ ! -s "$runtime_dir/report_build_event.py" ]]; then
            echo '::warning::Central runtime report_build_event.py is missing; skipping the terminal failure callback.' >&2
            exit 0
          fi
          # Read the engine's per-stage failure marker so the
          # notification can name the failed stage instead of
          # emitting a generic "build failed" line. The engine
          # writes $DEADZONE_DIR/failed_stage.txt before exit 1
          # from inside its ERR trap; the path is gitignored and
          # survives only for the lifetime of the runner.
          failed_stage=""
          if [[ -s build/.deadzone/failed_stage.txt ]]; then
            failed_stage="$(tr -d '\r\n' < build/.deadzone/failed_stage.txt 2>/dev/null || true)"
          fi
          # Surface the most relevant error line from
          # build_action.log so the operator does not have to
          # download the artifact to see the engine's actual
          # diagnostic. We prefer the most recent line that
          # looks like an [ERROR] / "Failed" / "failed"
          # message; if none exists, we fall back to the very
          # last non-empty line of the log so even a wholly
          # unexpected build.sh crash still produces something
          # actionable. The build step now writes the engine's
          # full output to build_action.log durably (the prior
          # `… | tee build_action.log` pipeline lost the file
          # to SIGPIPE on the run that introduced the
          # "missing device.name" metadata error), so this
          # helper is reliable for the first time.
          detail_line=""
          if [[ -s build_action.log ]]; then
            detail_line="$(
              { grep -E '\[ERROR\]|failed|Failed|missing device\.|persisted metadata' build_action.log || true; } \
                | tail -n 1 \
                | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' \
                | tr -d '\r' \
                | head -c 400
            )"
            if [[ -z "$detail_line" ]]; then
              detail_line="$(
                tail -n 50 build_action.log \
                  | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' \
                  | grep -v '^[[:space:]]*$' \
                  | tail -n 1 \
                  | head -c 400
              )"
            fi
          fi
          failure_message="DeadZone Stable ROM build failed."
          case "$failed_stage" in
            download)
              failure_message="DeadZone Stable build failed at the download stage. Re-run the dispatch, or check the input URL."
              ;;
            classify)
              failure_message="DeadZone Stable build failed at the ROM-format classification stage. The source archive is not a recognised payload / super / fastboot / OTA-DAT layout."
              ;;
            extract)
              failure_message="DeadZone Stable build failed at the partition extraction stage. Inspect bin/extract/run_extract.sh logs; the extractor or a partition tool may be missing."
              ;;
            metadata)
              # The metadata stage has two distinct failure modes
              # the launcher has to distinguish:
              #   1. The partition EROFS images could not be
              #      unpacked so build.prop was never read. The
              #      legacy fix was "install erofsfuse / vendor
              #      bin/Linux/x86_64/extract.erofs". That fix
              #      is in place (the toolchain chmod step is
              #      mandatory) and the canonical symptom
              #      (build_action.log shows zero "Extract:"
              #      progress lines) no longer reproduces on
              #      38063165985's lineage. We keep a short
              #      pointer to it as a fallback, but it is no
              #      longer the primary message.
              #   2. The engine's own metadata persistence
              #      step wrote a rom_metadata.json that its
              #      reload-validator rejected, typically with
              #      "Persisted metadata failed reload
              #      validation — missing device.name" (the
              #      symptom of run 38063165985, fixed in this
              #      commit). That is an engine-internal bug
              #      in bin/metadata/detect_props.sh, NOT
              #      something the launcher can paper over by
              #      substituting a device name. We refuse to
              #      invent or silently backfill a device
              #      name, because doing so would let the
              #      build proceed against a wrong device
              #      profile and produce a brick-prone ROM.
              # The new message points the operator at the
              #      engine's own log, names the failing
              #      script, and does NOT ask the launcher
              #      (or the operator) to invent a device
              #      name. We still emit a short erofsfuse
              #      fallback so an operator who cannot find
              #      the persistence error in the log knows
              #      what to look at next.
              if [[ "$detail_line" == *"Persisted metadata"* || "$detail_line" == *"missing device."* || "$detail_line" == *"missing device\."* ]]; then
                failure_message="DeadZone Stable build failed at the metadata persistence / validation stage: the engine wrote build/.deadzone/rom_metadata.json that its own reload-validator rejected ($detail_line). This is an engine bug in bin/metadata/detect_props.sh, not a launcher misconfiguration; do NOT invent or substitute a device name. Fix detect_props.sh so it persists a rom_metadata.json that satisfies the reload-validator (device.name, device.codename, and rom.version are all required)."
              else
                failure_message="DeadZone Stable build failed at the metadata stage. If the engine's log shows 'Persisted metadata failed reload validation', fix bin/metadata/detect_props.sh so it persists a valid rom_metadata.json (do NOT invent a device name). If the log shows partition EROFS images failed to unpack, install erofsfuse (apt) or vendor bin/Linux/x86_64/extract.erofs."
              fi
              ;;
            super)
              failure_message="DeadZone Stable build failed at the super-image inspection stage. The super.img / payload.bin layout was not parseable."
              ;;
            partitions)
              failure_message="DeadZone Stable build failed at the partition preparation stage. Check the per-partition unpack errors in build_action.log."
              ;;
            mods)
              failure_message="DeadZone Stable build failed at the mods stage. A mod script reported an error; check build_action.log for the failing mod."
              ;;
            repack)
              failure_message="DeadZone Stable build failed at the repack stage. lpmake could not rebuild the super image from the staged partitions."
              ;;
            flash)
              failure_message="DeadZone Stable build failed at the flash bundle generation stage. The final ZIP / META-INF could not be produced."
              ;;
            release)
              failure_message="DeadZone Stable build failed at the release stage. The final ZIP did not pass the canonical naming / verification step."
              ;;
            upload)
              failure_message="DeadZone Stable build failed at the upload stage. rclone could not deliver the final ZIP; check the rclone.conf secret and target."
              ;;
          esac
          # Append the most relevant error line we extracted
          # above, when the per-stage message does not already
          # inline it. We do this for every stage, not just
          # metadata, so the failure callback is uniformly
          # useful. The truncation at 400 chars keeps the
          # event payload under the bot's reasonable size
          # limit.
          if [[ -n "$detail_line" && "$failure_message" != *"$detail_line"* ]]; then
            failure_message="$failure_message | last error: $detail_line"
          fi
          python3 "$runtime_dir/report_build_event.py" failed \
            --project stable \
            --message "$failure_message" || true

      - name: "⛔ Send cancellation notification"
        if: cancelled()
        shell: bash
        run: |
          set -uo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" ]]; then
            echo '::warning::Terminal Stable event cannot be signed because the central event secret is unavailable.' >&2
            exit 0
          fi
          if [[ ! -s runtime/report_build_event.py ]]; then
            echo '::warning::Central runtime report_build_event.py is missing; skipping the terminal cancellation callback.' >&2
            exit 0
          fi
          python3 runtime/report_build_event.py cancelled \
            --project stable \
            --message "DeadZone Stable ROM build cancelled." || true

      - name: "🧽 Cleanup Stable workspace"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # `toolbuild` may be busy if Maximize-build-space mounted an
          # LVM volume on it, and `runtime` may not exist if the
          # private-runtime checkout failed before completing. Both
          # conditions are expected after a failed Stable build, so the
          # cleanup is best-effort and never fails the job.
          if mountpoint -q toolbuild 2>/dev/null; then
            echo "Unmounting toolbuild (was a build-space mount point)"
            sudo umount toolbuild || true
          fi
          rm -rf toolbuild runtime 2>/dev/null || true
          rm -f toolbuild/rclone.conf 2>/dev/null || true
          echo "Stable workspace cleanup complete"

      - name: "📦 Upload final Stable ZIP as workflow artifact"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          # The final ZIP lives at different paths depending on
          # the engine layout:
          #   * refactored: $GITHUB_WORKSPACE/toolbuild/out/DeadZone_Stable_<...>.zip
          #     (the engine does not clean `out/`, so the ZIP
          #     is still there at the end of the run)
          #   * pre-refactor: $GITHUB_WORKSPACE/out/<name>
          #     (the launcher pre-copied the ZIP there in the
          #     "📦 Pack Stable ROM" step, because
          #     `uploadROM.sh` cleaned `$work_dir/out/`)
          # `actions/upload-artifact@v6` accepts multiple paths
          # in a single upload, so we just point at both
          # candidates and let the upload find the one that
          # exists. The `if-no-files-found: error` guard fails
          # the workflow when neither candidate exists, which
          # is the right safety net for a "build succeeded"
          # outcome that has no artifact to attach.
          name: deadzone-stable-${{ env.DEADZONE_RESULT_NAME }}
          path: |
            toolbuild/out/DeadZone_Stable_*.zip
            out/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: "📋 Upload debug logs"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            toolbuild/build_action.log
          retention-days: 1
          if-no-files-found: ignore

      - name: "📣 Build summary"
        if: always()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_RESULT_NAME: ${{ env.DEADZONE_RESULT_NAME }}
          DEADZONE_GOOGLE_DRIVE_URL: ${{ env.DEADZONE_GOOGLE_DRIVE_URL }}
        run: |
          {
            echo "## 🚀 Deadzone-Stable build"
            echo
            echo "- Project: \`Deadzone-Stable\`"
            echo "- Engine repository: \`DeadZone-Offical/DeadZone-Xiaomi-Stable\`"
            echo "- Device configuration source: \`DeadZone-Offical/DeadZone-SuperInspector\` → \`bin/DeviceConfig/<codename>/<codename>.json\`"
            echo "- Request ID: \`${DEADZONE_REQUEST_ID}\`"
            echo "- Builder: \`${DEADZONE_BUILDER_NAME:-anonymous}\`"
            [[ -n "${DEADZONE_RESULT_NAME:-}" ]] && echo "- Final ZIP: \`${DEADZONE_RESULT_NAME}\`"
            [[ -n "${DEADZONE_GOOGLE_DRIVE_URL:-}" ]] && echo "- Drive URL: ${DEADZONE_GOOGLE_DRIVE_URL}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
