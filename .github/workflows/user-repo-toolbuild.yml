# user-repo-toolbuild.yml
#
# Single generic Telegram-dispatch entry point. The Telegram bot
# (`DeadZone-Offical/DeadZone-Bot`) POSTs a `workflow_dispatch` payload
# to this file regardless of which project the user picked. The bot
# does not need to know which per-project launcher file
# (`build.yml`, `build-jesse.yml`, `port.yml`, …) actually owns the
# build. This file forwards the request to the matching per-project
# reusable workflow via `uses:` so the existing engine code keeps
# running unchanged.
#
# Concurrency model
# ----------------
# Each `workflow_dispatch` invocation creates a fresh GitHub Actions
# run with its own runner, its own workspace, its own
# `toolbuild/` checkout, and its own log/artifact uploads. GitHub
# Actions is responsible for scheduling; 20 simultaneous dispatches
# become 20 simultaneous independent runs (subject to repo/org
# concurrency limits). The per-project `concurrency:` block on each
# reusable workflow continues to enforce "one Lite build, one Jesse
# build, one Port build, … at a time".

name: DeadZone-Home User-Repo Toolbuild

concurrency:
  # Cancelling in-progress is safe: each dispatch is a discrete user
  # request, not a queued series. A new /start press supersedes the
  # previous one.
  group: deadzone-home-user-repo-toolbuild-${{ inputs.request_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      project:
        description: 🧩 Selected builder
        required: true
        type: choice
        options:
          - lite
          - jesse
          - port
          - port_coloros
          - port_oxygenos
          - port_realmeui
      input_url:
        description: 📥 ROM / firmware HTTPS URL (non-port projects)
        required: false
        type: string
      stock_rom_url:
        description: 📥 Stock ROM HTTPS URL (port projects only)
        required: false
        type: string
      port_rom_url:
        description: 📥 Port ROM HTTPS URL (port projects only)
        required: false
        type: string
      build_name:
        description: 🏷️ Build name — required by `jesse` only
        required: false
        type: string
      builder_name:
        description: 👤 Builder display name
        required: false
        type: string
      builder_id:
        description: 💬 Telegram user ID
        required: true
        type: string
      request_id:
        description: 🆔 DeadZone controlled build request ID
        required: true
        type: string
      callback_url:
        description: 🔗 Signed DeadZone build-event endpoint
        required: true
        type: string

permissions:
  contents: read

# Six parallel jobs — one per supported builder — each gated by the
# `project` input. Only the matching job runs; the other five are
# skipped at the `if:` gate, so only one runner is ever consumed.
# GitHub Actions' workflow_dispatch validator accepts static
# `uses: <reusable workflow path>` references at parse time and does
# NOT allow dynamic `uses: ${{ … }}` expressions, so this matrix-of-if
# pattern is required.
jobs:
  lite:
    if: ${{ inputs.project == 'lite' }}
    name: 🚀 Lite
    uses: ./.github/workflows/lite-core.yml
    with:
      input_url: ${{ inputs.input_url }}
      builder_name: ${{ inputs.builder_name }}
      builder_id: ${{ inputs.builder_id }}
      request_id: ${{ inputs.request_id }}
      callback_url: ${{ inputs.callback_url }}
    secrets: inherit

  jesse:
    if: ${{ inputs.project == 'jesse' }}
    name: 🚀 Jesse
    uses: ./.github/workflows/jesse-core.yml
    with:
      input_url: ${{ inputs.input_url }}
      build_name: ${{ inputs.build_name }}
      builder_name: ${{ inputs.builder_name }}
      builder_id: ${{ inputs.builder_id }}
      request_id: ${{ inputs.request_id }}
      callback_url: ${{ inputs.callback_url }}
    secrets: inherit

  port:
    if: ${{ inputs.project == 'port' }}
    name: 🚀 Port
    uses: ./.github/workflows/port-core.yml
    with:
      stock_rom_url: ${{ inputs.stock_rom_url }}
      port_rom_url: ${{ inputs.port_rom_url }}
      builder_name: ${{ inputs.builder_name }}
      builder_id: ${{ inputs.builder_id }}
      request_id: ${{ inputs.request_id }}
      callback_url: ${{ inputs.callback_url }}
    secrets: inherit

  port_coloros:
    if: ${{ inputs.project == 'port_coloros' }}
    name: 🚀 Port ColorOS
    uses: ./.github/workflows/port-coloros.yml
    with:
      stock_rom_url: ${{ inputs.stock_rom_url }}
      port_rom_url: ${{ inputs.port_rom_url }}
      builder_name: ${{ inputs.builder_name }}
      builder_id: ${{ inputs.builder_id }}
      request_id: ${{ inputs.request_id }}
      callback_url: ${{ inputs.callback_url }}
    secrets: inherit

  port_oxygenos:
    if: ${{ inputs.project == 'port_oxygenos' }}
    name: 🚀 Port OxygenOS
    uses: ./.github/workflows/port-oxygenos.yml
    with:
      stock_rom_url: ${{ inputs.stock_rom_url }}
      port_rom_url: ${{ inputs.port_rom_url }}
      builder_name: ${{ inputs.builder_name }}
      builder_id: ${{ inputs.builder_id }}
      request_id: ${{ inputs.request_id }}
      callback_url: ${{ inputs.callback_url }}
    secrets: inherit

  port_realmeui:
    if: ${{ inputs.project == 'port_realmeui' }}
    name: 🚀 Port RealmeUI
    uses: ./.github/workflows/port-realmeui.yml
    with:
      stock_rom_url: ${{ inputs.stock_rom_url }}
      port_rom_url: ${{ inputs.port_rom_url }}
      builder_name: ${{ inputs.builder_name }}
      builder_id: ${{ inputs.builder_id }}
      request_id: ${{ inputs.request_id }}
      callback_url: ${{ inputs.callback_url }}
    secrets: inherit