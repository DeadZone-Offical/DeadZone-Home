name: DeadZone-Home SuperInspector Core

# Workflow 5 - Super Inspector reusable workflow (DeadZone-Home).
#
# Mirrors DeadZone-MEZO/.github/workflows/superinspector-core.yml exactly.
# Differences vs the legacy workflow:
#   - The launcher that runs this workflow is now DeadZone-Offical/DeadZone-Home.
#   - The pinned SuperInspector engine is now cloned from
#     DeadZone-Offical/DeadZone-SuperInspector.
#   - The publish destinations default to DeadZone-Offical/DeadZone-xiaomi_Lite
#     and DeadZone-Offical/DeadZone-xiaomi_Port.
# The callback signing, status envelope, ROM download contract, archive
# validation, and publishing tree are byte-identical to the legacy
# implementation so the bot sees the same behaviour.

on:
  workflow_call:
    inputs:
      job_id:
        description: "DeadZone Super Inspector job ID"
        required: true
        type: string
      rom_url:
        description: "HTTP(S) URL of the Xiaomi Fastboot ROM archive"
        required: true
        type: string
      original_filename:
        description: "Original ROM filename (optional)"
        required: false
        type: string
        default: ""
      inspector_ref:
        description: "Pinned DeadZone-SuperInspector commit SHA"
        required: true
        type: string
      target_repo:
        description: "Repository slug that owns this run (launcher)"
        required: true
        type: string
      profile_id:
        description: "Pre-allocated 16-hex profile ID (idempotency key)"
        required: true
        type: string
      callback_url:
        description: "Signed DeadZone callback URL"
        required: true
        type: string
      max_rom_bytes:
        description: "Hard cap for ROM download in bytes"
        required: false
        type: string
        default: "12884901888"
      downloads_root:
        description: "Directory inside the runner where ROMs and profiles live"
        required: false
        type: string
        default: "deadzone-runtime/jobs"
      publish_lite_repo:
        description: "Lite profile publishing target"
        required: false
        type: string
        default: "DeadZone-Offical/DeadZone-xiaomi_Lite"
      publish_port_repo:
        description: "Port profile publishing target"
        required: false
        type: string
        default: "DeadZone-Offical/DeadZone-xiaomi_Port"
      publish_enabled:
        description: "Whether to publish the generated profile"
        required: false
        type: string
        default: "true"
    secrets:
      GH_TOKEN:
        required: true
      SUPER_INSPECTOR_REPOSITORY_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  analyze_and_publish:
    name: "Analyze + Publish"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEADZONE_JOB_ID: ${{ inputs.job_id }}
      DEADZONE_PROFILE_ID: ${{ inputs.profile_id }}
      DEADZONE_INSPECTOR_REF: ${{ inputs.inspector_ref }}
      DEADZONE_TARGET_REPO: ${{ inputs.target_repo }}
      DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
      DEADZONE_MAX_ROM_BYTES: ${{ inputs.max_rom_bytes }}
      DEADZONE_DOWNLOADS_ROOT: ${{ inputs.downloads_root }}
      DEADZONE_PUBLISH_LITE_REPO: ${{ inputs.publish_lite_repo }}
      DEADZONE_PUBLISH_PORT_REPO: ${{ inputs.publish_port_repo }}
      DEADZONE_PUBLISH_ENABLED: ${{ inputs.publish_enabled }}
      DEADZONE_INSPECTOR_REPOSITORY: "DeadZone-Offical/DeadZone-SuperInspector"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPER_INSPECTOR_REPOSITORY_TOKEN: ${{ secrets.SUPER_INSPECTOR_REPOSITORY_TOKEN }}
    steps:
      - name: "Checkout launcher repository (for publish step)"
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ github.event.repository.default_branch }}
          path: launcher_repo
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: "Validate inputs"
        id: validate_inputs
        shell: bash
        env:
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_JOB_ID: ${{ inputs.job_id }}
          DEADZONE_PROFILE_ID: ${{ inputs.profile_id }}
          DEADZONE_INSPECTOR_REF: ${{ inputs.inspector_ref }}
          DEADZONE_TARGET_REPO: ${{ inputs.target_repo }}
          DEADZONE_MAX_ROM_BYTES: ${{ inputs.max_rom_bytes }}
          DEADZONE_PUBLISH_LITE_REPO: ${{ inputs.publish_lite_repo }}
          DEADZONE_PUBLISH_PORT_REPO: ${{ inputs.publish_port_repo }}
        run: |
          set -Eeuo pipefail
          [[ "$DEADZONE_JOB_ID" =~ ^super_[A-Za-z0-9._:-]{1,128}$ ]] || { echo "::error::invalid job_id"; exit 1; }
          [[ "$DEADZONE_PROFILE_ID" =~ ^[a-f0-9]{16}$ ]] || { echo "::error::invalid profile_id"; exit 1; }
          [[ "$DEADZONE_INSPECTOR_REF" =~ ^[a-f0-9]{7,64}$ ]] || { echo "::error::invalid inspector_ref"; exit 1; }
          [[ "$DEADZONE_TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid target_repo"; exit 1; }
          [[ "$DEADZONE_CALLBACK_URL" =~ ^https:// ]] || { echo "::error::callback_url must be https"; exit 1; }
          [[ "$DEADZONE_MAX_ROM_BYTES" =~ ^[0-9]+$ ]] || { echo "::error::max_rom_bytes invalid"; exit 1; }

          for repo in "$DEADZONE_PUBLISH_LITE_REPO" "$DEADZONE_PUBLISH_PORT_REPO"; do
            [[ "$repo" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid publish repo: $repo"; exit 1; }
          done

          echo "Inputs validated."

      - name: "Create isolated workspace"
        id: workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          build_volume="${BUILD_VOLUME:-${{ github.workspace }}/toolbuild}"
          mkdir -p "$build_volume"
          root="$build_volume/$DEADZONE_DOWNLOADS_ROOT/$DEADZONE_JOB_ID"
          mkdir -p "$root"/input "$root"/inspector "$root"/output "$root"/logs "$root"/downloads "$root"/stage
          echo "ROOT=$root" >> "$GITHUB_OUTPUT"
          echo "BUILD_VOLUME=$build_volume" >> "$GITHUB_ENV"
          echo "workspace=$root"
          df -h "$root"
          ls -la "$root"

      - name: "Maximize build space"
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          build-mount-path: ${{ github.workspace }}/toolbuild
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: "Clean unused runner packages"
        run: |
          set -Eeuo pipefail
          docker image prune --all --force || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android || true
          sudo apt-get purge -y azure-cli "ghc*" "zulu*" "hhvm*" "llvm*" firefox "google*" "dotnet*" powershell "mysql*" "php*" || true
          sudo apt-get autoremove --purge -y || true
          sudo apt-get clean

      - name: "Install system dependencies (Lite-equivalent)"
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 jq rclone python-is-python3 wget python3 python3-pip python3-venv \
            lz4 xz-utils zlib1g-dev gcc g++ libc6 libstdc++6 \
            busybox zip unzip p7zip-full zipalign zstd bc erofs-utils \
            android-sdk-libsparse-utils xmlstarlet aapt rsync openssh-client curl \
            git file tar gawk binutils
          sudo pip3 install --break-system-packages --no-cache-dir pyyaml || \
            sudo pip3 install --no-cache-dir pyyaml
          python3 -V
          pip3 -V

      - name: "Checkout central DeadZone runtime"
        uses: actions/checkout@v4
        with:
          repository: DeadZone-Offical/DeadZone-File
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            projects.env
            build.env
            rclone.conf
            load-build.sh
            report_build_event.py
            upload.env
            upload-mirrors.sh
            publish-website-release.py
          sparse-checkout-cone-mode: false

      - name: "Load central runtime (BUILD_PROGRESS_SECRET)"
        id: runtime
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEADZONE_CONTROLLED_BUILD: "1"
        run: |
          set -Eeuo pipefail
          for runtime_file in projects.env build.env load-build.sh report_build_event.py; do
            if [[ ! -s "runtime/${runtime_file}" ]]; then
              echo "::error::Central runtime file is missing or empty: ${runtime_file}"
              exit 1
            fi
          done
          chmod 700 runtime/load-build.sh
          python3 -m py_compile runtime/report_build_event.py || true
          bash runtime/load-build.sh lite

      - name: "Validate loaded runtime + derive callback secret"
        shell: bash
        env:
          BUILD_PROGRESS_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${BUILD_PROGRESS_SECRET:-}" ]]; then
            echo "::error::Central runtime did not provide BUILD_PROGRESS_SECRET"
            exit 1
          fi
          if [[ ! "${BUILD_PROGRESS_SECRET}" =~ ^[0-9a-f]{32,128}$ ]]; then
            echo "::error::Loaded BUILD_PROGRESS_SECRET is not a hex string"
            exit 1
          fi
          printf '::add-mask::%s\n' "$BUILD_PROGRESS_SECRET"
          printf 'DEADZONE_EVENT_SECRET=%s\n' "$BUILD_PROGRESS_SECRET" >> "$GITHUB_ENV"
          printf 'DEADZONE_CALLBACK_SECRET=%s\n' "$BUILD_PROGRESS_SECRET" >> "$GITHUB_ENV"
          echo "callback secret loaded (sha256 prefix: ${BUILD_PROGRESS_SECRET:0:8})"

      - name: "Stage callback emitter + validator helpers (self-contained)"
        shell: bash
        env:
          DEADZONE_HOME_REPO: "DeadZone-Offical/DeadZone-Home"
          DEADZONE_HOME_REF: "main"
        run: |
          set -Eeuo pipefail
          repo_root="${DEADZONE_REPO_ROOT:-/tmp/deadzone_home_self}"
          if [[ ! -s "$repo_root/.github/scripts/dz_emit_callback.py" ]]; then
            echo "fetching ${DEADZONE_HOME_REPO}@${DEADZONE_HOME_REF} into $repo_root"
            rm -rf "$repo_root"
            git clone --depth=1 --quiet --branch "${DEADZONE_HOME_REF}" \
              "https://github.com/${DEADZONE_HOME_REPO}.git" "$repo_root"
          fi
          if [[ ! -s "$repo_root/.github/scripts/dz_emit_callback.py" ]]; then
            echo "::error::missing self-contained dz_emit_callback.py in $repo_root/.github/scripts/"
            exit 1
          fi
          if [[ ! -s "$repo_root/.github/scripts/dz_validate_rom.py" ]]; then
            echo "::error::missing self-contained dz_validate_rom.py in $repo_root/.github/scripts/"
            exit 1
          fi
          if [[ ! -s "$repo_root/.github/scripts/lib/deadzone_mezo.py" ]]; then
            echo "::error::missing self-contained lib/deadzone_mezo.py in $repo_root/.github/scripts/lib/"
            exit 1
          fi
          mkdir -p /tmp
          cp "$repo_root/.github/scripts/dz_emit_callback.py" /tmp/dz_emit_callback.py
          cp "$repo_root/.github/scripts/dz_validate_rom.py" /tmp/dz_validate_rom.py
          chmod +x /tmp/dz_emit_callback.py /tmp/dz_validate_rom.py
          python3 -m py_compile /tmp/dz_emit_callback.py /tmp/dz_validate_rom.py
          printf 'DEADZONE_REPO_ROOT=%s\n' "$repo_root" >> "$GITHUB_ENV"
          printf 'CALLER_REPO_DIR=%s\n' "${{ github.workspace }}/launcher_repo" >> "$GITHUB_ENV"
          echo "self-contained helpers staged from $repo_root/.github/scripts/"

      - name: "Report setup.started"
        if: success()
        shell: bash
        run: |
          set +e
          python3 /tmp/dz_emit_callback.py setup.started setup "Preparing Super Inspector worker"
          exit 0

      - name: "Report setup.completed"
        if: success()
        shell: bash
        run: |
          set +e
          python3 /tmp/dz_emit_callback.py setup.completed setup "Worker environment ready"
          exit 0

      - name: "Report download.started"
        if: success()
        shell: bash
        run: |
          set +e
          python3 /tmp/dz_emit_callback.py download.started download "Downloading ROM from upstream mirror"
          exit 0

      - name: "Download ROM (streamed, bounded)"
        id: download
        shell: bash
        env:
          ROM_URL: ${{ inputs.rom_url }}
          ORIGINAL_FILENAME: ${{ inputs.original_filename }}
        run: |
          set -Eeuo pipefail
          root="${{ steps.workspace.outputs.ROOT }}"
          rom_dir="$root/input"
          mkdir -p "$rom_dir"

          safe_url="$ROM_URL"
          if [[ "$safe_url" =~ ^[A-Za-z]+://([^/:@]+):([^/:@]+)@ ]]; then
            echo "::error::Refusing URL with embedded credentials"
            export CURL_STATUS="url_rejected"
            python3 /tmp/dz_emit_callback.py download.failed download "refusing URL with embedded credentials" || true
            exit 1
          fi
          case "$safe_url" in
            http://*|https://*) ;;
            *)
              echo "::error::Refusing non-http(s) URL"
              export CURL_STATUS="url_rejected"
              python3 /tmp/dz_emit_callback.py download.failed download "refusing non-http(s) URL" || true
              exit 1
              ;;
          esac

          base_name="$ORIGINAL_FILENAME"
          if [[ -z "$base_name" ]]; then
            base_name="$(basename "${safe_url%%\?*}")"
          fi
          base_name="${base_name:-rom.bin}"
          base_name="$(printf '%s' "$base_name" | tr -cd 'A-Za-z0-9._-')"
          [[ -n "$base_name" ]] || base_name="rom.bin"
          target="$rom_dir/$base_name"
          max_bytes="$DEADZONE_MAX_ROM_BYTES"

          if ! [[ "$max_bytes" =~ ^[0-9]+$ ]] || (( max_bytes <= 0 )); then
            echo "::error::max_rom_bytes is invalid: ${DEADZONE_MAX_ROM_BYTES}"
            exit 1
          fi

          echo "Downloading ROM:"
          echo "  url       = $safe_url"
          echo "  target    = $target"
          echo "  max_bytes = $max_bytes"

          set +e
          curl_args=(
            --silent --show-error --location --max-redirs 10
            --max-filesize "$max_bytes"
            --fail-with-body
            --connect-timeout 15
            --max-time 3600
            --output "$target.part"
            --write-out "http_code=%{http_code}\nsize=%{size_download}\n"
            -A "DeadZone-SuperInspector/1.0 (+https://github.com/DeadZone-Offical)"
          )
          curl "${curl_args[@]}" "$safe_url" 2>&1 | tee "$rom_dir/curl.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::error::ROM download failed (curl exit $status); see $rom_dir/curl.log"
            rm -f "$target.part"
            export CURL_STATUS="$status"
            python3 /tmp/dz_emit_callback.py download.failed download "curl exit ${CURL_STATUS}; see ${rom_dir}/curl.log" || true
            exit 1
          fi

          if [[ ! -s "$target.part" ]]; then
            echo "::error::Downloaded file is empty"
            rm -f "$target.part"
            export CURL_STATUS="empty"
            python3 /tmp/dz_emit_callback.py download.failed download "downloaded file is empty" || true
            exit 1
          fi

          size=$(stat -c '%s' "$target.part")
          if (( size <= 0 )); then
            echo "::error::Downloaded archive is empty"
            rm -f "$target.part"
            export CURL_STATUS="empty"
            python3 /tmp/dz_emit_callback.py download.failed download "downloaded archive is empty" || true
            exit 1
          fi
          if (( size > max_bytes )); then
            echo "::error::Archive exceeds $max_bytes bytes (got $size)"
            rm -f "$target.part"
            export CURL_STATUS="too_large"
            python3 /tmp/dz_emit_callback.py download.failed download "archive exceeds ${max_bytes} bytes (got ${size})" || true
            exit 1
          fi

          mv "$target.part" "$target"
          sha256=$(sha256sum "$target" | awk '{print $1}')
          echo "ROM_SHA256=$sha256" >> "$GITHUB_OUTPUT"
          echo "ROM_PATH=$target" >> "$GITHUB_OUTPUT"
          echo "ROM_SIZE=$size" >> "$GITHUB_OUTPUT"
          echo "ROM_NAME=$base_name" >> "$GITHUB_OUTPUT"
          echo "downloaded $base_name ($size bytes) sha256=$sha256"

      - name: "Validate downloaded ROM archive"
        id: validate_archive
        shell: bash
        env:
          ROM_PATH: ${{ steps.download.outputs.ROM_PATH }}
        run: |
          set -Eeuo pipefail
          if ! python3 /tmp/dz_validate_rom.py "$ROM_PATH"; then
            echo "::error::ROM archive failed structural validation"
            python3 /tmp/dz_emit_callback.py download.failed download "archive failed structural validation (not a valid tar.gz/tar)" || true
            exit 1
          fi
          echo "archive validated"

      - name: "Report download.completed"
        if: success()
        shell: bash
        env:
          ROM_SHA256: ${{ steps.download.outputs.ROM_SHA256 }}
          ROM_SIZE: ${{ steps.download.outputs.ROM_SIZE }}
          ROM_NAME: ${{ steps.download.outputs.ROM_NAME }}
        run: |
          set +e
          python3 /tmp/dz_emit_callback.py download.completed download "ROM ready for analysis" \
            "romSha256=$ROM_SHA256" "romSize=$ROM_SIZE" "romName=$ROM_NAME"
          exit 0

      - name: "Run self-contained deadzone_mezo pipeline (Lite-equivalent extraction)"
        id: mezo_pipeline
        shell: bash
        run: |
          set -Eeuo pipefail
          root="${{ steps.workspace.outputs.ROOT }}"
          rom="${{ steps.download.outputs.ROM_PATH }}"
          out="$root/mezo_output"
          rm -rf "$out"
          mkdir -p "$out"
          repo_root="${DEADZONE_REPO_ROOT:-/tmp/deadzone_home_self}"
          if [[ ! -s "$repo_root/.github/scripts/lib/deadzone_mezo.py" ]]; then
            echo "::error::self-contained lib/deadzone_mezo.py missing in $repo_root/.github/scripts/lib/"
            exit 1
          fi
          echo "running self-contained deadzone_mezo pipeline against $rom"
          START_MS=$(date +%s%3N)
          set +e
          mkdir -p "$root/logs"
          # The legacy workflow exposes an e2e_real_rom.py driver; in this
          # new repo we only ship the deadzone_mezo library, so we call
          # the library directly through its analyze_rom_path entry point.
          python3 - <<PY
          import sys, os
          sys.path.insert(0, "$repo_root/.github/scripts")
          from lib.deadzone_mezo import analyze_rom_path
          result = analyze_rom_path("$rom", output_dir="$out")
          print("profile_id:", result.profile.get("profile_id"))
          PY
          status="${PIPESTATUS[0]}"
          set -e
          END_MS=$(date +%s%3N)
          if [[ "$status" -ne 0 ]]; then
            echo "::error::deadzone_mezo pipeline exited with $status"
            python3 /tmp/dz_emit_callback.py analyze.failed analyze "deadzone_mezo pipeline exited with $status" || true
            exit "$status"
          fi
          profile_path="$out/device.profile.json"
          if [[ ! -s "$profile_path" ]]; then
            echo "::error::deadzone_mezo did not write profile.json to $out"
            exit 1
          fi
          profile_sha=$(sha256sum "$profile_path" | awk '{print $1}')
          echo "MEZO_PROFILE_PATH=$profile_path" >> "$GITHUB_OUTPUT"
          echo "MEZO_PROFILE_SHA256=$profile_sha" >> "$GITHUB_OUTPUT"
          echo "MEZO_DURATION_MS=$((END_MS - START_MS))" >> "$GITHUB_OUTPUT"
          echo "deadzone_mezo pipeline OK in $((END_MS - START_MS)) ms"
          echo "profile sha256: $profile_sha"

      - name: "Report analyze.started"
        if: success()
        shell: bash
        run: |
          set +e
          python3 /tmp/dz_emit_callback.py analyze.started analyze "Running DeadZone-SuperInspector analysis"
          exit 0

      - name: "Checkout pinned DeadZone-SuperInspector"
        id: checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPER_INSPECTOR_REPOSITORY_TOKEN: ${{ secrets.SUPER_INSPECTOR_REPOSITORY_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ env.PRIVATE_REPO_TOKEN }}
        run: |
          set -Eeuo pipefail
          root="${{ steps.workspace.outputs.ROOT }}"
          repo_url="https://github.com/${DEADZONE_INSPECTOR_REPOSITORY}"
          clone_repo() {
            local tok="$1"
            local hdr
            hdr="$(printf 'x-access-token:%s' "$tok" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic ${hdr}" \
                clone --no-tags "$repo_url" "$root/inspector"
          }
          token=""
          if [[ -n "${SUPER_INSPECTOR_REPOSITORY_TOKEN:-}" ]]; then
            token="$SUPER_INSPECTOR_REPOSITORY_TOKEN"
          elif [[ -n "${PRIVATE_REPO_TOKEN:-}" ]]; then
            token="$PRIVATE_REPO_TOKEN"
          else
            token="$GH_TOKEN"
          fi
          clone_repo "$token"
          cd "$root/inspector"
          git fetch --quiet --unshallow origin 2>/dev/null || true
          git checkout --quiet "$DEADZONE_INSPECTOR_REF"
          RESOLVED_SHA="$(git rev-parse HEAD)"
          echo "RESOLVED_SHA=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "inspector @ $RESOLVED_SHA"

      - name: "Install dz-inspector + dependencies"
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v python3 >/dev/null || { echo "::error::python3 missing"; exit 1; }
          python3 -V
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "pyyaml"
          python3 -m pip install --quiet "${{ steps.workspace.outputs.ROOT }}/inspector"
          command -v dz-inspector >/dev/null || {
            echo "::error::dz-inspector CLI was not installed by `pip install`"
            python3 -m pip install --quiet --force-reinstall "${{ steps.workspace.outputs.ROOT }}/inspector"
            command -v dz-inspector >/dev/null || {
              echo "::error::dz-inspector CLI still missing after reinstall"
              exit 1
            }
          }
          dz-inspector --version || true

      - name: "Run DeadZone-SuperInspector analyze"
        id: analyze
        shell: bash
        run: |
          set -Eeuo pipefail
          root="${{ steps.workspace.outputs.ROOT }}"
          rom="${{ steps.download.outputs.ROM_PATH }}"
          out="$root/output"
          rm -rf "$out"
          mkdir -p "$out"
          cd "$root/inspector"
          chmod +x ./build.sh
          START_MS=$(date +%s%3N)
          set +e
          ./build.sh analyze "$rom" --output "$out" 2>&1 | tee "$root/logs/analyze.log"
          status="${PIPESTATUS[0]}"
          set -e
          END_MS=$(date +%s%3N)
          if [[ "$status" -ne 0 ]]; then
            echo "::error::dz-inspector analyze exited with $status"
            FAIL_MSG="$(tail -n 30 "$root/logs/analyze.log" 2>/dev/null | tr -d '\r' | tr '\n' ' ' | cut -c1-500)"
            if [[ -n "$FAIL_MSG" ]]; then
              export details="$FAIL_MSG"
            fi
            python3 /tmp/dz_emit_callback.py analyze.failed analyze "dz-inspector analyze exited with non-zero status" || true
            exit "$status"
          fi
          profile_dir="$(find "$out" -mindepth 3 -maxdepth 3 -type d -name "[a-f0-9]*" | head -n1)"
          if [[ -z "$profile_dir" || ! -s "$profile_dir/device.json" ]]; then
            echo "::error::device.json missing under $out"
            export details="device.json missing under $out"
            python3 /tmp/dz_emit_callback.py analyze.failed analyze "device.json missing after analysis" || true
            exit 1
          fi
          profile_sha=$(sha256sum "$profile_dir/device.json" | awk '{print $1}')
          echo "PROFILE_DIR=$profile_dir" >> "$GITHUB_OUTPUT"
          echo "PROFILE_SHA256=$profile_sha" >> "$GITHUB_OUTPUT"
          echo "DURATION_MS=$((END_MS - START_MS))" >> "$GITHUB_OUTPUT"
          echo "analyze OK in $((END_MS - START_MS)) ms"

      - name: "Build canonical Device Profile + analyze.completed payload"
        id: canonical
        env:
          RESOLVED_SHA: ${{ steps.checkout.outputs.RESOLVED_SHA }}
          PROFILE_DIR: ${{ steps.analyze.outputs.PROFILE_DIR }}
          DURATION_MS: ${{ steps.analyze.outputs.DURATION_MS }}
          ROM_NAME: ${{ steps.download.outputs.ROM_NAME }}
        run: |
          set -Eeuo pipefail
          root="${{ steps.workspace.outputs.ROOT }}"
          out_base="$(dirname "$(dirname "$PROFILE_DIR")")"
          out_base="$(realpath "$out_base")"
          cb_path="$root/output/callback.json"
          python3 "$root/inspector/scripts/emit_canonical_profile.py" \
            --output-dir "$out_base" \
            --generator-repository "DeadZone-Offical/DeadZone-SuperInspector" \
            --generator-ref "$DEADZONE_INSPECTOR_REF" \
            --generator-resolved-sha "$RESOLVED_SHA" \
            --archive-url "https://github.com/$DEADZONE_TARGET_REPO/actions/runs/${GITHUB_RUN_ID:-local}/${DEADZONE_PROFILE_ID}" \
            --inspector-ref "$DEADZONE_INSPECTOR_REF" \
            --inspector-resolved-sha "$RESOLVED_SHA" \
            --inspector-repository "DeadZone-Offical/DeadZone-SuperInspector" \
            --target-repo "$DEADZONE_TARGET_REPO" \
            --job-id "$DEADZONE_JOB_ID" \
            --profile-id "$DEADZONE_PROFILE_ID" \
            --run-id "${GITHUB_RUN_ID:-}" \
            --duration-ms "$DURATION_MS" \
            --emit-callback analyze_completed \
            --out "$cb_path"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['profileId']==d['profile']['profile_id']=='$DEADZONE_PROFILE_ID', 'profile_id mismatch'" "$cb_path"
          canon_sha=$(sha256sum "$cb_path" | awk '{print $1}')
          echo "CANONICAL_SHA256=$canon_sha" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_CALLBACK_PATH=$cb_path" >> "$GITHUB_OUTPUT"

      - name: "Cross-validate deadzone_mezo profile against canonical"
        id: cross_validate
        if: success() && steps.canonical.outputs.CANONICAL_CALLBACK_PATH != ''
        shell: bash
        env:
          MEZO_PROFILE_PATH: ${{ steps.mezo_pipeline.outputs.MEZO_PROFILE_PATH }}
          CANONICAL_CALLBACK_PATH: ${{ steps.canonical.outputs.CANONICAL_CALLBACK_PATH }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, sys
          mezo = json.load(open(os.environ["MEZO_PROFILE_PATH"], encoding="utf-8"))
          canon = json.load(open(os.environ["CANONICAL_CALLBACK_PATH"], encoding="utf-8"))["profile"]
          mezo_codename = mezo["device"]["primary_codename"]
          canon_codename = canon["device"]["primary_codename"]
          if mezo_codename != canon_codename:
              raise SystemExit(f"codename mismatch: mezo={mezo_codename} canonical={canon_codename}")
          print(f"cross-validate OK: codename={mezo_codename} agrees with canonical")
          PY

      - name: "Report analyze.completed"
        if: success()
        shell: bash
        env:
          DZ_CALLBACK_PATH: ${{ steps.canonical.outputs.CANONICAL_CALLBACK_PATH }}
        run: |
          set +e
          python3 /tmp/dz_emit_callback.py --callback-file "$DZ_CALLBACK_PATH" analyze.completed analyze "ROM analysis completed"
          exit 0

      - name: "Validate canonical Device Profile (bot contract)"
        id: validate_profile
        shell: bash
        env:
          CANONICAL_CALLBACK_PATH: ${{ steps.canonical.outputs.CANONICAL_CALLBACK_PATH }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          payload = json.load(open(os.environ["CANONICAL_CALLBACK_PATH"], encoding="utf-8"))
          profile = payload["profile"]
          required = {
              "profile_id": str,
              "schemaVersion": str,
              "device": dict,
              "rom": dict,
              "super": dict,
              "fastboot": dict,
              "artefact_paths": dict,
          }
          for k, t in required.items():
              if not isinstance(profile.get(k), t):
                  raise SystemExit(f"profile.{k} invalid")
          if not re.fullmatch(r"[a-f0-9]{16}", profile["profile_id"]):
              raise SystemExit("profile_id is not 16-hex")
          primary = profile["device"].get("primary_codename")
          if not isinstance(primary, str) or not primary:
              raise SystemExit("device.primary_codename missing")
          inspector = profile.get("generator") or {}
          ref = inspector.get("ref") or inspector.get("commit")
          if not isinstance(ref, str) or not re.fullmatch(r"[a-f0-9]{7,64}", ref):
              raise SystemExit("generator.ref missing or not a sha")
          if not profile.get("super", {}).get("layout"):
              raise SystemExit("super.layout missing")
          print(f"profile OK id={profile['profile_id']} device={primary} layout={profile['super']['layout']}")
          PY

      - name: "Report validation.completed"
        if: success()
        shell: bash
        run: |
          set +e
          python3 /tmp/dz_emit_callback.py validation.completed validate "Canonical Device Profile validated"
          exit 0

      - name: "Stage publish tree on the runner"
        id: stage
        if: success() && inputs.publish_enabled == 'true'
        env:
          CANONICAL_CALLBACK_PATH: ${{ steps.canonical.outputs.CANONICAL_CALLBACK_PATH }}
          PROFILE_DIR: ${{ steps.analyze.outputs.PROFILE_DIR }}
          DZ_STAGE_ROOT: ${{ steps.workspace.outputs.ROOT }}/stage
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, shutil, sys
          payload = json.load(open(os.environ["CANONICAL_CALLBACK_PATH"], encoding="utf-8"))
          profile = payload["profile"]
          profile_dir = pathlib.Path(os.environ["PROFILE_DIR"])
          device = profile["device"]["primary_codename"]
          stage_root = pathlib.Path(os.environ.get("DZ_STAGE_ROOT", "/tmp/dz_publish_stack"))
          if stage_root.exists():
              shutil.rmtree(stage_root)
          target = stage_root / "profiles" / "super" / device / profile["profile_id"]
          target.mkdir(parents=True, exist_ok=True)
          for rel in profile["artefact_paths"]["files"]:
              src = profile_dir / rel
              dst = target / rel
              if src.is_file():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy(src, dst)
          (target / "GENERATOR_REPOSITORY").write_text(profile["generator"]["repository"] + "\n", encoding="utf-8")
          (target / "GENERATOR_REF").write_text(profile["generator"]["ref"] + "\n", encoding="utf-8")
          (target / "GENERATOR_RESOLVED_SHA").write_text(profile["generator"]["resolved_sha"] + "\n", encoding="utf-8")
          (target / "SCHEMA_VERSION").write_text(profile["schema_version"] + "\n", encoding="utf-8")
          (target / "ARCHIVE_URL").write_text(profile["artefact_paths"]["archive_url"] + "\n", encoding="utf-8")
          (target / "device.profile.json").write_text(json.dumps(profile, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("stage root:", stage_root)
          print("target   :", target)
          PY

      - name: "Publish profile metadata to launcher + Lite + Port"
        id: publish
        if: success() && inputs.publish_enabled == 'true'
        env:
          STAGE_ROOT: ${{ steps.workspace.outputs.ROOT }}/stage
          DZ_PUBLISH_RESULTS: ${{ steps.workspace.outputs.ROOT }}/publish_results.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPER_INSPECTOR_REPOSITORY_TOKEN: ${{ secrets.SUPER_INSPECTOR_REPOSITORY_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ ! -d "$STAGE_ROOT" ]]; then
            echo "::error::no stage root at $STAGE_ROOT"
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile

          stage_root = pathlib.Path(os.environ["STAGE_ROOT"])
          targets = [
              os.environ["DEADZONE_TARGET_REPO"],
              os.environ["DEADZONE_PUBLISH_LITE_REPO"],
              os.environ["DEADZONE_PUBLISH_PORT_REPO"],
          ]
          profile_id = os.environ["DEADZONE_PROFILE_ID"]
          inspector_ref = os.environ["DEADZONE_INSPECTOR_REF"]
          commit_msg = f"super(profile): {profile_id} via {inspector_ref}"
          launcher_repo = os.environ["DEADZONE_TARGET_REPO"]
          launcher = pathlib.Path(os.environ.get("CALLER_REPO_DIR") or os.environ.get("GITHUB_WORKSPACE", "/tmp"))

          results = []
          for repo in targets:
              try:
                  if repo == launcher_repo:
                      for src in stage_root.rglob("*"):
                          if src.is_file():
                              rel = src.relative_to(stage_root)
                              dst = launcher / rel
                              dst.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy(src, dst)
                      subprocess.run(["git", "-C", str(launcher), "config",
                                       "user.name", "deadzone-bot"],
                                      check=True)
                      subprocess.run(["git", "-C", str(launcher), "config",
                                       "user.email", "bot@deadzone.local"],
                                      check=True)
                      subprocess.run(["git", "-C", str(launcher), "add",
                                       "profiles/super"], check=True)
                      diff_proc = subprocess.run(
                          ["git", "-C", str(launcher), "diff",
                           "--cached", "--name-only"],
                          capture_output=True, text=True, check=True)
                      if not diff_proc.stdout.strip():
                          print(f"[{repo}] no changes")
                          results.append({"repo": repo, "pushed": False,
                                           "reason": "no_changes"})
                          continue
                      subprocess.run(["git", "-C", str(launcher), "commit",
                                       "-m", commit_msg], check=True)
                      subprocess.run(["git", "-C", str(launcher), "push"],
                                      check=True)
                      head = subprocess.run(
                          ["git", "-C", str(launcher), "rev-parse", "HEAD"],
                          capture_output=True, text=True, check=True).stdout.strip()
                      results.append({"repo": repo, "pushed": True,
                                       "commitSha": head})
                      continue
                  tmp = tempfile.mkdtemp(prefix="dz_pub_")
                  token = (
                      os.environ.get("SUPER_INSPECTOR_REPOSITORY_TOKEN")
                      or os.environ.get("GITHUB_TOKEN")
                      or os.environ.get("GH_TOKEN")
                      or ""
                  )
                  authed_url = f"https://x-access-token:{token}@github.com/{repo}.git"
                  subprocess.run(
                      ["git", "clone", "--depth=1", "--quiet", authed_url,
                       os.path.join(tmp, "dst")],
                      check=True)
                  dst_dir = pathlib.Path(tmp) / "dst"
                  for src in stage_root.rglob("*"):
                      if src.is_file():
                          rel = src.relative_to(stage_root)
                          dst = dst_dir / rel
                          dst.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy(src, dst)
                  subprocess.run(["git", "-C", str(dst_dir), "config",
                                   "user.name", "deadzone-bot"],
                                  check=True)
                  subprocess.run(["git", "-C", str(dst_dir), "config",
                                   "user.email", "bot@deadzone.local"],
                                  check=True)
                  subprocess.run(["git", "-C", str(dst_dir), "add", "-A"],
                                  check=True)
                  diff_proc = subprocess.run(
                      ["git", "-C", str(dst_dir), "diff",
                       "--cached", "--name-only"],
                      capture_output=True, text=True, check=True)
                  if not diff_proc.stdout.strip():
                      print(f"[{repo}] no changes")
                      results.append({"repo": repo, "pushed": False,
                                       "reason": "no_changes"})
                      continue
                  subprocess.run(["git", "-C", str(dst_dir), "commit",
                                   "-m", commit_msg], check=True)
                  subprocess.run(["git", "-C", str(dst_dir), "push"],
                                  check=True)
                  head = subprocess.run(
                      ["git", "-C", str(dst_dir), "rev-parse", "HEAD"],
                      capture_output=True, text=True, check=True).stdout.strip()
                  results.append({"repo": repo, "pushed": True,
                                   "commitSha": head})
                  shutil.rmtree(tmp, ignore_errors=True)
              except Exception as exc:
                  print(f"[{repo}] publish failed: {exc}", file=sys.stderr)
                  results.append({"repo": repo, "pushed": False,
                                   "reason": str(exc)})

          import json
          with open(os.environ["DZ_PUBLISH_RESULTS"], "w", encoding="utf-8") as fh:
              json.dump(results, fh, indent=2, sort_keys=True)
          for entry in results:
              print(entry)
          PY

      - name: "Report publish.completed / publish.failed (per destination)"
        if: always() && inputs.publish_enabled == 'true'
        shell: bash
        env:
          DZ_PUBLISH_RESULTS: ${{ steps.workspace.outputs.ROOT }}/publish_results.json
        run: |
          set -Eeuo pipefail
          if [[ ! -s "$DZ_PUBLISH_RESULTS" ]]; then
            echo "no publish results file"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, subprocess
          results = json.load(open(os.environ["DZ_PUBLISH_RESULTS"], encoding="utf-8"))
          for entry in results:
              repo = entry["repo"]
              pushed = entry.get("pushed", False)
              payload_type = "publish.completed" if pushed else "publish.failed"
              cmd = [
                  "python3", "/tmp/dz_emit_callback.py",
                  payload_type, "publish",
                  "publish ok" if pushed else (entry.get("reason") or "publish failed"),
                  f"target={repo}",
              ]
              if pushed:
                  sha = entry.get("commitSha") or os.environ.get("GITHUB_SHA", "")
                  if sha:
                      cmd.append(f"commitSha={sha}")
              else:
                  cmd.append(f"error={entry.get('reason') or 'publish failed'}")
              subprocess.run(cmd, check=False)
          PY

      - name: "Report terminal failure (catch-all)"
        if: failure()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.job_id }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" ]]; then
            echo "warning: callback secret not yet loaded; cannot emit terminal analyze.failed"
            exit 0
          fi
          python3 runtime/report_build_event.py failed \
            --project super \
            --message "DeadZone Super Inspector run failed before completion."

      - name: "Report cancellation"
        if: cancelled()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.job_id }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" ]]; then
            echo "warning: callback secret not yet loaded; cannot emit cancellation event"
            exit 0
          fi
          python3 runtime/report_build_event.py cancelled \
            --project super \
            --message "DeadZone Super Inspector run cancelled."

      - name: "Upload job log bundle artifact"
        if: always()
        shell: bash
        run: |
          set -u
          root="${{ steps.workspace.outputs.ROOT }}"
          mezo_out="${root:-}/mezo_output"
          stage="$GITHUB_WORKSPACE/_dz_logs_${DEADZONE_JOB_ID:-nojobid}"
          rm -rf "$stage"
          mkdir -p "$stage"
          echo "ROOT: ${root:-<empty>}"
          echo "STAGE: $stage"
          if [[ -n "${root:-}" && -d "$root/logs" ]]; then
            cp -a "$root/logs/." "$stage/" || true
          fi
          if [[ -d "$mezo_out" ]]; then
            mkdir -p "$stage/mezo_output"
            cp -a "$mezo_out/." "$stage/mezo_output/" || true
          fi
          echo "deadzone_home staging OK at $(date -u +%FT%TZ)" > "$stage/_staging_sentinel.txt"
          find "$stage" -maxdepth 5 -type f | sort || true

      - name: "Upload job log bundle artifact (upload-artifact)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadzone-home-logs-${{ inputs.job_id }}
          path: ${{ github.workspace }}/_dz_logs_${{ inputs.job_id }}
          if-no-files-found: warn

      - name: "Cleanup temporary ROM + logs"
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          root="${{ steps.workspace.outputs.ROOT }}"
          if [[ -n "$root" && -d "$root" ]]; then
            if [[ -d "$root/mezo_output" ]]; then
              tar -C "$root" -czf "$root/logs/mezo_output.tar.gz" mezo_output || true
            fi
            tar -C "$root" -czf "$root/logs/bundle.tar.gz" logs || true
            rm -rf "$root/input" "$root/inspector" "$root/stage" || true
            rm -rf "$root" || true
            echo "cleaned $root"
          fi