name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    name: "YAML + workflow sanity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "🛡️ Validate YAML parses"
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Validating deadzone-stable.yml ==="
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/deadzone-stable.yml'))"
          echo "YAML parses OK"

      - name: "🛡️ Every DeadZone build runs independently"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          base = Path(".github/workflows")
          build_workflows = (
              "deadzone-stable.yml",
              "deadzone-lite.yml",
              "deadzone-ninja.yml",
              "deadzone-fastboot.yml",
              "deadzone-xiaomi-port.yml",
              "deadzone-framework-build.yml",
              "deadzone-toolbox-apk.yml",
              "deadzone-superinspector-publish.yml",
          )
          for name in build_workflows:
              workflow = yaml.safe_load((base / name).read_text(encoding="utf-8"))
              assert isinstance(workflow, dict), f"{name}: invalid workflow YAML"
              assert "concurrency" not in workflow, (
                  f"{name}: workflow concurrency could replace pending builds"
              )
              jobs = workflow.get("jobs", {})
              assert isinstance(jobs, dict) and jobs, f"{name}: no jobs found"
              for job_id, job in jobs.items():
                  assert isinstance(job, dict) and "concurrency" not in job, (
                      f"{name}/{job_id}: job concurrency can serialize or cancel builds"
                  )
              print(f"{name}: independent builds verified")
          print(f"All {len(build_workflows)} build workflows keep queued and active runs independent.")
          PY

      - name: "🛡️ Only workflow_dispatch trigger"
        shell: bash
        run: |
          set -euo pipefail
          # Extract the top-level 'on:' block and check it only has workflow_dispatch
          triggers=$(awk '/^on:/{flag=1;next} /^[a-z]/{flag=0} flag && /^  [a-z_]+:$/' \
              .github/workflows/deadzone-stable.yml \
              | sed 's/:$//' | tr -d ' ')
          for trigger in $triggers; do
              if [[ "$trigger" != "workflow_dispatch" ]]; then
                  echo "::error::deadzone-stable.yml: forbidden trigger '$trigger' (only workflow_dispatch allowed)" >&2
                  exit 1
              fi
          done
          echo "Triggers: OK ($triggers)"

      - name: "🛡️ No approved input"
        shell: bash
        run: |
          set -euo pipefail
          # The approved gate was removed. Verify it does not reappear.
          if grep -qE '^\s+approved:' .github/workflows/deadzone-stable.yml; then
              echo "::error::deadzone-stable.yml: 'approved' input found — dispatch gate was re-added" >&2
              exit 1
          fi
          echo "No approved input: OK"

      - name: "🛡️ No dispatch gate step"
        shell: bash
        run: |
          set -euo pipefail
          # Verify the dispatch gate step was removed.
          if grep -q "Validate dispatch gate" .github/workflows/deadzone-stable.yml; then
              echo "::error::deadzone-stable.yml: 'Validate dispatch gate' step found — gate was re-added" >&2
              exit 1
          fi
          echo "No dispatch gate step: OK"

      - name: "🩺 Verify SuperInspector bridge and legacy Fastboot remain compatible"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import yaml

          base = pathlib.Path(".github/workflows")
          fastboot_text = (base / "deadzone-fastboot.yml").read_text(encoding="utf-8")
          publish_text = (base / "deadzone-superinspector-publish.yml").read_text(encoding="utf-8")
          fastboot = yaml.safe_load(fastboot_text)
          publish = yaml.safe_load(publish_text)
          job = fastboot["jobs"]["build-fastboot-inspector"]
          assert job["runs-on"] == "windows-latest", "Windows Fastboot runner changed"
          steps = job["steps"]
          names = [step.get("name", "") for step in steps]
          assert "🚀 Queue verified Stock publisher in SuperInspector" in names
          assert "🔐 Confirm verified DeadZone-Devices publication" in names
          assert "📤 Publish per-build tree to DeadZone-ROM-Repository" not in names
          assert "📚 Publish central metadata registry entry" not in names
          assert "🗜️ Package artifact" in names
          assert "⬆️ Upload Windows artifact" in names
          assert "📣 Report verified Devices publisher queue to bot" in names
          assert "publish-flash-manifest" not in fastboot_text, "Obsolete publisher restored"
          assert "publish-devices.yml/dispatches" in fastboot_text
          assert '"request_id": os.environ["DEADZONE_REQUEST_ID"]' in fastboot_text
          assert "status=dispatch_failed" in fastboot_text
          assert "Token needs private repo Actions: read/write" in fastboot_text
          assert "steps.stable_published.outputs.status" in fastboot_text
          assert "if [[ \"$conclusion\" == success ]]" in fastboot_text
          assert '"sync_stable"' not in fastboot_text
          assert "publish-central" not in fastboot_text
          assert "publish-rom-repo" not in fastboot_text
          assert "super-inspector" in fastboot_text and "ref: main" in fastboot_text
          pub_job = publish["jobs"]["dispatch"]
          assert pub_job["runs-on"] == "ubuntu-latest"
          assert "workflow_dispatch" in publish_text
          assert "publish-devices.yml/dispatches" in publish_text
          assert "DEADZONE_INSPECTOR_DISPATCH_TOKEN" in publish_text
          assert "GH_TOKEN" in publish_text
          assert '"sync_stable"' not in publish_text
          assert "secrets.DEADZONE_DEVICES_TOKEN" not in publish_text
          assert "secrets.DEADZONE_STABLE_REPO_TOKEN" not in publish_text
          print("Fastboot bot and DeadZone-Devices stock publishing compatibility: OK")
          PY

      - name: "Validate Port workflow runtime contract"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess
          import yaml

          path = pathlib.Path(".github/workflows/deadzone-xiaomi-port.yml")
          job = yaml.safe_load(path.read_text())["jobs"]["build"]
          assert job["timeout-minutes"] == 360
          steps = job["steps"]
          root = 'bash "$RUNNER_TEMP/port-root-env.sh"'
          for command in ("bash build.sh", "bash packROM.sh", "bash bin/port/uploadROM.sh"):
              assert any(root + " " + command in step.get("run", "") for step in steps), command
          for step in steps:
              script = step.get("run", "")
              assert "sudo -E bash" not in script
              if step.get("working-directory") == "toolbuild":
                  assert "python3 runtime/" not in script
              if script and step.get("shell", "bash") != "python":
                  subprocess.run(["bash", "-n"], input=script, text=True, check=True)
          PY
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          export RUNNER_TEMP="$temp_dir"
          python3 - <<'PY'
          import pathlib
          import subprocess
          import yaml
          workflow = yaml.safe_load(pathlib.Path(".github/workflows/deadzone-xiaomi-port.yml").read_text())
          steps = workflow["jobs"]["build"]["steps"]
          setup = [step["run"] for step in steps if step.get("name") == "Prepare privileged Port runtime"]
          assert len(setup) == 1
          subprocess.run(["bash", "-c", setup[0]], check=True)
          PY
          bash -n "$RUNNER_TEMP/port-root-env.sh"
          printf '#!/usr/bin/env bash\nexec /usr/bin/env -i "$@"\n' > "$temp_dir/sudo"
          chmod +x "$temp_dir/sudo"
          PATH="$temp_dir:$PATH" RCLONE_REMOTE_NAME=fixture RCLONE_UPLOAD_DIR='folder with spaces' DEADZONE_CONTROLLED_BUILD=1 DEADZONE_REQUEST_ID=port_xiaomi_12345678 \
            bash "$RUNNER_TEMP/port-root-env.sh" bash -c '[[ "$RCLONE_REMOTE_NAME" == fixture && "$RCLONE_UPLOAD_DIR" == "folder with spaces" && "$DEADZONE_CONTROLLED_BUILD" == 1 && "$DEADZONE_REQUEST_ID" == port_xiaomi_12345678 ]]'

      - name: "Checkout current private Port engine test sources"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          repository: DeadZone-Offical/DeadZone-xiaomi_Port
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          ref: main
          path: port-runtime-test
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /notify.py
            /tests/test_runtime_regressions.py
            /bin/package/RefreshRate/1hz.sh

      - name: "Run Port engine runtime regression tests"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: port-runtime-test
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n bin/package/RefreshRate/1hz.sh
          python3 -m unittest discover -s tests -p test_runtime_regressions.py -v

      - name: "Checkout central signed release reporter"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          repository: DeadZone-Offical/DeadZone-File
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          ref: main
          path: stable-runtime-test
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /report_build_event.py

      - name: "Test verified Stable terminal release contract"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 stable-runtime-test/report_build_event.py --self-test
