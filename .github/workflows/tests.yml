name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    name: "YAML + workflow sanity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "🛡️ Validate YAML parses"
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Validating deadzone-stable.yml ==="
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/deadzone-stable.yml'))"
          echo "YAML parses OK"

      - name: "🛡️ Concurrency per-ref with cancel-in-progress"
        shell: bash
        run: |
          set -euo pipefail
          # The launcher must use per-ref concurrency with cancel-in-progress: true
          # to prevent parallel runs on the same ref from racing on the LVM volume.
          #
          # GitHub Actions substitutes workflow expressions in `run:` blocks
          # BEFORE bash sees the script, so we cannot write the markup
          # directly in a single-quoted string — the substitution would
          # collapse it. We build the expected substring by feeding each
          # piece through printf so no run-time expression is formed.
          expected=$(printf '%s' '$' '{{' ' github.workflow ' '}}' '-' '$' '{{' ' github.ref ' '}}')
          if ! grep -Fq "$expected" .github/workflows/deadzone-stable.yml; then
              echo "::error::deadzone-stable.yml: concurrency group key is not per-ref" >&2
              exit 1
          fi
          if ! grep -q '^  group: deadzone-home-stable-' \
              .github/workflows/deadzone-stable.yml; then
              echo "::error::deadzone-stable.yml: concurrency group key is not under the deadzone-home-stable- namespace" >&2
              exit 1
          fi
          if ! grep -q '^  cancel-in-progress: true' \
              .github/workflows/deadzone-stable.yml; then
              echo "::error::deadzone-stable.yml: concurrency does not have cancel-in-progress: true" >&2
              exit 1
          fi
          echo "Concurrency: OK (per-ref, cancel-in-progress: true)"

      - name: "🛡️ Only workflow_dispatch trigger"
        shell: bash
        run: |
          set -euo pipefail
          # Extract the top-level 'on:' block and check it only has workflow_dispatch
          triggers=$(awk '/^on:/{flag=1;next} /^[a-z]/{flag=0} flag && /^  [a-z_]+:$/' \
              .github/workflows/deadzone-stable.yml \
              | sed 's/:$//' | tr -d ' ')
          for trigger in $triggers; do
              if [[ "$trigger" != "workflow_dispatch" ]]; then
                  echo "::error::deadzone-stable.yml: forbidden trigger '$trigger' (only workflow_dispatch allowed)" >&2
                  exit 1
              fi
          done
          echo "Triggers: OK ($triggers)"

      - name: "🛡️ No approved input"
        shell: bash
        run: |
          set -euo pipefail
          # The approved gate was removed. Verify it does not reappear.
          if grep -qE '^\s+approved:' .github/workflows/deadzone-stable.yml; then
              echo "::error::deadzone-stable.yml: 'approved' input found — dispatch gate was re-added" >&2
              exit 1
          fi
          echo "No approved input: OK"

      - name: "🛡️ No dispatch gate step"
        shell: bash
        run: |
          set -euo pipefail
          # Verify the dispatch gate step was removed.
          if grep -q "Validate dispatch gate" .github/workflows/deadzone-stable.yml; then
              echo "::error::deadzone-stable.yml: 'Validate dispatch gate' step found — gate was re-added" >&2
              exit 1
          fi
          echo "No dispatch gate step: OK"
