# user-repo-toolbuild.yml CI guard
#
# Validates the generic dispatch workflow on every push that touches
# it or any of the per-project reusable workflows it forwards to.
# Fails the build if:
#
#   1. user-repo-toolbuild.yml is no longer parseable YAML
#   2. any of the six project enum options (lite / jesse / port /
#      port_coloros / port_oxygenos / port_realmeui) does not map to
#      a non-empty existing reusable workflow file
#   3. any of those reusable workflow files does not have a
#      `workflow_call` block
#   4. user-repo-toolbuild.yml omits a required input that the
#      matching reusable workflow does declare
#
# The audit is read-only and runs on public-side data only; it does
# not require any GitHub API token. The Python parser uses the
# `yaml` library from PyYAML — pre-installed in
# `actions/setup-python@v5` runners.

name: DeadZone-Home User-Repo Toolbuild CI

on:
  push:
    paths:
      - .github/workflows/user-repo-toolbuild.yml
      - .github/workflows/user-repo-toolbuild-ci.yml
      - .github/workflows/lite-core.yml
      - .github/workflows/jesse-core.yml
      - .github/workflows/port-core.yml
      - .github/workflows/port-coloros.yml
      - .github/workflows/port-oxygenos.yml
      - .github/workflows/port-realmeui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: 🧪 Audit generic dispatch contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🐍 Validate generic dispatch contract
        shell: python
        run: |
          import sys
          import yaml
          from pathlib import Path

          workflows_dir = Path(".github/workflows")
          generic = workflows_dir / "user-repo-toolbuild.yml"
          if not generic.is_file():
              print("::error::user-repo-toolbuild.yml is missing")
              sys.exit(1)

          try:
              d = yaml.safe_load(generic.read_text(encoding="utf-8"))
          except yaml.YAMLError as exc:
              print(f"::error::user-repo-toolbuild.yml is not valid YAML: {exc}")
              sys.exit(1)

          # PyYAML collapses `on:` into the boolean True.
          on_block = d.get("on") or d.get(True) or {}
          dispatch_block = on_block.get("workflow_dispatch") if isinstance(on_block, dict) else None
          if not isinstance(dispatch_block, dict):
              print("::error::user-repo-toolbuild.yml has no workflow_dispatch block")
              sys.exit(1)

          inputs = dispatch_block.get("inputs") or {}
          if not inputs:
              print("::error::user-repo-toolbuild.yml has no workflow_dispatch inputs")
              sys.exit(1)

          for required_name in ("project", "request_id", "callback_url", "builder_id"):
              spec = inputs.get(required_name)
              if spec is None:
                  print(f"::error::user-repo-toolbuild.yml is missing input '{required_name}'")
                  sys.exit(1)
              if not isinstance(spec, dict) or not spec.get("required"):
                  print(f"::error::'{required_name}' input must be required: true")
                  sys.exit(1)

          project_options = inputs["project"].get("options") or []
          project_map = {
              "lite": "lite-core.yml",
              "jesse": "jesse-core.yml",
              "port": "port-core.yml",
              "port_coloros": "port-coloros.yml",
              "port_oxygenos": "port-oxygenos.yml",
              "port_realmeui": "port-realmeui.yml",
          }
          for opt in project_options:
              filename = project_map.get(opt)
              if filename is None:
                  print(f"::error::Project enum option '{opt}' has no mapping to a reusable workflow")
                  sys.exit(1)
              path = workflows_dir / filename
              if not path.is_file():
                  print(f"::error::Project '{opt}' maps to missing workflow '{filename}'")
                  sys.exit(1)
              try:
                  wd = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  print(f"::error::Workflow '{filename}' is not valid YAML: {exc}")
                  sys.exit(1)
              content = path.read_text(encoding="utf-8")
              if "workflow_call:" not in content:
                  print(f"::error::Workflow '{filename}' is referenced by user-repo-toolbuild.yml but has no workflow_call block")
                  sys.exit(1)
              wfc_on = wd.get("on") or wd.get(True) or {}
              wfc_block = wfc_on.get("workflow_call") if isinstance(wfc_on, dict) else None
              if not isinstance(wfc_block, dict):
                  print(f"::error::Workflow '{filename}' has no workflow_call block")
                  sys.exit(1)
              wfc_inputs = wfc_block.get("inputs") or {}
              required_in_reusable = {
                  name for name, spec in wfc_inputs.items()
                  if isinstance(spec, dict) and spec.get("required")
              }
              missing = required_in_reusable - set(inputs.keys())
              if missing:
                  print(f"::error::Workflow '{filename}' requires inputs {sorted(missing)} but user-repo-toolbuild.yml does not declare them")
                  sys.exit(1)
              print(f"  ✓ '{opt}' → '{filename}': {len(wfc_inputs)} inputs, {len(required_in_reusable)} required")

          print("Generic dispatch contract audit: clean.")