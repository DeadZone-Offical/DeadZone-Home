# Safe one-off test of the new Google Drive credentials used for ROM uploads.
# Trigger manually. Uploads a tiny test file and removes it afterward.
name: DeadZone Drive Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify DeadZone Google Drive target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install rclone
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq rclone > /dev/null

      - name: Verify new Google Drive account and upload
        shell: bash
        env:
          DEADZONE_RCLONE_CONFIG_BASE64: ${{ secrets.DEADZONE_RCLONE_CONFIG_BASE64 }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$DEADZONE_RCLONE_CONFIG_BASE64" ]]; then
            echo "::error::Missing DEADZONE_RCLONE_CONFIG_BASE64 Actions secret"
            exit 1
          fi
          umask 077
          temp_dir="$(mktemp -d)"
          config_file="$temp_dir/rclone.conf"
          remote_dir="DeadZoneDrive:DeadZone"
          remote_file=""
          cleanup() {
            if [[ -n "$remote_file" ]]; then
              rclone --config "$config_file" deletefile "$remote_file" > /dev/null 2>&1 || true
            fi
            rm -rf "$temp_dir"
          }
          trap cleanup EXIT

          if ! printf '%s' "$DEADZONE_RCLONE_CONFIG_BASE64" | base64 --decode > "$config_file"; then
            echo "::error::Could not decode the new Rclone credential"
            exit 1
          fi
          chmod 600 "$config_file"
          if ! rclone --config "$config_file" listremotes | grep -Fxq 'DeadZoneDrive:'; then
            echo "::error::The secret does not define DeadZoneDrive"
            exit 1
          fi

          # Require the specific folder created in the NEW Google account.
          # An old-account token must not be mistaken for a successful migration.
          rclone --config "$config_file" lsjson --stat "$remote_dir" > "$temp_dir/folder.json"
          python3 - "$temp_dir/folder.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              folder = json.load(handle)
          expected = "10JPnmpweh7qDNMYRbijnG-uENb3EhQ4r"
          actual = folder.get("ID")
          if not folder.get("IsDir") or actual != expected:
              print("::error::Drive target does not match the verified new DeadZone folder")
              sys.exit(1)
          print("New Google Drive folder identity verified")
          PY

          name="deadzone-actions-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          remote_file="$remote_dir/$name"
          printf 'DeadZone Actions upload test: run %s attempt %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$temp_dir/test.txt"
          rclone --config "$config_file" copyto "$temp_dir/test.txt" "$remote_file" --retries 3
          rclone --config "$config_file" cat "$remote_file" > "$temp_dir/readback.txt"
          if ! cmp -s "$temp_dir/test.txt" "$temp_dir/readback.txt"; then
            echo "::error::Remote readback differs from the uploaded test file"
            exit 1
          fi
          echo "Google Drive upload/readback verified on the NEW account"
          echo "Test object will be deleted during job cleanup"
