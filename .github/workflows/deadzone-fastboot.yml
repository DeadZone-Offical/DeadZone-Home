# DeadZone-Home Fastboot
#
# Independent Telegram-dispatch workflow for the DeadZone Super /
# Fastboot Inspector engine. This file is invoked directly by
# `DeadZone-Offical/DeadZone-Bot` via `workflow_dispatch` whenever a
# user picks "DeadZone-Fastboot". Each dispatch creates its own
# GitHub Actions run; Fastboot is NOT routed through any generic
# dispatcher.
#
# Engine source: DeadZone-Offical/DeadZone-SuperInspector (loaded
# through the central runtime `FASTBOOT_ENGINE_REPOSITORY` key in
# DeadZone-Offical/DeadZone-File/projects.env, never hard-coded).

name: DeadZone-Fastboot

run-name: "🩺 DeadZone-Fastboot · ${{ inputs.request_id }} · ${{ inputs.builder_name || github.actor }}"

concurrency:
  # Per-request concurrency key: two different users can dispatch
  # Fastboot at the same time and they run in parallel. The same user
  # re-pressing Build for the same request_id cancels their previous
  # run, which is the only safe semantic.
  group: deadzone-home-fastboot-${{ inputs.request_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      doctor_ref:
        description: "Fastboot Inspector branch or tag to build"
        required: true
        default: "main"
        type: string
      builder_name:
        description: "👤 Builder name"
        required: false
        type: string
      builder_id:
        description: "💬 Telegram user ID"
        required: false
        type: string
      request_id:
        description: "🆔 DeadZone controlled build request ID"
        required: true
        type: string
      callback_url:
        description: "🔗 Signed DeadZone build-event endpoint"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-fastboot-inspector:
    name: "🛠️ Build Fastboot Inspector"
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
      DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
      DEADZONE_PROJECT: fastboot
      DEADZONE_CONTROLLED_BUILD: "1"
      DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
      DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
      DEADZONE_SOURCE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: "🧾 Validate controlled request"
        shell: python
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          import os
          import re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"].strip()
          if not re.fullmatch(r"fastboot_[A-Za-z0-9]{8,80}", request_id):
              raise SystemExit("Invalid DeadZone request ID")

          for name in ("CALLBACK_URL",):
              value = os.environ[name].strip()
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(f"{name} must be a safe HTTPS URL")

      - name: "🔐 Validate launcher credentials"
        env:
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:DEADZONE_PRIVATE_READ_TOKEN)) {
            Write-Host '::error::Missing required launcher secret: DEADZONE_PRIVATE_READ_TOKEN. Provision a fine-grained PAT with Contents: Read-only on the private engine repos and add it as the DEADZONE_PRIVATE_READ_TOKEN Actions secret on DeadZone-Offical/DeadZone-Home.'
            exit 1
          }

      - name: "📥 Checkout DeadZone launcher"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "📥 Checkout private runtime"
        uses: actions/checkout@v4
        with:
          repository: DeadZone-Offical/DeadZone-File
          ref: main
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            projects.env
            build.env
            load-build.sh
            report_build_event.py
          sparse-checkout-cone-mode: false

      - name: "⚙️ Load central runtime"
        id: runtime
        shell: bash
        env:
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          DEADZONE_CONTROLLED_BUILD: "1"
        run: |
          set -euo pipefail
          for runtime_file in projects.env build.env load-build.sh report_build_event.py; do
            if [[ ! -s "runtime/${runtime_file}" ]]; then
              echo "::error::Central runtime file is missing or empty: ${runtime_file}"
              exit 1
            fi
          done
          chmod 700 runtime/load-build.sh
          python3 -m py_compile runtime/report_build_event.py
          runtime/load-build.sh fastboot

      - name: "✅ Validate loaded runtime"
        shell: bash
        env:
          ENGINE_REPOSITORY: ${{ steps.runtime.outputs.engine_repository }}
        run: |
          set -euo pipefail
          required=(
            ENGINE_REPOSITORY
            DEADZONE_ENGINE_REPOSITORY
            BUILD_PROGRESS_SECRET
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Central runtime value is missing: ${variable_name}"
              exit 1
            fi
          done
          if [[ "$ENGINE_REPOSITORY" != "DeadZone-Offical/DeadZone-SuperInspector" ]]; then
            echo "::error::Unexpected Fastboot engine: $ENGINE_REPOSITORY (expected DeadZone-Offical/DeadZone-SuperInspector)"
            exit 1
          fi
          if [[ "$ENGINE_REPOSITORY" != "$DEADZONE_ENGINE_REPOSITORY" ]]; then
            echo "::error::Runtime engine output does not match the loaded project map"
            exit 1
          fi
          printf '::add-mask::%s\n' "$BUILD_PROGRESS_SECRET"
          printf 'DEADZONE_EVENT_SECRET=%s\n' "$BUILD_PROGRESS_SECRET" >> "$GITHUB_ENV"

      - name: "📥 Checkout Fastboot Inspector"
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.runtime.outputs.engine_repository }}
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          ref: ${{ inputs.doctor_ref || 'main' }}
          path: super-inspector
          fetch-depth: 1
          persist-credentials: false

      - name: "🛠️ Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "📦 Install build dependencies"
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "super-inspector/requirements.txt") {
            python -m pip install -r super-inspector/requirements.txt
          }
          python -m pip install pyinstaller

      - name: "🔍 Validate project structure"
        shell: pwsh
        run: |
          # SuperInspector is a Python package with an entry point; the
          # workflow only requires that the source tree, the build
          # script, and the project metadata are present.
          $required = @(
            "super-inspector/pyproject.toml",
            "super-inspector/deadzone_superinspector",
            "super-inspector/build.sh",
            "super-inspector/scripts"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required project path is missing: $path"
            }
          }

      - name: "🐍 Python syntax check"
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path super-inspector/deadzone_superinspector -Filter *.py | ForEach-Object { $_.FullName }
          if ($files.Count -gt 0) {
            python -m py_compile $files
          }

      - name: "📥 Download official Android Platform Tools"
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "platform-tools-windows.zip"
          $extract = Join-Path $env:RUNNER_TEMP "android-platform-tools"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $source = Join-Path $extract "platform-tools"
          $destination = "super-inspector/tools/platform-tools"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item (Join-Path $source "*") $destination -Recurse -Force

          foreach ($file in @("adb.exe", "fastboot.exe")) {
            $path = Join-Path $destination $file
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing required Platform Tool: $path"
            }
            Get-FileHash $path -Algorithm SHA256
          }

      - name: "🛠️ Build Inspector distribution"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x super-inspector/build.sh ]]; then
            bash super-inspector/build.sh
          else
            echo "::notice::No build.sh on this ref; packaging source distribution only."
          fi

      - name: "🗜️ Package artifact"
        shell: pwsh
        run: |
          $artifact = "super-inspector/dist/DeadZoneFastbootInspector-Windows.zip"
          $distRoot = "super-inspector/dist"
          if (-not (Test-Path $distRoot)) {
            New-Item -ItemType Directory -Path $distRoot -Force | Out-Null
          }
          $items = @()
          if (Test-Path "$distRoot/DeadZoneFastbootInspector.exe") {
            $items += "$distRoot/DeadZoneFastbootInspector.exe"
          } else {
            $items += "super-inspector/deadzone_superinspector"
          }
          if (Test-Path "$distRoot/tools") {
            $items += "$distRoot/tools"
          }
          Compress-Archive -Path $items -DestinationPath $artifact -Force
          if (-not (Test-Path $artifact -PathType Leaf)) {
            throw "Artifact package was not created."
          }

      - name: "⬆️ Upload Windows artifact"
        uses: actions/upload-artifact@v4
        with:
          name: DeadZoneFastbootInspector-Windows
          path: super-inspector/dist/DeadZoneFastbootInspector-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: "❌ Report failed Fastboot build"
        if: failure()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -uo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" ]]; then
            echo '::warning::Terminal Fastboot event cannot be signed because the central event secret is unavailable.' >&2
            exit 0
          fi
          if [[ ! -s runtime/report_build_event.py ]]; then
            echo '::warning::Central runtime report_build_event.py is missing; skipping the terminal failure callback.' >&2
            exit 0
          fi
          python3 runtime/report_build_event.py failed \
            --project fastboot \
            --message "DeadZone Fastboot Inspector build failed." || true

      - name: "🧹 Cleanup Fastboot workspace"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -rf super-inspector runtime 2>/dev/null || true
          echo "Fastboot workspace cleanup complete"

      - name: "📣 Build summary"
        if: always()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
        run: |
          {
            echo "## 🩺 DeadZone-Fastboot build"
            echo
            echo "- Project: \`DeadZone-Fastboot\`"
            echo "- Engine repository: \`DeadZone-Offical/DeadZone-SuperInspector\`"
            echo "- Request ID: \`${DEADZONE_REQUEST_ID}\`"
            echo "- Builder: \`${DEADZONE_BUILDER_NAME:-anonymous}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"