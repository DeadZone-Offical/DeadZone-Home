# DeadZone-Home Fastboot
#
# Independent Telegram-dispatch workflow for the DeadZone Super /
# Fastboot Inspector engine. This file is invoked directly by
# `DeadZone-Offical/DeadZone-Bot` via `workflow_dispatch` whenever a
# user picks "DeadZone-Fastboot". Each dispatch creates its own
# GitHub Actions run; Fastboot is NOT routed through any generic
# dispatcher.
#
# User-facing contract (post Fastboot ROM-URL migration):
#   - input_url      — direct HTTPS ROM download URL (REQUIRED, validated)
#   - builder_name   — display name from Telegram (REQUIRED for the
#                       signed-event correlation)
#   - builder_id     — Telegram numeric user id (REQUIRED)
#   - request_id     — `fastboot_[A-Za-z0-9]{8,80}` correlation id
#                       minted by the bot (REQUIRED)
#   - callback_url   — signed DeadZone build-event endpoint (REQUIRED)
#
# The engine repository stays fixed at
# `DeadZone-Offical/DeadZone-SuperInspector` and is always checked out
# at `main`. No `doctor_ref` is accepted: legacy sessions that try to
# pass one fail closed because the workflow no longer declares that
# input. The user supplies ONE HTTPS ROM URL and the workflow handles
# the rest.

name: DeadZone-Fastboot

run-name: "🩺 DeadZone-Fastboot · ${{ inputs.request_id }} · ${{ inputs.builder_name || github.actor }}"

concurrency:
  # Per-request concurrency key: two different users can dispatch
  # Fastboot at the same time and they run in parallel. The same user
  # re-pressing Build for the same request_id cancels their previous
  # run, which is the only safe semantic.
  group: deadzone-home-fastboot-${{ inputs.request_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "📥 Direct HTTPS ROM download URL (validated server-side)"
        required: true
        type: string
      builder_name:
        description: "👤 Builder name"
        required: true
        type: string
      builder_id:
        description: "💬 Telegram user ID"
        required: true
        type: string
      builder_username:
        description: "🔗 Telegram username (without leading @)"
        required: false
        type: string
      request_id:
        description: "🆔 DeadZone controlled build request ID"
        required: true
        type: string
      callback_url:
        description: "🔗 Signed DeadZone build-event endpoint"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-fastboot-inspector:
    name: "🛠️ Build Fastboot Inspector"
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
      DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
      DEADZONE_PROJECT: fastboot
      DEADZONE_CONTROLLED_BUILD: "1"
      DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
      DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
      DEADZONE_BUILDER_USERNAME: ${{ inputs.builder_username }}
      DEADZONE_SOURCE_REPOSITORY: ${{ github.repository }}
      # The ROM URL is intentionally NOT pushed into the job-level
      # environment; it is only handed to the steps that need it via
      # step-level `env:`, so a stray log of `${{ env.* }}` never
      # reveals the URL.
      DEADZONE_INPUT_URL: ${{ inputs.input_url }}

    steps:
      - name: "🧾 Validate controlled request"
        shell: python
        env:
          INPUT_URL: ${{ inputs.input_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          import os
          import re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"].strip()
          if not re.fullmatch(r"fastboot_[A-Za-z0-9]{8,80}", request_id):
              raise SystemExit("Invalid DeadZone request ID")

          # Strict HTTPS-only validation that mirrors the bot's
          # `validateRomUrl` contract:
          #   - scheme must be exactly `https:`
          #   - hostname must be present and not loopback / RFC1918 / link-local
          #   - no embedded credentials
          #   - no whitespace / control characters
          # This is the final fail-closed boundary; the bot already
          # validates the same shape, so a doubly-bad value never reaches
          # the workflow at all in practice.
          for name in ("INPUT_URL", "CALLBACK_URL"):
              value = os.environ[name].strip()
              if not value:
                  raise SystemExit(f"{name} must not be empty")
              if any(ch.isspace() for ch in value):
                  raise SystemExit(f"{name} must not contain whitespace")
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(f"{name} must be a safe HTTPS URL")
              hostname = parsed.hostname.lower()
              if (
                  hostname == "localhost"
                  or hostname.endswith(".localhost")
                  or hostname == "::1"
                  or hostname.startswith("127.")
                  or hostname.startswith("10.")
                  or hostname.startswith("169.254.")
                  or hostname.startswith("192.168.")
                  or any(hostname.startswith(f"172.{n}.") for n in range(16, 32))
              ):
                  raise SystemExit(f"{name} hostname is not allowed: {hostname}")

      - name: "🔐 Validate launcher credentials"
        env:
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:DEADZONE_PRIVATE_READ_TOKEN)) {
            Write-Host '::error::Missing required launcher secret: DEADZONE_PRIVATE_READ_TOKEN. Provision a fine-grained PAT with Contents: Read-only on the private engine repos and add it as the DEADZONE_PRIVATE_READ_TOKEN Actions secret on DeadZone-Offical/DeadZone-Home.'
            exit 1
          }

      - name: "📥 Checkout DeadZone launcher"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "📥 Checkout private runtime"
        uses: actions/checkout@v4
        with:
          repository: DeadZone-Offical/DeadZone-File
          ref: main
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            projects.env
            build.env
            load-build.sh
            build_stage.py
            report_build_event.py
          sparse-checkout-cone-mode: false

      - name: "⚙️ Load central runtime"
        id: runtime
        shell: bash
        env:
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          DEADZONE_CONTROLLED_BUILD: "1"
        run: |
          set -euo pipefail
          for runtime_file in projects.env build.env load-build.sh build_stage.py report_build_event.py; do
            if [[ ! -s "runtime/${runtime_file}" ]]; then
              echo "::error::Central runtime file is missing or empty: ${runtime_file}"
              exit 1
            fi
          done
          chmod 700 runtime/load-build.sh
          python3 -m py_compile runtime/build_stage.py runtime/report_build_event.py
          runtime/load-build.sh fastboot

      - name: "✅ Validate loaded runtime"
        shell: bash
        env:
          ENGINE_REPOSITORY: ${{ steps.runtime.outputs.engine_repository }}
        run: |
          set -euo pipefail
          required=(
            ENGINE_REPOSITORY
            DEADZONE_ENGINE_REPOSITORY
            BUILD_PROGRESS_SECRET
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Central runtime value is missing: ${variable_name}"
              exit 1
            fi
          done
          if [[ "$ENGINE_REPOSITORY" != "DeadZone-Offical/DeadZone-SuperInspector" ]]; then
            echo "::error::Unexpected Fastboot engine: $ENGINE_REPOSITORY (expected DeadZone-Offical/DeadZone-SuperInspector)"
            exit 1
          fi
          if [[ "$ENGINE_REPOSITORY" != "$DEADZONE_ENGINE_REPOSITORY" ]]; then
            echo "::error::Runtime engine output does not match the loaded project map"
            exit 1
          fi
          printf '::add-mask::%s\n' "$BUILD_PROGRESS_SECRET"
          printf 'DEADZONE_EVENT_SECRET=%s\n' "$BUILD_PROGRESS_SECRET" >> "$GITHUB_ENV"

      - name: "📥 Checkout Fastboot Inspector"
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.runtime.outputs.engine_repository }}
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          # The engine checkout ref is owned by this workflow: the bot
          # does not collect a ref from the user, and no `doctor_ref`
          # input is declared. Always pin to the canonical `main` so
          # builds are reproducible.
          ref: main
          path: super-inspector
          fetch-depth: 1
          persist-credentials: false

      - name: "📥 Download ROM"
        shell: pwsh
        env:
          ROM_URL: ${{ inputs.input_url }}
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "$env:ROM_URL"
          if ([string]::IsNullOrWhiteSpace($url)) {
            throw "ROM_URL is empty"
          }
          $parsed = [System.Uri]::new($url)
          if ($parsed.Scheme -ne 'https') {
            throw "ROM_URL must use https:// (got $($parsed.Scheme))"
          }

          $romDir = Join-Path $PWD 'super-inspector\rom'
          New-Item -ItemType Directory -Path $romDir -Force | Out-Null

          # Derive a safe filename from the URL path. URLs frequently
          # carry signed query parameters that we MUST NOT echo into
          # logs or filenames, so we only consume the last path
          # segment and sanitize it.
          $segment = ($parsed.Segments | Select-Object -Last 1).Trim('/')
          if ([string]::IsNullOrWhiteSpace($segment)) {
            $segment = 'fastboot-rom.bin'
          }
          $safeName = ($segment -replace '[^A-Za-z0-9._-]', '_')
          if ($safeName.Length -gt 96) { $safeName = $safeName.Substring(0, 96) }
          $dest = Join-Path $romDir $safeName

          Write-Host "::notice::Downloading ROM from $($parsed.Host) (length masked)"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $dest -MaximumRedirection 5 -ErrorAction Stop

          if (-not (Test-Path $dest -PathType Leaf)) {
            throw "ROM download did not produce a file at $dest"
          }
          $size = (Get-Item $dest).Length
          if ($size -le 0) {
            throw "Downloaded ROM is empty (0 bytes)"
          }
          Write-Host "::notice::ROM downloaded: $safeName ($size bytes)"

          # Mask the URL anywhere it might appear in subsequent step
          # output, and publish only the on-disk path + a fingerprint
          # the engine can consume.
          Write-Host "::add-mask::$url"
          $sha = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "ROM_PATH=$dest"          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ROM_FILENAME=$safeName"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ROM_SHA256=$sha"         | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ROM_URL=$url"            | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ROM_SIZE=$size"          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "📡 Report starting + downloading to bot"
        if: success()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
          ROM_FILENAME: ${{ env.ROM_FILENAME }}
          ROM_SHA256: ${{ env.ROM_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          python3 runtime/build_stage.py starting \
            --project fastboot \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Runner allocated, fetching engine sources" || true
          # The download step measures the ROM size in bytes, but a
          # percentage requires a total expected size the workflow
          # does not know up front. Emit the stage transition with
          # no percentage so the live panel shows the stage without
          # fabricating one.
          python3 runtime/build_stage.py downloading \
            --project fastboot \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "ROM download finished" || true
          # After the download, the engine has the real file name
          # and sha256. Forward them as device metadata: the live
          # panel renders them as `Device` (filename) and a stage
          # check point the operator can confirm.
          extra_args=()
          if [[ -n "${ROM_FILENAME:-}" ]]; then
            extra_args+=(--device "${ROM_FILENAME}")
          fi
          python3 runtime/build_stage.py reading_rom \
            --project fastboot \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "ROM metadata extracted" \
            "${extra_args[@]}" || true

      - name: "🛠️ Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "📦 Install build dependencies"
        shell: pwsh
        env:
          ROM_PATH: ${{ env.ROM_PATH }}
          ROM_URL: ${{ env.ROM_URL }}
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "super-inspector/requirements.txt") {
            python -m pip install -r super-inspector/requirements.txt
          }
          python -m pip install pyinstaller

      - name: "🔍 Validate project structure"
        shell: pwsh
        env:
          ROM_URL: ${{ env.ROM_URL }}
        run: |
          # SuperInspector is a Python package with an entry point; the
          # workflow only requires that the source tree, the build
          # script, and the project metadata are present.
          $required = @(
            "super-inspector/pyproject.toml",
            "super-inspector/deadzone_superinspector",
            "super-inspector/build.sh",
            "super-inspector/scripts"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required project path is missing: $path"
            }
          }

      - name: "🐍 Python syntax check"
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path super-inspector/deadzone_superinspector -Filter *.py | ForEach-Object { $_.FullName }
          if ($files.Count -gt 0) {
            python -m py_compile $files
          }

      - name: "📥 Download official Android Platform Tools"
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "platform-tools-windows.zip"
          $extract = Join-Path $env:RUNNER_TEMP "android-platform-tools"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $source = Join-Path $extract "platform-tools"
          $destination = "super-inspector/tools/platform-tools"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item (Join-Path $source "*") $destination -Recurse -Force

          foreach ($file in @("adb.exe", "fastboot.exe")) {
            $path = Join-Path $destination $file
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing required Platform Tool: $path"
            }
            Get-FileHash $path -Algorithm SHA256
          }

      - name: "🛠️ Build Inspector distribution"
        shell: bash
        env:
          ROM_PATH: ${{ env.ROM_PATH }}
          ROM_URL: ${{ env.ROM_URL }}
          ROM_SHA256: ${{ env.ROM_SHA256 }}
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -x super-inspector/build.sh ]]; then
            bash super-inspector/build.sh
          else
            echo "::notice::No build.sh on this ref; packaging source distribution only."
          fi
          python3 runtime/build_stage.py building \
            --project fastboot \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Inspector build finished" || true

      - name: "🗜️ Package artifact"
        shell: pwsh
        env:
          ROM_URL: ${{ env.ROM_URL }}
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          $artifact = "super-inspector/dist/DeadZoneFastbootInspector-Windows.zip"
          $distRoot = "super-inspector/dist"
          if (-not (Test-Path $distRoot)) {
            New-Item -ItemType Directory -Path $distRoot -Force | Out-Null
          }
          $items = @()
          if (Test-Path "$distRoot/DeadZoneFastbootInspector.exe") {
            $items += "$distRoot/DeadZoneFastbootInspector.exe"
          } else {
            $items += "super-inspector/deadzone_superinspector"
          }
          if (Test-Path "$distRoot/tools") {
            $items += "$distRoot/tools"
          }
          Compress-Archive -Path $items -DestinationPath $artifact -Force
          if (-not (Test-Path $artifact -PathType Leaf)) {
            throw "Artifact package was not created."
          }
          $artifactSize = (Get-Item $artifact).Length
          $artifactSha = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower()
          # Real SHA-256 + size of the Fastboot Inspector ZIP. The
          # bot's live panel forwards them as the output metadata
          # on the succeeded terminal event when the central
          # reporter reads them from the environment.
          "DEADZONE_RESULT_NAME=DeadZoneFastbootInspector-Windows.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DEADZONE_FILE_SIZE=$artifactSize"                          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DEADZONE_INTEGRITY_SHA256=$artifactSha"                    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "📡 Report packaging completion to bot"
        if: success()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          python3 runtime/build_stage.py packaging \
            --project fastboot \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Inspector packaged" || true

      - name: "⬆️ Upload Windows artifact"
        uses: actions/upload-artifact@v4
        with:
          name: DeadZoneFastbootInspector-Windows
          path: super-inspector/dist/DeadZoneFastbootInspector-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: "✅ Report successful Fastboot build"
        if: success()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -uo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" ]]; then
            echo '::warning::Terminal Fastboot event cannot be signed because the central event secret is unavailable.' >&2
            exit 0
          fi
          if [[ ! -s runtime/report_build_event.py ]]; then
            echo '::warning::Central runtime report_build_event.py is missing; skipping the terminal success callback.' >&2
            exit 0
          fi
          python3 runtime/build_stage.py uploading \
            --project fastboot \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Artifact upload complete" || true
          python3 runtime/report_build_event.py succeeded \
            --project fastboot \
            --message "DeadZone Fastboot Inspector build complete." || true

      - name: "❌ Report failed Fastboot build"
        if: failure()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
          ROM_URL: ${{ env.ROM_URL }}
        run: |
          set -uo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" ]]; then
            echo '::warning::Terminal Fastboot event cannot be signed because the central event secret is unavailable.' >&2
            exit 0
          fi
          if [[ ! -s runtime/report_build_event.py ]]; then
            echo '::warning::Central runtime report_build_event.py is missing; skipping the terminal failure callback.' >&2
            exit 0
          fi
          python3 runtime/report_build_event.py failed \
            --project fastboot \
            --message "DeadZone Fastboot Inspector build failed." || true

      - name: "🧹 Cleanup Fastboot workspace"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -rf super-inspector runtime 2>/dev/null || true
          echo "Fastboot workspace cleanup complete"

      - name: "📣 Build summary"
        if: always()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          ROM_FILENAME: ${{ env.ROM_FILENAME }}
          ROM_SHA256: ${{ env.ROM_SHA256 }}
          ROM_URL: ${{ env.ROM_URL }}
        run: |
          {
            echo "## 🩺 DeadZone-Fastboot build"
            echo
            echo "- Project: \`DeadZone-Fastboot\`"
            echo "- Engine repository: \`DeadZone-Offical/DeadZone-SuperInspector\` (ref: \`main\`)"
            echo "- Request ID: \`${DEADZONE_REQUEST_ID}\`"
            echo "- Builder: \`${DEADZONE_BUILDER_NAME:-anonymous}\`"
            if [[ -n "${ROM_FILENAME:-}" ]]; then
              echo "- ROM: \`${ROM_FILENAME}\` (sha256: \`${ROM_SHA256:-unknown}\`)"
            fi
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"