name: Diagnostic D1 user_flow query

# One-off diagnostic. Run with
# `gh workflow run diag-d1.yml --repo DeadZone-Offical/DeadZone-Home`
# to dump the current state of the production D1 user_flow table
# so the on-call can confirm whether the E2E's `dz:project:fastboot`
# callback actually wrote a flow state row before the URL text
# message arrived.

on:
  workflow_dispatch:

jobs:
  diag:
    name: 🔍 Dump D1 user_flow for the bot worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "🔍 Set up Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "🔍 Checkout DeadZone-Bot (we need its wrangler config)"
        uses: actions/checkout@v4
        with:
          repository: DeadZone-Offical/DeadZone-Bot
          ref: main
          path: bot

      - name: "🔍 Query D1 user_flow + bot_dispatch_log + bot_observability"
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          cd bot/cloudflare
          echo "==> user_flow (top 10 most-recent rows, with state_json truncated to 200 chars)"
          npx wrangler d1 execute deadzone-bot --remote --command \
            "SELECT user_id, substr(state_json, 1, 200) AS state, updated_at FROM user_flow ORDER BY updated_at DESC LIMIT 10" \
            2>&1 | tail -25
          echo
          echo "==> bot_dispatch_log (last 10 rows)"
          npx wrangler d1 execute deadzone-bot --remote --command \
            "SELECT recorded_at, kind, project, request_id, workflow, input_mode, trigger, http_status, error, error_category FROM bot_dispatch_log ORDER BY recorded_at DESC LIMIT 10" \
            2>&1 | tail -25
          echo
          echo "==> bot_observability (single row)"
          npx wrangler d1 execute deadzone-bot --remote --command \
            "SELECT last_kind, last_at, substr(last_payload, 1, 1000) AS payload FROM bot_observability WHERE id = 1" \
            2>&1 | tail -15
