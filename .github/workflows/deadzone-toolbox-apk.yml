# Build the reconstructed Kotlin/Java + Rust Toolbox from its own source.
# The previous C++/legacy-SettingsRepository workflow is not compatible
# with the zero-base Rust reconstruction. No pre-built .so is committed.
#
# Required for private source checkout:
#   DEADZONE_PRIVATE_READ_TOKEN: Contents:read on DeadZone-Toolbox-App
# Native source: DeadZone-Native-Core (C++), access via the same read token
# or an optional DEADZONE_NATIVE_READ_TOKEN restricted to that repository.
# Optional for a V1/V2/V3 signed release (debug APK always uploaded):
#   TOOLBOX_KEYSTORE_BASE64, TOOLBOX_STORE_PASSWORD,
#   TOOLBOX_KEY_ALIAS, TOOLBOX_KEY_PASSWORD
name: DeadZone Toolbox APK

run-name: "DeadZone Toolbox · debug + signed release · main"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadzone-toolbox-apk.yml'

permissions:
  contents: read

concurrency:
  group: deadzone-toolbox-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-toolbox:
    name: "Build reconstructed Toolbox APK"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DZ_APP: ${{ github.workspace }}/toolbox
      DEADZONE_FRAMEWORK_HOME: ${{ github.workspace }}/toolbox/ci/framework
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      NDK_VERSION: '27.0.12077973'
      GRADLE_OPTS: '-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false'
    steps:
      - name: Verify private source credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$READ_TOKEN" ]]; then
            echo "::error::Set DEADZONE_PRIVATE_READ_TOKEN with Contents:read on DeadZone-Toolbox-App."
            exit 1
          fi

      - name: Checkout reconstructed Toolbox main
        uses: actions/checkout@v4
        with:
          repository: DeadZone-Offical/DeadZone-Toolbox-App
          ref: main
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          path: toolbox
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Checkout C++ Native Core (read-only)
        uses: actions/checkout@v4
        with:
          repository: DeadZone-Offical/DeadZone-Native-Core
          ref: main
          token: ${{ secrets.DEADZONE_NATIVE_READ_TOKEN || secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          path: toolbox/DeadZone-Native-Core-cpp
          fetch-depth: 1
          persist-credentials: false

      - name: Verify reconstructed source layout
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          echo "Toolbox source revision: $(git rev-parse HEAD)"
          test -s gradle/wrapper/gradle-wrapper.jar
          unzip -tq gradle/wrapper/gradle-wrapper.jar > /dev/null
          test -s DeadZone-Native-Core/Cargo.toml
          test -s DeadZone-Native-Core/Cargo.lock
          test -s DeadZone-Native-Core/scripts/build_android.sh
          test -s DeadZone-Native-Core-cpp/scripts/build_ndk.sh
          test -s DeadZone-Native-Core-cpp/scripts/verify_apk_bridge.py
          test -s scripts/verify_reconstruction.py
          test -s app/build.gradle.kts
          echo "Native Rust libraries are generated by Gradle/Cargo, not checked out."
          git status --short

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 17 SDK, build tools, and matching NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION" --channel=3
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify current JNI, settings and naming contracts
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_reconstruction.py

      - name: Validate Spoof and reference routes (private source, public runner)
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_spoof_sources.py
          python3 scripts/verify_video_reference.py

      - name: Verify the interactive Home and weather contract
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main")
          manifest = (root / "AndroidManifest.xml").read_text()
          weather = (root / "java/com/deadzone/toolbox/core/HomeWeatherRepository.kt").read_text()
          home = (root / "java/com/deadzone/toolbox/ui/home/HomeScreen.kt").read_text()
          chrome = (root / "java/com/deadzone/toolbox/ui/home/HomeChrome.kt").read_text()
          nav = (root / "java/com/deadzone/toolbox/ui/toolbox/DeadZoneLiquidNavigation.kt").read_text()
          required = {
              "weather package #1": "com.miui.weather2" in manifest,
              "weather package #2": "com.miui.weather" in manifest,
              "Xiaomi local weather provider": "content://weather/actualWeatherData/2" in weather,
              "Xiaomi refresh weather provider": "content://weather/actualWeatherData/1" in weather,
              "DeadZone channel": "https://t.me/xDeadZone" in chrome,
              "DeadZone discussion": "https://t.me/DeadZoneDiscussion" in chrome,
              "GitHub account": "https://github.com/DeadZone-Offical" in chrome,
              "database sync": "DatabaseSyncRepository" in home,
              "privileged reboot action": "HomeInspectionRepository.reboot" in home,
              "one spring indicator": "liquidTabPosition" in nav,
          }
          for name, passed in required.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
          if not all(required.values()):
              raise SystemExit(1)
          PY

      - name: Build C++ Core and validate its JNI symbols
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          bash DeadZone-Native-Core-cpp/scripts/build_ndk.sh
          python3 DeadZone-Native-Core-cpp/scripts/verify_native_coexistence.py
          bash DeadZone-Native-Core-cpp/scripts/run_host_tests.sh

      - name: Run Rust native regression tests
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path DeadZone-Native-Core/Cargo.toml

      - name: Build and test Debug APK (native libraries built from Rust)
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug

      - name: Validate Debug APK and all four Rust ABIs
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK" > /dev/null
          mkdir -p "$GITHUB_WORKSPACE/dist-debug"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            SO="DeadZone-Native-Core/src/main/jniLibs/$abi/libdeadzone_core.so"
            ENTRY="lib/$abi/libdeadzone_core.so"
            test -s "$SO"
            unzip -Z -1 "$APK" | grep -Fxq "$ENTRY"
            expected="$(sha256sum "$SO" | cut -d' ' -f1)"
            actual="$(unzip -p "$APK" "$ENTRY" | sha256sum | cut -d' ' -f1)"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::Native library mismatch for $abi"
              exit 1
            fi
            printf '%s  %s\n' "$actual" "$ENTRY" >> "$GITHUB_WORKSPACE/dist-debug/native-sha256.txt"
          done
          # Both independent native cores must be inside every ABI, not just Rust.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            SO="DeadZone-Native-Core-cpp/dist/lib/$abi/libdeadzone_core_cpp.so"
            ENTRY="lib/$abi/libdeadzone_core_cpp.so"
            test -s "$SO"
            unzip -Z -1 "$APK" | grep -Fxq "$ENTRY"
            expected="$(sha256sum "$SO" | cut -d' ' -f1)"
            actual="$(unzip -p "$APK" "$ENTRY" | sha256sum | cut -d' ' -f1)"
            test "$expected" = "$actual" || {
              echo "::error::C++ native library mismatch for $abi"
              exit 1
            }
          done
          cp "$APK" "$GITHUB_WORKSPACE/dist-debug/DeadZone-Toolbox-debug.apk"
          ( cd "$GITHUB_WORKSPACE/dist-debug" && sha256sum DeadZone-Toolbox-debug.apk > SHA256SUMS.txt )
          echo "### Debug APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "4 Rust + 4 C++ ABIs packaged and checksum-verified. Debug package suffix: .debug" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeadZone-Toolbox-debug-APK
          path: dist-debug/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare optional stable release signing
        id: signing
        working-directory: toolbox
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOOLBOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TOOLBOX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOOLBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOOLBOX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets not all configured; Debug APK is available for testing."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ci-release.jks
          test -s ci-release.jks
          if ! keytool -list -keystore ci-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Release signing keystore, alias or store password is invalid."
            exit 1
          fi
          if ! keytool -certreq -keystore ci-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/deadzone-test.csr" > /dev/null 2>&1; then
            echo "::error::The release private-key password is invalid."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/deadzone-test.csr"
          # Remove example credentials from runner checkout. The true secrets
          # are provided exclusively by ORG_GRADLE_PROJECT_* in the next step.
          sed -i -E '/^(keystoreFile|keystorePassword|keyAlias|keyPassword)=/d' gradle.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build V1/V2/V3 signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: toolbox
        shell: bash
        env:
          ORG_GRADLE_PROJECT_keystoreFile: ci-release.jks
          ORG_GRADLE_PROJECT_keystorePassword: ${{ secrets.TOOLBOX_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.TOOLBOX_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.TOOLBOX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify V1/V2/V3 signatures and Release native libraries
        if: steps.signing.outputs.enabled == 'true'
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist-release"
          REPORT="$GITHUB_WORKSPACE/dist-release/signature-report.txt"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$APK" > "$REPORT"
          for scheme in v1 v2 v3; do
            grep -Eq "^Verified using $scheme scheme .*: true$" "$REPORT" || {
              echo "::error::Missing verified $scheme APK signature"
              exit 1
            }
          done
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            SO="DeadZone-Native-Core/src/main/jniLibs/$abi/libdeadzone_core.so"
            ENTRY="lib/$abi/libdeadzone_core.so"
            test -s "$SO"
            expected="$(sha256sum "$SO" | cut -d' ' -f1)"
            actual="$(unzip -p "$APK" "$ENTRY" | sha256sum | cut -d' ' -f1)"
            test "$expected" = "$actual" || {
              echo "::error::Release APK native library mismatch: $abi"
              exit 1
            }
          done
          # A public runner must never silently ship a release missing C++.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            SO="DeadZone-Native-Core-cpp/dist/lib/$abi/libdeadzone_core_cpp.so"
            ENTRY="lib/$abi/libdeadzone_core_cpp.so"
            unzip -Z -1 "$APK" | grep -Fxq "$ENTRY"
            expected="$(sha256sum "$SO" | cut -d' ' -f1)"
            actual="$(unzip -p "$APK" "$ENTRY" | sha256sum | cut -d' ' -f1)"
            test "$expected" = "$actual" || {
              echo "::error::Release C++ library mismatch for $abi"
              exit 1
            }
          done
          cp "$APK" "$GITHUB_WORKSPACE/dist-release/DeadZone-Toolbox-signed-V1-V2-V3.apk"
          ( cd "$GITHUB_WORKSPACE/dist-release" && sha256sum DeadZone-Toolbox-signed-V1-V2-V3.apk > SHA256SUMS.txt )
          echo "### Signed release ready" >> "$GITHUB_STEP_SUMMARY"
          echo "V1/V2/V3 signatures and 4 Rust + 4 C++ ABIs verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DeadZone-Toolbox-signed-V1-V2-V3
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

      - name: Verify packaged native JNI bridge registrations
        if: steps.signing.outputs.enabled == 'true'
        working-directory: toolbox
        shell: bash
        run: |
          set -euo pipefail
          python3 DeadZone-Native-Core-cpp/scripts/verify_apk_bridge.py             app/build/outputs/apk/release/app-release.apk

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/toolbox/ci-release.jks"
