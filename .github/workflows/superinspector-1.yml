name: DeadZone-Home SuperInspector 1

run-name: "SuperInspector 1 - ${{ inputs.job_id }} - ${{ inputs.profile_id }}"

# DeadZone-Home public dispatcher for Super Inspector (worker 1 of 5).
# Mirrors DeadZone-MEZO/.github/workflows/superinspector-1.yml with
# identical inputs. The reusable workflow that does the real work
# (.github/workflows/superinspector-core.yml) clones the pinned
# DeadZone-SuperInspector engine itself, so the launcher only has to
# forward the user-supplied ROM URL and metadata.

concurrency:
  group: deadzone-home-superinspector-1
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "DeadZone Super Inspector job ID"
        required: true
        type: string
      rom_url:
        description: "HTTP(S) URL of the Xiaomi Fastboot ROM archive"
        required: true
        type: string
      original_filename:
        description: "Original ROM filename (optional)"
        required: false
        type: string
        default: ""
      inspector_ref:
        description: "Pinned DeadZone-SuperInspector commit SHA"
        required: true
        type: string
      target_repo:
        description: "Repository slug that owns this run"
        required: true
        type: string
      profile_id:
        description: "Pre-allocated 16-hex profile ID (idempotency key)"
        required: true
        type: string
      callback_url:
        description: "Signed DeadZone callback URL"
        required: true
        type: string
      max_rom_bytes:
        description: "Hard cap for ROM download"
        required: false
        type: string
        default: "12884901888"

permissions:
  contents: write

jobs:
  superinspector:
    name: "SuperInspector Worker 1"
    uses: ./.github/workflows/superinspector-core.yml
    with:
      job_id: ${{ inputs.job_id }}
      rom_url: ${{ inputs.rom_url }}
      original_filename: ${{ inputs.original_filename }}
      inspector_ref: ${{ inputs.inspector_ref }}
      target_repo: ${{ inputs.target_repo }}
      profile_id: ${{ inputs.profile_id }}
      callback_url: ${{ inputs.callback_url }}
      max_rom_bytes: ${{ inputs.max_rom_bytes }}
    secrets: inherit