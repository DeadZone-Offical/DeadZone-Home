# Public DeadZone-Home launcher; no Stock images or write tokens are stored
# here. The PRIVATE Inspector workflow performs all verified publication
# using DEADZONE_DEVICES_TOKEN to publish to DeadZone-Devices.
# This is additive; the existing Windows Fastboot bot workflow is preserved.
name: DeadZone-SuperInspector · Verified Device Publisher
run-name: "🧩 Inspect Stock · ${{ inputs.os_version }} · ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Fastboot HTTPS archive URL from Xiaomi or direct mirror"
        required: true
        type: string
      os_version:
        description: "Optional OS generation assertion"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - OS1
          - OS2
          - OS3
          - OS4
      build_id:
        description: "Optional official Stock build ID override"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Validate only; no Stable write"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# No concurrency group: every Inspector dispatch is preserved.

jobs:
  dispatch:
    name: Queue private Inspector validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROM_URL: ${{ inputs.rom_url }}
      OS_VERSION: ${{ inputs.os_version }}
      BUILD_ID: ${{ inputs.build_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      INSPECTOR_DISPATCH_TOKEN: ${{ secrets.DEADZONE_INSPECTOR_DISPATCH_TOKEN || secrets.GH_TOKEN }}
    steps:
      - name: Validate public HTTPS Fastboot source and Inspector dispatch credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${INSPECTOR_DISPATCH_TOKEN:-}" ]] || {
            echo "::error::Configure DEADZONE_INSPECTOR_DISPATCH_TOKEN in DeadZone-Home with Actions: read/write on private DeadZone-SuperInspector."
            exit 2
          }
          python3 - <<'PY'
          import os
          import ipaddress
          import re
          from pathlib import PurePosixPath
          from urllib.parse import unquote, urlsplit
          u = urlsplit(os.environ["ROM_URL"])
          host = (u.hostname or "").lower().rstrip(".")
          name = PurePosixPath(unquote(u.path)).name
          forbidden = (".local", ".localhost", ".lan", ".internal", ".onion", ".invalid", ".test", ".example")
          if (u.scheme != "https" or not host or u.username or u.password or u.fragment
                  or u.port not in (None, 443)
                  or "." not in host or host == "localhost"
                  or any(host.endswith(x) for x in forbidden)
                  or not all(re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", x)
                             for x in host.split("."))
                  or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name)
                  or not name.lower().endswith((".tgz", ".tar.gz", ".tar", ".zip"))):
              raise SystemExit("Expected direct public HTTPS Fastboot archive URL")
          try:
              ip = ipaddress.ip_address(host)
          except ValueError:
              pass
          else:
              if not ip.is_global:
                  raise SystemExit("Private/reserved download IP forbidden")
          PY

      - name: Dispatch the existing verified SuperInspector publisher on main
        shell: bash
        run: |
          set -euo pipefail
          # Only dispatch. The PRIVATE workflow independently checks archive metadata,
          # Fastboot targets, format, physical LP Super size and repository rights.
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "ref": "main",
            "inputs": {
              "rom_url": os.environ["ROM_URL"],
              "os_version": os.environ["OS_VERSION"],
              "build_id": os.environ["BUILD_ID"],
              "dry_run": os.environ["DRY_RUN"].lower()
            }
          }))
          PY
          )"
          status="$(curl --silent --show-error --max-time 35 \
            --request POST \
            --output "$RUNNER_TEMP/inspector-dispatch-response.json" \
            --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $INSPECTOR_DISPATCH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            'https://api.github.com/repos/DeadZone-Offical/DeadZone-SuperInspector/actions/workflows/publish-devices.yml/dispatches')" || status="000"
          [[ "$status" == "204" ]] || {
            echo "::error::Inspector workflow dispatch failed (HTTP $status). Verify the Home token has Actions: read/write on the private Inspector repo."
            exit 2
          }
          echo "Verified SuperInspector publisher queued successfully."
          {
            echo '### Verified SuperInspector publisher queued'
            echo ''
            echo '- Private worker: DeadZone-Offical/DeadZone-SuperInspector'
            echo '- Workflow: publish-devices.yml on main'
            echo "- Dry run: $DRY_RUN"
            echo '- 204 only means queued, **not** that validation/publication has succeeded.'
            echo '- View results: https://github.com/DeadZone-Offical/DeadZone-SuperInspector/actions/workflows/publish-devices.yml'
          } >> "$GITHUB_STEP_SUMMARY"
