name: DeadZone Lite

run-name: ⚡ DeadZone Lite · ${{ inputs.request_id }} · ${{ inputs.builder_name || github.actor }}

# Adapted from DeadZone-MEZO/.github/workflows/build.yml (the MEZO-Lite
# public dispatcher) and DeadZone-MEZO/.github/workflows/lite-core.yml
# (the controlled reusable workflow).
#
# The DeadZone-MEZO source uses an in-repo reusable workflow:
#   uses: ./.github/workflows/lite-core.yml
# Under the new DeadZone-Offical account the Lite engine lives in its
# own private repository (DeadZone-Offical/DeadZone-xiaomi_Lite) and
# exposes a dispatchable workflow at .github/workflows/build.yml rather
# than a workflow_call-reusable one. Cross-repo `uses:` requires the
# target workflow to expose `workflow_call`, so this dispatcher
# preserves the MEZO public input surface and concurrency model but
# invokes the engine across repositories via the GitHub CLI, on the
# `main` branch, with the GH_TOKEN secret authorized for the new
# DeadZone-Offical account.
concurrency:
  group: deadzone-lite-build-queue
  queue: max

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 📥 ROM download URL
        required: true
        type: string
      builder_name:
        description: 👤 Builder name
        required: false
        type: string
      builder_id:
        description: 💬 Telegram user ID
        required: false
        type: string
      request_id:
        description: 🆔 DeadZone controlled build request ID
        required: false
        type: string
      callback_url:
        description: 🔗 Signed DeadZone build-event endpoint
        required: false
        type: string

# Minimum permissions for the dispatcher itself. The engine workflow
# runs in its own repository under its own permissions and uses
# its own secrets (TELEGRAM_BOT_TOKEN, GH_TOKEN, GH_REPO,
# RCLONE_TOKEN_PATH, etc.). The `actions: write` scope is required
# only on the dispatcher to fire a cross-repo `workflow_dispatch`
# via the GitHub CLI.
permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: 🧾 Validate Lite dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🧾 Validate Lite dispatch inputs
        shell: python
        env:
          INPUT_URL: ${{ inputs.input_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          import os
          import re
          from urllib.parse import urlparse

          input_url = os.environ["INPUT_URL"].strip()
          if not input_url:
              raise SystemExit("INPUT_URL is required")

          parsed = urlparse(input_url)
          if (
              parsed.scheme not in {"http", "https"}
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or len(input_url) > 2048
          ):
              raise SystemExit("INPUT_URL must be a safe HTTP(S) URL")

          request_id = os.environ.get("REQUEST_ID", "").strip()
          callback_url = os.environ.get("CALLBACK_URL", "").strip()
          if bool(request_id) != bool(callback_url):
              raise SystemExit(
                  "REQUEST_ID and CALLBACK_URL must be provided together"
              )
          if request_id and not re.fullmatch(
              r"lite_[A-Za-z0-9]{8,80}", request_id
          ):
              raise SystemExit("Invalid DeadZone Lite request ID")
          if callback_url:
              parsed = urlparse(callback_url)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username
                  or parsed.password
              ):
                  raise SystemExit("CALLBACK_URL must be a safe HTTPS URL")

          print("Lite dispatch inputs validated.")

  build:
    name: ⚡ Trigger DeadZone Lite engine
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LITE_ENGINE_REPOSITORY: DeadZone-Offical/DeadZone-xiaomi_Lite
      LITE_ENGINE_WORKFLOW: build.yml
      LITE_ENGINE_REF: main
      HOME_REPOSITORY: DeadZone-Offical/DeadZone-Home
    steps:
      - name: 🔐 Validate launcher credential
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "::error::Missing GH_TOKEN secret in DeadZone-Home."
            exit 1
          }

      - name: 📤 Dispatch Lite engine workflow
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LITE_ENGINE_REPOSITORY: ${{ env.LITE_ENGINE_REPOSITORY }}
          LITE_ENGINE_WORKFLOW: ${{ env.LITE_ENGINE_WORKFLOW }}
          LITE_ENGINE_REF: ${{ env.LITE_ENGINE_REF }}
          INPUT_URL: ${{ inputs.input_url }}
          BUILDER_NAME: ${{ inputs.builder_name }}
          BUILDER_ID: ${{ inputs.builder_id }}
        run: |
          set -Eeuo pipefail
          args=(
            workflow run "${LITE_ENGINE_WORKFLOW}"
            --repo "${LITE_ENGINE_REPOSITORY}"
            --ref "${LITE_ENGINE_REF}"
            --field "input_url=${INPUT_URL}"
          )
          if [[ -n "${BUILDER_NAME}" ]]; then
            args+=(--field "builder_name=${BUILDER_NAME}")
          fi
          if [[ -n "${BUILDER_ID}" ]]; then
            args+=(--field "builder_id=${BUILDER_ID}")
          fi
          echo "Dispatching Lite engine workflow:"
          printf '  gh %s\n' "${args[*]}"
          gh "${args[@]}"
          echo "✅ Lite engine dispatch submitted."

      - name: 📣 Deployment summary
        if: always()
        run: |
          {
            echo '## ⚡ DeadZone Lite dispatched'
            echo
            echo "- Dispatcher: ${HOME_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Engine: \`${LITE_ENGINE_REPOSITORY}\` @ \`${LITE_ENGINE_REF}\`"
            echo "- Workflow: \`${LITE_ENGINE_WORKFLOW}\`"
            echo "- Builder: ${BUILDER_NAME:-${GITHUB_ACTOR}}"
            [[ -n "${REQUEST_ID:-}" ]] && echo "- Request ID: \`${REQUEST_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          HOME_REPOSITORY: ${{ env.HOME_REPOSITORY }}
          LITE_ENGINE_REPOSITORY: ${{ env.LITE_ENGINE_REPOSITORY }}
          LITE_ENGINE_REF: ${{ env.LITE_ENGINE_REF }}
          LITE_ENGINE_WORKFLOW: ${{ env.LITE_ENGINE_WORKFLOW }}
          BUILDER_NAME: ${{ inputs.builder_name }}
          REQUEST_ID: ${{ inputs.request_id }}