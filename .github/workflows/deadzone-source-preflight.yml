# DeadZone centralized CI for private source repositories.
# All GitHub Actions workflows live in DeadZone-Home only.
# Required Home secret: DEADZONE_PRIVATE_READ_TOKEN with read-only Contents
# permission on the unified DeadZone repository.
#
# No private source, test logs, or build outputs are published from this
# public repository. Production ROM flashing is intentionally excluded.
name: DeadZone Private Source Preflight

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadzone-source-preflight.yml'

permissions:
  contents: read

concurrency:
  group: deadzone-private-source-preflight
  cancel-in-progress: true

jobs:
  source-validation:
    name: Private Source Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require read-only access to private DeadZone repos
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
        run: |
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::Set DEADZONE_PRIVATE_READ_TOKEN in DeadZone-Home with Contents:read on the private DeadZone repository." >&2
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/DeadZone-Offical/DeadZone')"
          if [[ "$status" != "200" ]]; then
            echo "::error::The configured token cannot read DeadZone-Offical/DeadZone (HTTP $status). Grant this private repository Contents:read in the fine-grained token's repository selection." >&2
            exit 1
          fi

      - name: Checkout unified private DeadZone main
        uses: actions/checkout@v4
        with:
          repository: DeadZone-Offical/DeadZone
          ref: main
          path: deadzone
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Java for the DeadZone framework
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate DeadZone Android 17 profile and injector
        working-directory: deadzone/DeadZone-OS-Patches
        shell: bash
        run: |
          set -euo pipefail
          # Keep private test output on the runner. Publish only failure
          # identifiers, never source snippets or sensitive local data.
          if ! python3 -m unittest discover -s injector -p 'test_*.py' -v > "$RUNNER_TEMP/deadzone-os-tests.log" 2>&1; then
            grep -E '^(FAIL|ERROR): test_[a-zA-Z0-9_]+' "$RUNNER_TEMP/deadzone-os-tests.log" |
              sed -E 's/^(FAIL|ERROR): (test_[^ ]+).*/\1: \2/' || true
            echo "::error::DeadZone injector regression tests failed." >&2
            exit 1
          fi
          if [[ -d tests ]] && ! python3 -m unittest discover -s tests -p 'test_*.py' -v > "$RUNNER_TEMP/deadzone-secondary-tests.log" 2>&1; then
            grep -E '^(FAIL|ERROR): test_[a-zA-Z0-9_]+' "$RUNNER_TEMP/deadzone-secondary-tests.log" |
              sed -E 's/^(FAIL|ERROR): (test_[^ ]+).*/\1: \2/' || true
            echo "::error::DeadZone OS supplemental regression tests failed." >&2
            exit 1
          fi
          python3 -m py_compile scripts/audit_a17_hook_callsites.py scripts/verify_android_class_replacement.py scripts/gate_mya17_runtime_evidence.py scripts/build_mya17_rom_test.py scripts/audit_framework_overlay.py scripts/dex_instruction_walk.py scripts/audit_mya17_stock_pair.py scripts/audit_mya17_stock2_oem.py scripts/audit_mya17_build_fields.py scripts/audit_oem_runtime_owner.py scripts/stage_mya17_runtime_owner.py scripts/stage_mya17_legacy_call.py scripts/verify_mya17_runtime_upgrade.py
          python3 scripts/rom_profile.py check a17-zircon > "$RUNNER_TEMP/deadzone-profile.log" 2>&1
          sh -n module/customize.sh
          sh -n module/service.sh
          sh -n module/post-fs-data.sh
          echo "DeadZone OS Patches: preflight passed."

      - name: Verify DeadZone framework decoder and Java compilation
        working-directory: deadzone/DeadZone-Framework-Hooks
        shell: bash
        run: |
          set -euo pipefail
          if bash scripts/verify_strings.sh > "$RUNNER_TEMP/deadzone-string-gate.log" 2>&1 &&
             python3 scripts/compile_check.py > "$RUNNER_TEMP/deadzone-framework-compile.log" 2>&1; then
            echo "DeadZone Framework Hooks: decoder self-test and compile passed."
          else
            echo "::error::DeadZone Framework Hooks validation failed; inspect the private repository locally. Detailed private test logs were not published." >&2
            exit 1
          fi

      - name: Remove private checkout and temporary logs
        if: always()
        shell: bash
        run: |
          rm -rf deadzone
          rm -f "$RUNNER_TEMP"/deadzone-*.log
