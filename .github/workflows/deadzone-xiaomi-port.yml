# DeadZone-Home Port (Xiaomi)
#
# Independent Telegram-dispatch workflow for the Xiaomi Port engine.
# This file is invoked directly by `DeadZone-Offical/DeadZone-Bot` via
# `workflow_dispatch` whenever a user picks "DeadZone-Xiaomi-Port".
# Each dispatch creates its own GitHub Actions run; this project is NOT
# routed through any generic dispatcher.

name: DeadZone-Xiaomi-Port

run-name: "🔂 DeadZone-Xiaomi-Port · ${{ inputs.request_id }} · ${{ inputs.builder_name || github.actor }}"

concurrency:
  group: deadzone-home-port-xiaomi-${{ inputs.request_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: "Stock ROM HTTPS URL"
        required: true
        type: string
      port_rom_url:
        description: "Port ROM HTTPS URL"
        required: true
        type: string
      builder_name:
        description: "Telegram builder name"
        required: false
        type: string
      builder_id:
        description: "Telegram builder ID"
        required: true
        type: string
      builder_username:
        description: "🔗 Telegram username (without leading @)"
        required: false
        type: string
      request_id:
        description: "DeadZone Port build request ID"
        required: true
        type: string
      callback_url:
        description: "Signed DeadZone build-event endpoint"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: "🔂 Build DeadZone Xiaomi Port"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
      DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
      DEADZONE_PROJECT: port_xiaomi
      DEADZONE_CONTROLLED_BUILD: "1"
      DEADZONE_STOCK_ROM_URL: ${{ inputs.stock_rom_url }}
      DEADZONE_PORT_ROM_URL: ${{ inputs.port_rom_url }}
      DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
      DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
      DEADZONE_BUILDER_USERNAME: ${{ inputs.builder_username }}
      DEADZONE_SOURCE_REPOSITORY: ${{ github.repository }}
      DEADZONE_ENABLE_SECONDARY_MIRRORS: "0"

    steps:
      - name: "🔐 Validate Port request"
        shell: python
        env:
          STOCK_ROM_URL: ${{ inputs.stock_rom_url }}
          PORT_ROM_URL: ${{ inputs.port_rom_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          import os
          import re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"].strip()
          if not re.fullmatch(r"port_xiaomi_[A-Za-z0-9]{8,80}", request_id):
              raise SystemExit("Invalid DeadZone Port request ID")

          for name in ("STOCK_ROM_URL", "PORT_ROM_URL", "CALLBACK_URL"):
              value = os.environ[name].strip()
              parsed = urlparse(value)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username
                  or parsed.password
                  or len(value) > 2048
              ):
                  raise SystemExit(f"{name} must be a safe HTTPS URL")

      - name: "🔐 Validate launcher credentials"
        env:
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DEADZONE_PRIVATE_READ_TOKEN:-}" ]]; then
            echo "::error::Missing required launcher secret: DEADZONE_PRIVATE_READ_TOKEN. Provision a fine-grained PAT with Contents: Read-only on the private engine repos and add it as the DEADZONE_PRIVATE_READ_TOKEN Actions secret on DeadZone-Offical/DeadZone-Home." >&2
            exit 1
          fi

      - name: "📥 Checkout DeadZone launcher"
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "🔐 Load DeadZone central runtime"
        uses: actions/checkout@v5
        with:
          repository: DeadZone-Offical/DeadZone-File
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          ref: main
          path: runtime
          fetch-depth: 1
          persist-credentials: false

      - name: "🔑 Import Port runtime"
        id: central
        shell: bash
        env:
          DEADZONE_PRIVATE_READ_TOKEN: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
        run: bash runtime/load-build.sh port_xiaomi

      - name: "🛡️ Validate Port engine runtime"
        shell: bash
        run: |
          set -Eeuo pipefail
          # The fallback-mirror path is only usable when the central runtime
          # actually shipped its uploader. Validate the file up front so a
          # missing mirror is a clear configuration error rather than a late
          # "No such file" in the middle of the upload step.
          for runtime_file in build_stage.py upload-mirrors.sh; do
            [[ -s "runtime/${runtime_file}" ]] || {
              echo "::error::Central runtime file is missing or empty: ${runtime_file}"
              echo "::error::The Port fallback mirror cannot run without it. Re-run after DeadZone-File@main provides it."
              exit 1
            }
          done
          required=(
            DEADZONE_ENGINE_REPOSITORY
            RCLONE_REMOTE_NAME
            RCLONE_UPLOAD_DIR
            BUILD_PROGRESS_SECRET
          )
          for variable_name in "${required[@]}"; do
            [[ -n "${!variable_name:-}" ]] || {
              echo "::error::Missing runtime value: $variable_name"
              exit 1
            }
          done
          [[ "$DEADZONE_ENGINE_REPOSITORY" == "DeadZone-Offical/DeadZone-xiaomi_Port" ]] || {
            echo "::error::Unexpected Port engine: $DEADZONE_ENGINE_REPOSITORY"
            exit 1
          }
          echo "::add-mask::$BUILD_PROGRESS_SECRET"
          echo "DEADZONE_EVENT_SECRET=$BUILD_PROGRESS_SECRET" >> "$GITHUB_ENV"

      - name: "💾 Maximize build space"
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          build-mount-path: ${{ github.workspace }}/toolbuild
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: "📥 Checkout private Port engine"
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.central.outputs.engine_repository }}
          token: ${{ secrets.DEADZONE_PRIVATE_READ_TOKEN }}
          ref: main
          path: toolbuild
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: "📡 Report queued Port build"
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          python3 notify.py start "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_STOCK_ROM_URL" "port" "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"

      - name: "📡 Report starting stage to bot"
        if: success()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -euo pipefail
          python3 runtime/build_stage.py starting \
            --project port_xiaomi \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Runner allocated, fetching engine sources" || true

      - name: "🕒 Set Cairo timezone"
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: "☕ Prepare Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: "🧰 Install Port dependencies"
        working-directory: toolbuild
        run: |
          set -Eeuo pipefail
          sudo bash -Ee -o pipefail setup.sh

      - name: "🔧 Give Port tools permission"
        working-directory: toolbuild
        run: sudo chmod 777 -R *

      - name: "☁️ Install central Rclone configuration"
        working-directory: toolbuild
        run: |
          set -Eeuo pipefail
          source_file="$GITHUB_WORKSPACE/runtime/rclone.conf"
          target_file="$PWD/rclone.conf"
          [[ -s "$source_file" ]] || {
            echo "::error::Central rclone config missing or empty: $source_file"
            exit 1
          }
          install -m 600 "$source_file" "$target_file"
          if ! rclone --config="$target_file" listremotes | sed 's/:$//' | grep -Fxq "$RCLONE_REMOTE_NAME"; then
            echo "::error::Central rclone.conf does not define expected remote: ${RCLONE_REMOTE_NAME}"
            exit 1
          fi
          rclone version

      - name: "🔂 Build Stock + Port ROM"
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          set -Eeuo pipefail
          sudo -E bash build.sh \
            "$DEADZONE_STOCK_ROM_URL" \
            "$DEADZONE_PORT_ROM_URL" \
            "$DEADZONE_SOURCE_REPOSITORY" \
            port \
            "$DEADZONE_BUILDER_NAME" \
            "$DEADZONE_BUILDER_ID" \
            2>&1 | tee build_action.log

      - name: "📡 Report per-ROM stage progress to bot"
        if: success()
        working-directory: toolbuild
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -euo pipefail
          # The Xiaomi Port engine's build.sh is opaque to the
          # workflow layer, so we cannot emit a real per-ROM
          # progress number. We emit stage transitions with no
          # percentage so the live panel still surfaces them
          # without a fake percent.
          python3 runtime/build_stage.py downloading_stock \
            --project port_xiaomi \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Stock ROM download finished" || true
          python3 runtime/build_stage.py downloading_port \
            --project port_xiaomi \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Port ROM download finished" || true
          python3 runtime/build_stage.py building_stock \
            --project port_xiaomi \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Stock engine build finished" || true
          python3 runtime/build_stage.py building_port \
            --project port_xiaomi \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Port engine build finished" || true
          # Port dual identity: the engine writes the sanitized
          # stock + port device codenames and base ROM versions
          # into `bin/port/`. We forward each non-empty value as
          # its own `--stock-*` / `--port-*` flag so the bot's
          # live panel can render the two framed sub-sections
          # (Stock info / Port info). Missing files produce
          # fabricated "Unknown" placeholders if the workflow
          # would echo them; the empty-array check below ensures
          # we only forward what the engine actually emitted.
          stock_args=()
          port_args=()
          if [[ -s bin/port/stock_device_f.txt ]]; then
            stock_device_codename="$(tr '[:lower:]' '[:upper:]' < bin/port/stock_device_f.txt | sed 's/ /_/g' | tr -cd 'A-Za-z0-9._+-')"
            [[ -n "$stock_device_codename" ]] && stock_args+=(--stock-device-name "$stock_device_codename")
          fi
          if [[ -s bin/port/stock_base_rom_code.txt ]]; then
            stock_rom_version="$(tr -d '\r\n' < bin/port/stock_base_rom_code.txt)"
            [[ -n "$stock_rom_version" ]] && stock_args+=(--stock-rom-version "$stock_rom_version")
          fi
          if [[ -s bin/port/port_device_f.txt ]]; then
            port_device_codename="$(tr '[:lower:]' '[:upper:]' < bin/port/port_device_f.txt | sed 's/ /_/g' | tr -cd 'A-Za-z0-9._+-')"
            [[ -n "$port_device_codename" ]] && port_args+=(--port-device-name "$port_device_codename")
          fi
          if [[ -s bin/port/port_base_rom_code.txt ]]; then
            port_rom_version="$(tr -d '\r\n' < bin/port/port_base_rom_code.txt)"
            [[ -n "$port_rom_version" ]] && port_args+=(--port-rom-version "$port_rom_version")
          fi
          if (( ${#stock_args[@]} + ${#port_args[@]} > 0 )); then
            python3 runtime/build_stage.py reading_rom \
              --project port_xiaomi \
              --request-id "$DEADZONE_REQUEST_ID" \
              --message "Port dual identity captured" \
              "${stock_args[@]}" "${port_args[@]}" || true
          fi

      - name: "📦 Pack Port ROM"
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          set -Eeuo pipefail
          python3 notify.py pack "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_STOCK_ROM_URL" "port" "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"
          sudo -E bash packROM.sh 2>&1 | tee -a build_action.log

      - name: "📡 Report packaging completion to bot"
        if: success()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
          DEADZONE_EVENT_SECRET: ${{ env.DEADZONE_EVENT_SECRET }}
        run: |
          set -euo pipefail
          python3 runtime/build_stage.py packaging \
            --project port_xiaomi \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Port Super packed" || true

      - name: "🗜️ Package and upload Google Drive"
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          set -Eeuo pipefail
          # notify.py is a best-effort Telegram notifier. The engine already
          # swallows its own delivery errors and returns 0, but if the file is
          # missing or Python is unhappy a notification failure must not abort
          # a build that is about to publish a finished artifact.
          python3 notify.py upload "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_STOCK_ROM_URL" "port" "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID" || \
            echo "::warning::Upload notification could not be delivered; continuing with the upload."
          set +e
          sudo -E bash bin/port/uploadROM.sh 2>&1 | tee -a build_action.log
          google_status=${PIPESTATUS[0]}
          set -e
          printf 'DEADZONE_GOOGLE_UPLOAD_STATUS=%s\n' "$google_status" >> "$GITHUB_ENV"

          mapfile -t final_zips < <(find "$PWD/out" -maxdepth 1 -type f -name 'DeadZone_Port_*.zip' -print 2>/dev/null)
          if (( ${#final_zips[@]} != 1 )); then
            echo "::error::Expected exactly one preserved final Port ZIP; found ${#final_zips[@]}" | tee -a build_action.log
            exit 1
          fi

          final_zip="${final_zips[0]}"
          final_name="$(basename "$final_zip")"
          # Real SHA-256 of the preserved final ZIP. The bot's live
          # panel renders it as the `checksum` field on the
          # succeeded terminal event when the central reporter
          # reads it from DEADZONE_INTEGRITY_SHA256.
          final_sha256="$(sha256sum "$final_zip" | awk '{print $1}')"
          final_size_bytes="$(stat -c '%s' "$final_zip")"
          printf 'DEADZONE_RESULT_NAME=%s\nDEADZONE_FILE_SIZE=%s\nDEADZONE_INTEGRITY_SHA256=%s\n' \
            "$final_name" "$final_size_bytes" "$final_sha256" >> "$GITHUB_ENV"

          # `$GITHUB_ENV` is applied to *subsequent* steps only, so re-reading
          # `DEADZONE_GOOGLE_UPLOAD_STATUS` here always returned empty and fell
          # through to the failure default. That is what failed run 37216287331:
          # the engine had already reported "Google Drive upload completed", and
          # this branch then discarded that success. Trust the PIPESTATUS capture
          # taken above and keep the env read only as a fallback.
          google_status="${google_status:-${DEADZONE_GOOGLE_UPLOAD_STATUS:-1}}"

          # Drive coordinates, resolved on both paths: the mirror call below runs
          # whether or not Drive succeeded, so these must never be left unbound
          # under `set -u`.
          codename=""
          os_folder=""
          for candidate in \
            "$PWD/build/.port_state/stock/ddevice/device_f.txt" \
            "$PWD/bin/port/stock_device_f.txt"; do
            if [[ -s "$candidate" ]]; then
              codename="$(tr '[:lower:]' '[:upper:]' < "$candidate" | sed 's/ /_/g' | tr -cd 'A-Za-z0-9._+-')"
              [[ -n "$codename" ]] && break
            fi
          done
          for candidate in \
            "$PWD/build/.port_state/port/ddevice/base_rom_code.txt" \
            "$PWD/bin/port/port_base_rom_code.txt"; do
            if [[ -s "$candidate" ]]; then
              rom_version="$(tr -d '\r\n' < "$candidate")"
              if [[ "$rom_version" =~ ^(OS[0-9]+) ]]; then
                os_folder="${BASH_REMATCH[1]}"
              elif [[ "$rom_version" =~ ^[Vv]([0-9]+) ]]; then
                os_folder="MIUI${BASH_REMATCH[1]}"
              fi
              [[ -n "$os_folder" ]] && break
            fi
          done

          if [[ -n "$codename" && -n "$os_folder" ]]; then
            echo "Resolved Port Drive coordinates: codename=${codename} os_folder=${os_folder}"
          else
            echo "::warning::Could not resolve Port Drive coordinates from engine state (codename='${codename}' os_folder='${os_folder}'); the mirror upload will be skipped."
          fi

          # Resolve the Drive link when the upload succeeded. A missing link is a
          # warning: the bytes are already on Drive.
          drive_url=""
          if (( google_status == 0 )) && [[ -n "$codename" && -n "$os_folder" ]]; then
            drive_remote="${RCLONE_REMOTE_NAME}:${RCLONE_UPLOAD_DIR%/}/Port/${codename}/${os_folder}/${final_name}"
            drive_url="$(rclone --config="$PWD/rclone.conf" link "$drive_remote" 2>/dev/null | tail -n1 | tr -d '\r' || true)"
            if [[ -n "$drive_url" ]]; then
              printf 'DEADZONE_GOOGLE_DRIVE_URL=%s\nDEADZONE_RESULT_URL=%s\n' "$drive_url" "$drive_url" >> "$GITHUB_ENV"
              echo "Google Drive URL: $drive_url"
            else
              echo "::warning::Google Drive upload succeeded but the share link could not be resolved."
            fi
          fi

          # Secondary mirrors are attempted whenever Drive did not yield a usable
          # public link.
          #
          # `upload-mirrors.sh` exits 0 as a deliberate no-op pass while
          # DEADZONE_ENABLE_SECONDARY_MIRRORS is not "1", so its exit status
          # cannot be used to decide whether a fallback actually served the
          # artifact. Relying on it would report a build as published when
          # nothing was uploaded at all. The only trustworthy signal is whether
          # it published a URL, which it appends to $GITHUB_ENV.
          mirror_status=0
          mirror_url=""
          if (( google_status != 0 )) || [[ -z "$drive_url" ]]; then
            if [[ -n "$codename" && -n "$os_folder" ]]; then
              echo "Google Drive is not a usable destination; attempting the configured fallback mirror."
              set +e
              bash "$GITHUB_WORKSPACE/runtime/upload-mirrors.sh" \
                "Port" "$codename" "$os_folder" "$final_zip" "$final_name" \
                2>&1 | tee -a build_action.log
              mirror_status=${PIPESTATUS[0]}
              set -e
              # Read the mirror URLs straight out of the file the mirror helper
              # just appended to. Reading the environment would not work: the
              # GITHUB_ENV values are not visible until the next step.
              if [[ -s "$GITHUB_ENV" ]]; then
                mirror_url="$(grep -E '^(DEADZONE_SOURCEFORGE_URL|DEADZONE_PIXELDRAIN_URL)=' "$GITHUB_ENV" \
                  | tail -n1 | cut -d= -f2- || true)"
              fi
              if [[ -n "$mirror_url" ]]; then
                # `upload-mirrors.sh` only promotes its own URL to
                # DEADZONE_RESULT_URL when DEADZONE_SET_RESULT_URL=1, and it is
                # invoked here precisely in the case where Drive did not produce
                # a link. Export the flag and also write the URL directly so the
                # downstream reporter and the build summary both see a download
                # link regardless of the mirror helper's internal default.
                export DEADZONE_SET_RESULT_URL=1
                printf 'DEADZONE_RESULT_URL=%s\n' "$mirror_url" >> "$GITHUB_ENV"
                echo "Fallback mirror published the artifact: $mirror_url"
              else
                echo "::warning::The fallback mirror reported status ${mirror_status} but published no URL."
              fi
            else
              echo "::warning::Skipping the fallback mirror because the Port identity state is unavailable."
            fi
          else
            echo "Google Drive succeeded; secondary mirrors are not required."
          fi

          # Terminal verdict. The artifact counts as published only when a Drive
          # link or a mirror URL was actually produced; otherwise report which
          # destinations were tried and fail.
          if [[ -z "$drive_url" && -z "$mirror_url" ]]; then
            if (( google_status != 0 )); then
              echo "::error::No upload destination succeeded. Google Drive failed (status ${google_status}); the fallback mirror published no URL (DEADZONE_ENABLE_SECONDARY_MIRRORS=${DEADZONE_ENABLE_SECONDARY_MIRRORS:-0}). The artifact was built and checksummed but is not publicly reachable."
            else
              echo "::error::Google Drive reported success (status 0) but no shareable link could be resolved, and the fallback mirror published no URL. The artifact is not publicly reachable."
            fi
            exit 1
          fi

      - name: "✅ Report successful Port build"
        if: success()
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          set -euo pipefail
          python3 notify.py success "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_STOCK_ROM_URL" "port" "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"
          # Terminal succeeded event with the output metadata. The
          # helper is best-effort: a callback failure must not
          # fail a build that already produced a usable artifact.
          python3 runtime/build_stage.py uploading \
            --project port_xiaomi \
            --request-id "$DEADZONE_REQUEST_ID" \
            --message "Upload complete" || true
          python3 runtime/report_build_event.py succeeded \
            --project port_xiaomi \
            --message "Port build complete." || true

      - name: "❌ Report failed Port build"
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          [[ -n "${DEADZONE_EVENT_SECRET:-}" ]] || {
            echo '::error::Terminal Port event cannot be signed because the central event secret is unavailable.'
            exit 1
          }
          python3 runtime/report_build_event.py failed \
            --project port_xiaomi \
            --message "Port ROM build failed."

      - name: "⛔ Report cancelled Port build"
        if: cancelled()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          [[ -n "${DEADZONE_EVENT_SECRET:-}" ]] || {
            echo '::error::Terminal Port event cannot be signed because the central event secret is unavailable.'
            exit 1
          }
          python3 runtime/report_build_event.py cancelled \
            --project port_xiaomi \
            --message "Port ROM build cancelled."

      - name: "🧹 Cleanup Port workspace"
        if: always()
        run: |
          set -Euo pipefail
          # The build tree is created by sudo'd steps, so the runner user cannot
          # remove it. A cleanup failure must never mask the real build verdict
          # (this step previously reported "Permission denied" for tens of
          # thousands of files and turned every build red), so it escalates
          # through sudo and then downgrades to a warning.
          sudo -E rm -rf toolbuild runtime 2>/dev/null || true
          if [[ -e toolbuild/rclone.conf ]]; then
            sudo -E rm -f toolbuild/rclone.conf 2>/dev/null || true
          fi
          if [[ -d toolbuild || -d runtime ]]; then
            echo "::warning::Port workspace cleanup was incomplete; the runner is ephemeral so no action is required."
          fi

      - name: "📣 Build summary"
        if: always()
        shell: bash
        env:
          DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
          DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
          DEADZONE_RESULT_NAME: ${{ env.DEADZONE_RESULT_NAME }}
          DEADZONE_GOOGLE_UPLOAD_STATUS: ${{ env.DEADZONE_GOOGLE_UPLOAD_STATUS }}
          DEADZONE_GOOGLE_DRIVE_URL: ${{ env.DEADZONE_GOOGLE_DRIVE_URL }}
          DEADZONE_RESULT_URL: ${{ env.DEADZONE_RESULT_URL }}
        run: |
          {
            echo "## 🔂 DeadZone-Xiaomi-Port build"
            echo
            echo "- Project: \`DeadZone-Xiaomi-Port\`"
            echo "- Engine repository: \`DeadZone-Offical/DeadZone-xiaomi_Port\`"
            echo "- Request ID: \`${DEADZONE_REQUEST_ID}\`"
            echo "- Builder: \`${DEADZONE_BUILDER_NAME:-anonymous}\`"
            [[ -n "${DEADZONE_RESULT_NAME:-}" ]] && echo "- Final ZIP: \`${DEADZONE_RESULT_NAME}\`"
            [[ -n "${DEADZONE_GOOGLE_UPLOAD_STATUS:-}" ]] && echo "- Google Drive status: \`${DEADZONE_GOOGLE_UPLOAD_STATUS}\`"
            [[ -n "${DEADZONE_GOOGLE_DRIVE_URL:-}" ]] && echo "- Drive URL: ${DEADZONE_GOOGLE_DRIVE_URL}"
            [[ -n "${DEADZONE_RESULT_URL:-}" ]] && echo "- Download URL: ${DEADZONE_RESULT_URL}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"